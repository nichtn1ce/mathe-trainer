topic({
  id: 'lagrange', group: 'Mehrdim. Analysis', name: 'Lagrange-Optimierung', icon: 'i-t-lagrange',
  sub: 'Nutzen maximieren, Kosten minimieren — mit Nebenbedingung.',
  variants: [
    { id: 'cobb', name: 'Nutzenmaximierung', desc: 'Cobb-Douglas mit Budgetgeraden.' },
    { id: 'lambda', name: 'Multiplikator λ', desc: 'Der Schattenpreis des Budgets.' },
    { id: 'kosten', name: 'Kostenminimierung', desc: 'Vorgegebene Menge zu kleinsten Kosten.' },
  ],
  formulas: [
    st('Ansatz', 'L(x, y, λ) = f(x, y) − λ·(g(x, y) − c)'),
    st('Bedingungen', 'L<sub>x</sub> = 0, L<sub>y</sub> = 0, L<sub>λ</sub> = 0 (die Nebenbedingung selbst)'),
    st('Cobb-Douglas', 'Für U = x<sup>a</sup>y<sup>b</sup> und p<sub>1</sub>x + p<sub>2</sub>y = m gilt<br>x<sup>*</sup> = '
      + fracHTML('a', 'a+b') + '·' + fracHTML('m', 'p<sub>1</sub>') + ' &nbsp;·&nbsp; y<sup>*</sup> = '
      + fracHTML('b', 'a+b') + '·' + fracHTML('m', 'p<sub>2</sub>')),
    st('Bedeutung von λ', 'λ gibt an, um wie viel der Zielwert steigt, wenn das Budget um 1 wächst.'),
  ],
  gen: function (d, v) { return genLagrange(d, v); }
});

function genLagrange(d, v) {
  /* Zahlen so waehlen, dass x* und y* glatt werden */
  const a = ri(1, 3), b = ri(1, 3);
  const S = a + b;
  const p1 = pick([1, 2, 4, 5, 10]), p2 = pick([1, 2, 4, 5, 10]);
  const k = ri(2, d <= 4 ? 6 : 12);
  const m = S * k * Math.max(p1, p2);           /* m/(S·p) bleibt ganzzahlig */
  const xs = a * m / (S * p1), ys = b * m / (S * p2);
  if (!isNice(xs) || !isNice(ys)) return genLagrange(d, v);

  const uHTML = 'U(' + V() + ', ' + Y() + ') = ' + pw(V(), a) + '·' + pw(Y(), b);
  const nbHTML = coefHTML(p1, V(), true) + coefHTML(p2, Y(), false) + ' = ' + m;

  if (v === 'kosten') {
    /* Kosten minimieren bei vorgegebenem Nutzenniveau: gleiche Struktur, Ausgabe x*, y* */
    const q = ri(2, d <= 5 ? 5 : 9);
    const xk = q * p2, yk = q * p1;             /* Tangentialbedingung a/b · y/x = p1/p2 → hier a=b=1 */
    return {
      promptHTML: '<span class="big">Kosten K = ' + coefHTML(p1, V(), true) + coefHTML(p2, Y(), false)
        + ' minimieren<br>unter ' + V() + '·' + Y() + ' = ' + (xk * yk) + '</span>', wordy: true,
      fields: [Fnum('<i>x</i>* =', 'Menge'), Fnum('<i>y</i>* =', 'Menge')],
      check: checkMulti([xk, yk]),
      solHTML: V() + '<sup>*</sup> = ' + valHTML(xk) + ', ' + Y() + '<sup>*</sup> = ' + valHTML(yk) + ', K = ' + valHTML(p1 * xk + p2 * yk),
      steps: [
        st('Ansatz', 'L = ' + coefHTML(p1, V(), true) + coefHTML(p2, Y(), false) + ' − λ·(' + V() + Y() + ' − ' + (xk * yk) + ')'),
        st('Ableiten', 'L<sub>x</sub> = ' + p1 + ' − λ' + Y() + ' = 0 &nbsp;·&nbsp; L<sub>y</sub> = ' + p2 + ' − λ' + V() + ' = 0'),
        st('Verhältnis', fracHTML(p1, p2) + ' = ' + fracHTML(Y(), V()) + ' → ' + Y() + ' = ' + fracHTML(p1, p2) + '·' + V()),
        st('Einsetzen', V() + '·' + fracHTML(p1, p2) + V() + ' = ' + (xk * yk) + ' → ' + V() + ' = ' + num(xk)),
        st('Ergebnis', '<b>' + V() + '<sup>*</sup> = ' + valHTML(xk) + ', ' + Y() + '<sup>*</sup> = ' + valHTML(yk) + '</b>, Kosten ' + valHTML(p1 * xk + p2 * yk))
      ]
    };
  }

  const steps = [
    st('Ansatz', 'L = ' + pw(V(), a) + pw(Y(), b) + ' − λ·(' + coefHTML(p1, V(), true) + coefHTML(p2, Y(), false) + ' − ' + m + ')'),
    st('Optimalitätsbedingung', fracHTML('a·' + Y(), 'b·' + V()) + ' = ' + fracHTML('p<sub>1</sub>', 'p<sub>2</sub>')
      + ' → ' + Y() + ' = ' + fracHTML(b + '·' + p1, a + '·' + p2) + '·' + V()),
    st('In die Nebenbedingung', coefHTML(p1, V(), true) + ' + ' + p2 + '·' + fracHTML(b + '·' + p1, a + '·' + p2) + V() + ' = ' + m),
    st('Auflösen', V() + '<sup>*</sup> = ' + fracHTML(a, S) + '·' + fracHTML(m, p1) + ' = <b>' + valHTML(xs) + '</b>'),
    st('Zweite Variable', Y() + '<sup>*</sup> = ' + fracHTML(b, S) + '·' + fracHTML(m, p2) + ' = <b>' + valHTML(ys) + '</b>')
  ];

  const plotL = { kind: 'contour', f: (x, y) => (x > 0 && y > 0 ? Math.pow(x, a) * Math.pow(y, b) : NaN),
    point: { x: xs, y: ys }, line: { a: p1, b: p2, c: m },
    pointLabel: 'Optimum (x*, y*)', lineLabel: 'Budgetgerade', levelLabel: 'Indifferenzkurve',
    box: [-(m / p1) * 0.12, (m / p1) * 1.18, -(m / p2) * 0.12, (m / p2) * 1.18] };
  if (v === 'lambda') {
    /* λ = a/(p1·x*) · U(x*,y*)  → aus L_x = 0: a x^(a-1) y^b = λ p1 */
    const U = Math.pow(xs, a) * Math.pow(ys, b);
    const lam = a * U / (xs * p1);
    if (!isNice(lam)) return genLagrange(d, v);
    return {
      plot: plotL,
      promptHTML: '<span class="big">' + uHTML + '<br>Nebenbedingung: ' + nbHTML + '</span>', mid: true,
      fields: [Fnum('<i>x</i>* =', 'Menge'), Fnum('<i>y</i>* =', 'Menge'), Fnum('λ =', 'Multiplikator')],
      check: checkMulti([xs, ys, lam], 1e-3),
      solHTML: V() + '<sup>*</sup> = ' + valHTML(xs) + ', ' + Y() + '<sup>*</sup> = ' + valHTML(ys) + ', λ = ' + fmt(lam, 4),
      steps: steps.concat([
        st('λ bestimmen', 'aus L<sub>x</sub> = 0: λ = ' + fracHTML('a·U', 'p<sub>1</sub>·' + V() + '<sup>*</sup>') + ' = <b>' + fmt(lam, 4) + '</b>'),
        st('Bedeutung', 'Ein Euro mehr Budget hebt den Nutzen um etwa ' + fmt(lam, 4) + '.')
      ])
    };
  }

  return {
    plot: plotL,
    promptHTML: '<span class="big">' + uHTML + '<br>Nebenbedingung: ' + nbHTML + '</span>', mid: true,
    fields: [Fnum('<i>x</i>* =', 'Menge'), Fnum('<i>y</i>* =', 'Menge')],
    check: checkMulti([xs, ys]),
    solHTML: V() + '<sup>*</sup> = ' + valHTML(xs) + ', ' + Y() + '<sup>*</sup> = ' + valHTML(ys),
    steps: steps
  };
}

/* ============================================================
   MATRIZEN — Rechnen
   ============================================================ */
function randMat(r, c, lo, hi) {
  const m = [];
  for (let i = 0; i < r; i++) { const row = []; for (let j = 0; j < c; j++) row.push(ri(lo, hi)); m.push(row); }
  return m;
}
function mapMat(m, f) { return m.map((r, i) => r.map((v, j) => f(v, i, j))); }
function numMat(m) { return mapMat(m, v => num(v)); }
function matMul(A, B) {
  const out = [];
  for (let i = 0; i < A.length; i++) {
    const row = [];
    for (let j = 0; j < B[0].length; j++) {
      let s = 0; for (let k = 0; k < B.length; k++) s += A[i][k] * B[k][j];
      row.push(s);
    }
    out.push(row);
  }
  return out;
}
function transp(A) { return A[0].map((_, j) => A.map(r => r[j])); }
function det2(A) { return A[0][0] * A[1][1] - A[0][1] * A[1][0]; }
function det3(A) {
  return A[0][0] * (A[1][1] * A[2][2] - A[1][2] * A[2][1])
    - A[0][1] * (A[1][0] * A[2][2] - A[1][2] * A[2][0])
    + A[0][2] * (A[1][0] * A[2][1] - A[1][1] * A[2][0]);
}

topic({
  id: 'matrix', group: 'Lineare Algebra', name: 'Matrizen-Rechnung', icon: 'i-t-matrix',
  sub: 'Addieren, multiplizieren, transponieren.',
  variants: [
    { id: 'add', name: 'Addition', desc: 'Eintrag für Eintrag addieren.' },
    { id: 'skalar', name: 'Mit Zahl malnehmen', desc: 'Jeden Eintrag mit k multiplizieren.' },
    { id: 'transp', name: 'Transponieren', desc: 'Zeilen und Spalten tauschen.' },
    { id: 'mult', name: 'Multiplikation', desc: 'Zeile mal Spalte.' },
  ],
  formulas: [
    st('Addition', 'Nur bei gleichem Format — Eintrag für Eintrag.'),
    st('Multiplikation', '(A·B)<sub>ij</sub> = Zeile <i>i</i> von A · Spalte <i>j</i> von B. Spaltenzahl von A = Zeilenzahl von B.'),
    st('Transponieren', '(A<sup>T</sup>)<sub>ij</sub> = A<sub>ji</sub> — die Matrix wird an der Diagonale gespiegelt.'),
    st('Achtung', 'A·B ist im Allgemeinen <b>nicht</b> gleich B·A.'),
  ],
  gen: function (d, v) { return genMatrix(d, v); }
});

function genMatrix(d, v) {
  const R = d <= 3 ? 5 : (d <= 6 ? 9 : 12);
  const n = d <= 5 ? 2 : (coin() ? 2 : 3);

  if (v === 'transp') {
    const r = d <= 4 ? 2 : ri(2, 3), c = d <= 4 ? 3 : ri(2, 3);
    const A = randMat(r, c, -R, R);
    const T = transp(A);
    return {
      promptHTML: '<span class="big">A = ' + matHTML(numMat(A)) + '</span><p class="qtext">Gesucht: A<sup>T</sup></p>',
      fields: [Fmat(c, r, 'A<sup>T</sup>')], check: checkMat(T),
      solHTML: 'A<sup>T</sup> = ' + matHTML(numMat(T)),
      steps: [
        st('Regel', 'Die erste Zeile von A wird zur ersten Spalte von A<sup>T</sup>.'),
        st('Format', r + '×' + c + ' wird zu ' + c + '×' + r + '.'),
        st('Ergebnis', '<b>' + matHTML(numMat(T)) + '</b>')
      ]
    };
  }

  if (v === 'skalar') {
    const A = randMat(n, n, -R, R), k = rnz(-5, 5);
    const K = mapMat(A, x => k * x);
    return {
      promptHTML: '<span class="big">' + num(k) + ' · ' + matHTML(numMat(A)) + '</span>',
      fields: [Fmat(n, n, 'Ergebnis')], check: checkMat(K),
      solHTML: matHTML(numMat(K)),
      steps: [
        st('Regel', 'Jeder einzelne Eintrag wird mit ' + num(k) + ' multipliziert.'),
        st('Ergebnis', '<b>' + matHTML(numMat(K)) + '</b>')
      ]
    };
  }

  if (v === 'mult') {
    const A = randMat(n, n, d <= 5 ? -4 : -7, d <= 5 ? 4 : 7);
    const B = randMat(n, n, d <= 5 ? -4 : -7, d <= 5 ? 4 : 7);
    const P = matMul(A, B);
    return {
      promptHTML: '<span class="big">' + matHTML(numMat(A)) + ' · ' + matHTML(numMat(B)) + '</span>',
      fields: [Fmat(n, n, 'A · B')], check: checkMat(P),
      solHTML: matHTML(numMat(P)),
      steps: [
        st('Regel', 'Eintrag oben links = 1. Zeile von A mal 1. Spalte von B.'),
        st('Beispiel', '(' + A[0].map(num).join(' ; ') + ') · (' + B.map(r => num(r[0])).join(' ; ') + ') = '
          + sumChain(A[0].map((x, k2) => paren(x) + '·' + paren(B[k2][0]))) + ' = ' + num(P[0][0])),
        st('Ergebnis', '<b>' + matHTML(numMat(P)) + '</b>')
      ]
    };
  }

  /* add */
  const A = randMat(n, n, -R, R), B = randMat(n, n, -R, R);
  const minus = d > 4 && coin();
  const S = mapMat(A, (x, i, j) => minus ? x - B[i][j] : x + B[i][j]);
  return {
    promptHTML: '<span class="big">' + matHTML(numMat(A)) + (minus ? ' <span class="op">−</span> ' : ' <span class="op">+</span> ')
      + matHTML(numMat(B)) + '</span>',
    fields: [Fmat(n, n, 'Ergebnis')], check: checkMat(S),
    solHTML: matHTML(numMat(S)),
    steps: [
      st('Regel', 'Gleiche Positionen werden ' + (minus ? 'subtrahiert' : 'addiert') + '.'),
      st('Erster Eintrag', num(A[0][0]) + (minus ? ' − ' : ' + ') + paren(B[0][0]) + ' = ' + num(S[0][0])),
      st('Ergebnis', '<b>' + matHTML(numMat(S)) + '</b>')
    ]
  };
}

topic({
  id: 'determinante', group: 'Lineare Algebra', name: 'Determinante & Inverse', icon: 'i-t-det',
  sub: 'Determinanten von 2×2 und 3×3, Inverse einer 2×2.',
  variants: [
    { id: 'det2', name: 'Determinante 2×2', desc: 'ad − bc.' },
    { id: 'det3', name: 'Determinante 3×3', desc: 'Regel von Sarrus.' },
    { id: 'inv', name: 'Inverse 2×2', desc: 'Tauschen, Vorzeichen, durch die Determinante.' },
    { id: 'regulaer', name: 'Invertierbar?', desc: 'Determinante null oder nicht.' },
  ],
  formulas: [
    st('2×2', 'det ' + matHTML([['a', 'b'], ['c', 'd']]) + ' = a·d − b·c'),
    st('Sarrus (3×3)', 'Die ersten beiden Spalten rechts anhängen, dann drei Diagonalen nach rechts unten addieren und drei nach rechts oben abziehen.'),
    st('Inverse 2×2', 'A<sup>−1</sup> = ' + fracHTML('1', 'det A') + '·' + matHTML([['d', '−b'], ['−c', 'a']])),
    st('Invertierbar', 'Genau dann, wenn det A ≠ 0.'),
  ],
  gen: function (d, v) { return genDet(d, v); }
});

function genDet(d, v) {
  const R = d <= 3 ? 5 : (d <= 6 ? 8 : 12);

  if (v === 'det3') {
    const A = randMat(3, 3, d <= 6 ? -4 : -7, d <= 6 ? 4 : 7);
    const D = det3(A);
    return {
      promptHTML: '<span class="big">det ' + matHTML(numMat(A)) + '</span>',
      fields: [Fnum('det A =', 'Zahl')], check: checkNum(D),
      solHTML: 'det A = ' + num(D),
      steps: [
        st('Entwicklung nach der 1. Zeile', num(A[0][0]) + '·det' + matHTML([[num(A[1][1]), num(A[1][2])], [num(A[2][1]), num(A[2][2])]])
          + ' − ' + paren(A[0][1]) + '·det' + matHTML([[num(A[1][0]), num(A[1][2])], [num(A[2][0]), num(A[2][2])]])
          + ' + ' + paren(A[0][2]) + '·det' + matHTML([[num(A[1][0]), num(A[1][1])], [num(A[2][0]), num(A[2][1])]])),
        st('Unterdeterminanten', num(A[1][1] * A[2][2] - A[1][2] * A[2][1]) + ', ' + num(A[1][0] * A[2][2] - A[1][2] * A[2][0])
          + ', ' + num(A[1][0] * A[2][1] - A[1][1] * A[2][0])),
        st('Ergebnis', 'det A = <b>' + num(D) + '</b>')
      ]
    };
  }

  if (v === 'inv') {
    /* Determinante klein halten, damit die Eintraege glatt bleiben */
    let A, D, tries = 0;
    do { A = randMat(2, 2, -R, R); D = det2(A); tries++; }
    while ((D === 0 || !isNice(A[1][1] / D) || !isNice(A[0][0] / D) || !isNice(A[0][1] / D) || !isNice(A[1][0] / D)) && tries < 400);
    if (D === 0) return genDet(d, 'det2');
    const I = [[A[1][1] / D, -A[0][1] / D], [-A[1][0] / D, A[0][0] / D]];
    return {
      promptHTML: '<span class="big">A = ' + matHTML(numMat(A)) + '</span><p class="qtext">Gesucht: A<sup>−1</sup></p>',
      fields: [Fmat(2, 2, 'A<sup>−1</sup>')], check: checkMat(I),
      solHTML: 'A<sup>−1</sup> = ' + matHTML(I.map(r => r.map(valHTML))),
      steps: [
        st('Determinante', 'det A = ' + num(A[0][0]) + '·' + paren(A[1][1]) + ' − ' + paren(A[0][1]) + '·' + paren(A[1][0]) + ' = <b>' + num(D) + '</b>'),
        st('Umstellen', 'Hauptdiagonale tauschen, Nebendiagonale mit −1: ' + matHTML([[num(A[1][1]), num(-A[0][1])], [num(-A[1][0]), num(A[0][0])]])),
        st('Durch die Determinante', 'A<sup>−1</sup> = ' + fracHTML(1, num(D)) + '·' + matHTML([[num(A[1][1]), num(-A[0][1])], [num(-A[1][0]), num(A[0][0])]])),
        st('Ergebnis', '<b>' + matHTML(I.map(r => r.map(valHTML))) + '</b>')
      ]
    };
  }

  if (v === 'regulaer') {
    const sing = coin();
    let A;
    if (sing) { const r1 = [rnz(-5, 5), rnz(-5, 5)]; let k = rnz(-4, 4); if (k === 1) k = 2; A = [r1, [r1[0] * k, r1[1] * k]]; }
    else { do { A = randMat(2, 2, -R, R); } while (det2(A) === 0); }
    const D = det2(A);
    const opts = ['Ja, sie ist invertierbar', 'Nein, det A = 0'];
    return {
      promptHTML: '<span class="big">A = ' + matHTML(numMat(A)) + '</span><p class="qtext">Ist A invertierbar?</p>',
      fields: [Fmc(opts, 'Antwort wählen')], check: checkMC(D === 0 ? 1 : 0),
      solHTML: 'det A = ' + num(D) + ' → ' + (D === 0 ? 'nicht invertierbar' : 'invertierbar'),
      steps: [
        st('Determinante', num(A[0][0]) + '·' + paren(A[1][1]) + ' − ' + paren(A[0][1]) + '·' + paren(A[1][0]) + ' = ' + num(D)),
        st('Kriterium', 'det A ≠ 0 → invertierbar; det A = 0 → nicht invertierbar.'),
        st('Ergebnis', '<b>' + (D === 0 ? 'nicht invertierbar' : 'invertierbar') + '</b>')
      ]
    };
  }

  /* det2 */
  const A = randMat(2, 2, -R, R);
  const D = det2(A);
  return {
    promptHTML: '<span class="big">det ' + matHTML(numMat(A)) + '</span>',
    fields: [Fnum('det A =', 'Zahl')], check: checkNum(D),
    solHTML: 'det A = ' + num(D),
    steps: [
      st('Formel', 'a·d − b·c'),
      st('Einsetzen', num(A[0][0]) + '·' + paren(A[1][1]) + ' − ' + paren(A[0][1]) + '·' + paren(A[1][0])
        + ' = ' + num(A[0][0] * A[1][1]) + ' − ' + paren(A[0][1] * A[1][0])),
      st('Ergebnis', 'det A = <b>' + num(D) + '</b>')
    ]
  };
}

topic({
  id: 'gauss', group: 'Lineare Algebra', name: 'Gauß-Verfahren', icon: 'i-t-gauss',
  sub: 'Lineare Gleichungssysteme mit drei Unbekannten.',
  variants: [
    { id: 'zwei', name: 'Zwei Gleichungen', desc: 'Einstieg mit zwei Unbekannten.' },
    { id: 'drei', name: 'Drei Gleichungen', desc: 'Stufenform herstellen, dann rückwärts einsetzen.' },
    { id: 'art', name: 'Lösbarkeit', desc: 'Eindeutig, keine oder unendlich viele Lösungen?' },
  ],
  formulas: [
    st('Ziel', 'Durch Zeilenumformungen eine Stufenform erzeugen, dann von unten nach oben einsetzen.'),
    st('Erlaubt', 'Zeilen tauschen · Zeile mit einer Zahl ≠ 0 multiplizieren · Vielfaches einer Zeile addieren.'),
    st('Lösbarkeit', 'Widerspruchszeile (0 = c mit c ≠ 0) → keine Lösung.<br>Nullzeile (0 = 0) → unendlich viele Lösungen.'),
  ],
  gen: function (d, v) { return genGauss(d, v); }
});

function genGauss(d, v) {
  if (v === 'art') {
    const kind = pick(['eindeutig', 'keine', 'unendlich']);
    const a = [rnz(-4, 4), rnz(-4, 4)], k = ri(2, 3);
    let b, r1, r2;
    if (kind === 'eindeutig') { b = [rnz(-4, 4), rnz(-4, 4)]; while (a[0] * b[1] - a[1] * b[0] === 0) b = [rnz(-4, 4), rnz(-4, 4)]; r1 = rnz(-9, 9); r2 = rnz(-9, 9); }
    else { b = [a[0] * k, a[1] * k]; r1 = rnz(-9, 9); r2 = kind === 'unendlich' ? r1 * k : r1 * k + rnz(1, 4); }
    const opts = ['genau eine Lösung', 'keine Lösung', 'unendlich viele Lösungen'];
    const idx = kind === 'eindeutig' ? 0 : (kind === 'keine' ? 1 : 2);
    return {
      promptHTML: '<span class="big">' + coefHTML(a[0], V(), true) + coefHTML(a[1], Y(), false) + ' = ' + num(r1) + '<br>'
        + coefHTML(b[0], V(), true) + coefHTML(b[1], Y(), false) + ' = ' + num(r2) + '</span>', mid: true,
      fields: [Fmc(opts, 'Wie viele Lösungen?')], check: checkMC(idx),
      solHTML: opts[idx],
      steps: [
        st('Zweite Zeile ansehen', kind === 'eindeutig'
          ? 'Die Zeilen sind keine Vielfachen voneinander.'
          : 'Zeile 2 ist das ' + k + '-fache von Zeile 1 auf der linken Seite.'),
        st('Rechte Seite', kind === 'eindeutig' ? 'Zwei unabhängige Gleichungen, zwei Unbekannte.'
          : (kind === 'unendlich' ? 'Auch rechts passt der Faktor ' + k + ' → dieselbe Gleichung.'
            : 'Rechts passt der Faktor <i>nicht</i> → Widerspruch.')),
        st('Ergebnis', '<b>' + opts[idx] + '</b>')
      ]
    };
  }

  const n = v === 'zwei' ? 2 : 3;
  const R = d <= 4 ? 3 : (d <= 7 ? 5 : 8);
  const sol = []; for (let i = 0; i < n; i++) sol.push(rnz(-R, R));
  let A, tries = 0;
  do { A = randMat(n, n, -4, 4); tries++; }
  while ((n === 2 ? det2(A) === 0 : det3(A) === 0) && tries < 200);
  const rhs = A.map(row => row.reduce((s, c, j) => s + c * sol[j], 0));
  const names = [V(), Y(), '<i>z</i>'];
  const rowHTML = (row, r) => {
    let h = ''; let first = true;
    row.forEach((c, j) => { if (c === 0) return; h += coefHTML(c, names[j], first); first = false; });
    if (!h) h = '0';
    return h + ' = ' + num(r);
  };
  /* Bei zwei Unbekannten lassen sich beide Gleichungen als Geraden zeichnen —
     aber nur, wenn sich jede Zeile nach y auflösen lässt (y-Koeffizient ≠ 0). */
  const plotG = (n === 2 && A[0][1] !== 0 && A[1][1] !== 0) ? {
    fns: [{ f: x => (rhs[0] - A[0][0] * x) / A[0][1], label: 'Gleichung 1' },
    { f: x => (rhs[1] - A[1][0] * x) / A[1][1], label: 'Gleichung 2', color: 2 }],
    points: [{ x: sol[0], y: sol[1] }]
  } : undefined;
  return {
    promptHTML: '<span class="big">' + A.map((row, i) => rowHTML(row, rhs[i])).join('<br>') + '</span>', mid: true,
    fields: names.slice(0, n).map((nm, i) => Fnum(nm + ' =', 'Zahl')),
    check: checkMulti(sol),
    plot: plotG,
    solHTML: names.slice(0, n).map((nm, i) => nm + ' = ' + num(sol[i])).join(', '),
    steps: [
      st('Stufenform', 'Vielfache der ersten Zeile von den anderen abziehen, bis unter der Diagonale nur Nullen stehen.'),
      st('Rückwärts einsetzen', 'Aus der letzten Zeile ' + names[n - 1] + ' = ' + num(sol[n - 1]) + ' ablesen, dann nach oben einsetzen.'),
      st('Ergebnis', '<b>' + names.slice(0, n).map((nm, i) => nm + ' = ' + num(sol[i])).join(', ') + '</b>')
    ]
  };
}

function bigOpHTML(sym, from, to, body) {
  return '<span class="bigop"><span class="bt">' + to + '</span><span class="bo">' + sym
    + '</span><span class="bb">i&#8202;=&#8202;' + from + '</span></span>'
    + '<span class="bopb">' + body + '</span>';
}
function sumHTML(from, to, body) { return bigOpHTML('∑', from, to, body); }
function prodHTML(from, to, body) { return bigOpHTML('∏', from, to, body); }

topic({
  id: 'summen', group: 'Grundlagen', name: 'Summen & Produkte', icon: 'i-t-summe',
  sub: 'Das Summen- und das Produktzeichen ausrechnen.',
  variants: [
    { id: 'linear', name: 'Summe ausrechnen', desc: 'Glieder einsetzen und addieren.' },
    { id: 'formel', name: 'Summenformeln', desc: 'Gaußsche Summenformel statt Einzelrechnung.' },
    { id: 'geo', name: 'Geometrische Summe', desc: 'Summe über qⁱ.' },
    { id: 'produkt', name: 'Produktzeichen', desc: 'Faktoren multiplizieren.' },
  ],
  formulas: [
    st('Bedeutung', sumHTML('1', 'n', 'a<sub>i</sub>') + ' = a<sub>1</sub> + a<sub>2</sub> + … + a<sub>n</sub>'),
    st('Gaußsche Summenformel', sumHTML('1', 'n', 'i') + ' = ' + fracHTML('n(n+1)', '2')),
    st('Quadratsummen', sumHTML('1', 'n', 'i²') + ' = ' + fracHTML('n(n+1)(2n+1)', '6')),
    st('Geometrische Summe', sumHTML('0', 'n', 'q<sup>i</sup>') + ' = ' + fracHTML('q<sup>n+1</sup> − 1', 'q − 1') + ' (q ≠ 1)'),
    st('Konstante', sumHTML('1', 'n', 'c') + ' = n·c &nbsp;·&nbsp; ' + prodHTML('1', 'n', 'i') + ' = n!'),
  ],
  gen: function (d, v) { return genSummen(d, v); }
});

function genSummen(d, v) {
  if (v === 'produkt') {
    const n = ri(3, d <= 5 ? 5 : 7);
    if (coin()) {
      let val = 1; for (let i = 1; i <= n; i++) val *= i;
      return {
        promptHTML: '<span class="big">' + prodHTML(1, n, '<i>i</i>') + '</span>',
        fields: [Fnum('=', 'Zahl')], check: checkNum(val), solHTML: num(val),
        steps: [
          st('Ausschreiben', Array.from({ length: n }, (_, i) => i + 1).join(' · ')),
          st('Das ist die Fakultät', n + '! = ' + val),
          st('Ergebnis', '<b>' + num(val) + '</b>')
        ]
      };
    }
    const c = ri(2, 4);
    let val = 1; for (let i = 1; i <= n; i++) val *= c * i;
    if (val > 1e6) return genSummen(d, v);      /* Ergebnis soll noch handhabbar bleiben */
    return {
      promptHTML: '<span class="big">' + prodHTML(1, n, coefHTML(c, '<i>i</i>', true)) + '</span>',
      fields: [Fnum('=', 'Zahl')], check: checkNum(val), solHTML: num(val),
      steps: [
        st('Faktor herausziehen', c + ' kommt ' + n + '-mal vor: ' + c + '<sup>' + n + '</sup> · ' + n + '!'),
        st('Rechnen', Math.pow(c, n) + ' · ' + (val / Math.pow(c, n)) + ' = ' + val),
        st('Ergebnis', '<b>' + num(val) + '</b>')
      ]
    };
  }

  if (v === 'geo') {
    const q = pick(d <= 5 ? [2, 3] : [2, 3, 4, 5]);
    const n = ri(2, d <= 5 ? 4 : 6);
    let val = 0; for (let i = 0; i <= n; i++) val += Math.pow(q, i);
    return {
      plot: { fns: [{ f: x => Math.pow(q, x), label: q + '^i' }],
        points: Array.from({ length: n + 1 }, (_, k) => ({ x: k, y: Math.pow(q, k) })) },
      promptHTML: '<span class="big">' + sumHTML(0, n, pw(String(q), '<i>i</i>')) + '</span>',
      fields: [Fnum('=', 'Zahl')], check: checkNum(val), solHTML: num(val),
      steps: [
        st('Ausschreiben', Array.from({ length: n + 1 }, (_, i) => Math.pow(q, i)).join(' + ')),
        st('Formel', fracHTML(q + '<sup>' + (n + 1) + '</sup> − 1', q + ' − 1') + ' = ' + fracHTML(Math.pow(q, n + 1) - 1, q - 1)),
        st('Ergebnis', '<b>' + num(val) + '</b>')
      ]
    };
  }

  if (v === 'formel') {
    const n = ri(5, d <= 4 ? 12 : (d <= 7 ? 30 : 60));
    const quad = d > 5 && coin();
    let val = 0; for (let i = 1; i <= n; i++) val += quad ? i * i : i;
    return {
      plot: { fns: [{ f: x => (quad ? x * x : x), label: quad ? 'i²' : 'i' }],
        points: [{ x: n, y: quad ? n * n : n }] },
      promptHTML: '<span class="big">' + sumHTML(1, n, quad ? '<i>i</i>²' : '<i>i</i>') + '</span>',
      fields: [Fnum('=', 'Zahl')], check: checkNum(val), solHTML: num(val),
      steps: [
        st('Formel', quad ? fracHTML('n(n+1)(2n+1)', '6') : fracHTML('n(n+1)', '2')),
        st('Einsetzen', quad ? fracHTML(n + '·' + (n + 1) + '·' + (2 * n + 1), 6) : fracHTML(n + '·' + (n + 1), 2)),
        st('Ergebnis', '<b>' + num(val) + '</b>')
      ]
    };
  }

  /* linear */
  const from = d <= 3 ? 1 : ri(1, 3);
  const to = from + ri(2, d <= 5 ? 4 : 6);
  const a = rnz(-4, 4), b = rnz(-6, 6);
  let val = 0; for (let i = from; i <= to; i++) val += a * i + b;
  const body = coefHTML(a, '<i>i</i>', true) + coefHTML(b, '', false);
  return {
    plot: { fns: [{ f: x => a * x + b, label: 'Glied a·i + b' }],
      points: Array.from({ length: to - from + 1 }, (_, k) => ({ x: from + k, y: a * (from + k) + b })) },
    promptHTML: '<span class="big">' + sumHTML(from, to, '(' + body + ')') + '</span>',
    fields: [Fnum('=', 'Zahl')], check: checkNum(val), solHTML: num(val),
    steps: [
      st('Glieder einsetzen', sumChain(Array.from({ length: to - from + 1 }, (_, k) => a * (from + k) + b))),
      st('Aufteilen', num(a) + '·(' + Array.from({ length: to - from + 1 }, (_, k) => from + k).join('+') + ')'
        + coefHTML((to - from + 1) * b, '', false)),
      st('Ergebnis', '<b>' + num(val) + '</b>')
    ]
  };
}

topic({
  id: 'oekonomie', group: 'Grundlagen', name: 'Ökonomische Funktionen', icon: 'i-t-oeko',
  sub: 'Angebot, Nachfrage, Erlös, Kosten und Gewinn.',
  variants: [
    { id: 'umstellen', name: 'Nachfrage umstellen', desc: 'p(x) nach x auflösen.' },
    { id: 'gleich', name: 'Marktgleichgewicht', desc: 'Angebot = Nachfrage.' },
    { id: 'erloes', name: 'Erlös & Gewinn', desc: 'E = p·x und G = E − K.' },
    { id: 'breakeven', name: 'Break-even', desc: 'Gewinnschwelle: G = 0.' },
  ],
  formulas: [
    st('Erlös', 'E(x) = p(x) · x'),
    st('Gewinn', 'G(x) = E(x) − K(x)'),
    st('Kosten', 'K(x) = K<sub>f</sub> + k<sub>v</sub>·x — Fixkosten plus variable Kosten.'),
    st('Marktgleichgewicht', 'Angebotspreis = Nachfragepreis → Gleichgewichtsmenge x*, dann p* einsetzen.'),
    st('Break-even', 'G(x) = 0 → ab dieser Menge trägt sich die Produktion.'),
  ],
  gen: function (d, v) { return genOeko(d, v); }
});

function genOeko(d, v) {
  if (v === 'umstellen') {
    const a = ri(2, d <= 5 ? 6 : 12), b = ri(2, 10) * (d <= 5 ? 10 : 5);
    const p0 = a * ri(1, 8);
    const x0 = (b - p0) / a;
    if (!isNice(x0) || x0 <= 0) return genOeko(d, v);
    return {
      promptHTML: '<span class="big">Nachfrage: p(' + V() + ') = ' + num(b) + ' <span class="op">−</span> ' + coefHTML(a, V(), true)
        + '<br>Welche Menge wird bei p = ' + p0 + ' nachgefragt?</span>', wordy: true,
      fields: [Fnum('<i>x</i> =', 'Menge')], check: checkNum(x0),
      solHTML: V() + ' = ' + valHTML(x0),
      plot: {
        fns: [{ f: x => b - a * x, label: 'Nachfrage p(x)' }],
        hlines: [{ y: p0 }], points: [{ x: x0, y: p0 }]
      },
      steps: [
        st('Gleichsetzen', p0 + ' = ' + num(b) + ' − ' + num(a) + V()),
        st('Umstellen', num(a) + V() + ' = ' + num(b - p0) + ' → ' + V() + ' = ' + fracHTML(num(b - p0), num(a))),
        st('Ergebnis', '<b>' + V() + ' = ' + valHTML(x0) + '</b>')
      ]
    };
  }

  if (v === 'gleich') {
    const an = ri(1, 5), bn = ri(2, 12) * 5;      /* Nachfrage p = bn - an·x */
    const aa = ri(1, 5), ba = ri(1, 8);           /* Angebot   p = ba + aa·x */
    const xs = (bn - ba) / (an + aa);
    const ps = ba + aa * xs;
    if (!isNice(xs) || !isNice(ps) || xs <= 0) return genOeko(d, v);
    return {
      promptHTML: '<span class="big">Nachfrage: p = ' + num(bn) + ' <span class="op">−</span> ' + coefHTML(an, V(), true)
        + '<br>Angebot: p = ' + num(ba) + ' <span class="op">+</span> ' + coefHTML(aa, V(), true) + '</span>', wordy: true,
      fields: [Fnum('<i>x</i>* =', 'Menge'), Fnum('p<sup>*</sup> =', 'Preis')], check: checkMulti([xs, ps]),
      solHTML: V() + '<sup>*</sup> = ' + valHTML(xs) + ', p<sup>*</sup> = ' + valHTML(ps),
      plot: {
        fns: [{ f: x => bn - an * x, label: 'Nachfrage' }, { f: x => ba + aa * x, label: 'Angebot', color: 2 }],
        points: [{ x: xs, y: ps }]
      },
      steps: [
        st('Gleichsetzen', num(bn) + ' − ' + num(an) + V() + ' = ' + num(ba) + ' + ' + num(aa) + V()),
        st('Nach x auflösen', num(bn - ba) + ' = ' + num(an + aa) + V() + ' → ' + V() + '<sup>*</sup> = ' + valHTML(xs)),
        st('Preis einsetzen', 'p<sup>*</sup> = ' + num(ba) + ' + ' + num(aa) + '·' + valHTML(xs) + ' = <b>' + valHTML(ps) + '</b>')
      ]
    };
  }

  if (v === 'breakeven') {
    const p = ri(4, 20), kv = ri(1, p - 1), Kf = (p - kv) * ri(2, d <= 5 ? 12 : 40);
    const xb = Kf / (p - kv);
    return {
      promptHTML: '<span class="big">Preis p = ' + p + ' €<br>K(' + V() + ') = ' + Kf + ' <span class="op">+</span> ' + coefHTML(kv, V(), true)
        + '<br>Ab welcher Menge entsteht Gewinn?</span>', wordy: true,
      fields: [Fnum('<i>x</i> =', 'Menge')], check: checkNum(xb),

/* ============================================================

   ============================================================ */
topic({
  id: 'implizit', group: 'Analysis', name: 'Implizites Ableiten', icon: 'i-t-implizit',
  sub: 'dy/dx aus einer Gleichung F(x, y) = c gewinnen.',
  variants: [
    { id: 'kreis', name: 'Grundform', desc: 'a·x² + b·y² = c.' },
    { id: 'gemischt', name: 'Mit x·y-Term', desc: 'Produktregel im gemischten Term.' },
    { id: 'grs', name: 'Grenzrate der Substitution', desc: 'Steigung einer Indifferenzkurve.' },
  ],
  formulas: [
    st('Idee', 'Beide Seiten nach x ableiten und dabei y als Funktion von x behandeln — jedes y liefert ein y′.'),
    st('Kurzformel', fracHTML('d' + Y(), 'd' + V()) + ' = −' + fracHTML('F<sub>x</sub>', 'F<sub>y</sub>')),
    st('Beispiel', 'x² + y² = 25 → 2x + 2y·y′ = 0 → y′ = −' + fracHTML(V(), Y())),
    st('GRS', 'Die Grenzrate der Substitution ist der Betrag der Steigung der Indifferenzkurve: |dy/dx|.'),
  ],
  gen: function (d, v) { return genImplizit(d, v); }
});

function genImplizit(d, v) {
  const R = d <= 4 ? 4 : (d <= 7 ? 6 : 9);
  if (v === 'grs') {
    /* U = x^a · y^b = const → dy/dx = −(a·y)/(b·x) */
    const a = ri(1, 4), b = ri(1, 4);
    const ref = (x, y) => -(a * y) / (b * x);
    return {
      plot: { kind: 'contour', f: (x, y) => (x > 0 && y > 0 ? Math.pow(x, a) * Math.pow(y, b) : NaN),
        point: { x: 1.6, y: 1.4 }, iso: true, r: 2.8, pointLabel: 'Punkt auf der Kurve', levelLabel: 'Indifferenzkurve' },
      promptHTML: '<span class="big">U(' + V() + ', ' + Y() + ') = ' + pw(V(), a) + '·' + pw(Y(), b) + ' = const.</span>'
        + '<p class="qtext">Steigung der Indifferenzkurve d' + Y() + '/d' + V() + '?</p>',
      fields: [Fexpr('d' + Y() + '/d' + V() + ' =', 'z. B. -2y/(3x)')], check: checkExpr2(ref, XY),
      solHTML: fracHTML('d' + Y(), 'd' + V()) + ' = ' + MINUS + fracHTML(coefHTML(a, Y(), true), coefHTML(b, V(), true)),
      steps: [
        st('Partielle Ableitungen', 'U<sub>x</sub> = ' + monoXY(a, a - 1, b, true)
          + ' &nbsp;·&nbsp; U<sub>y</sub> = ' + monoXY(b, a, b - 1, true)),
        st('Kurzformel', fracHTML('d' + Y(), 'd' + V()) + ' = −' + fracHTML('U<sub>x</sub>', 'U<sub>y</sub>')),
        st('Kürzen', 'x und y kürzen sich bis auf je eine Potenz heraus.'),
        st('Ergebnis', '<b>' + MINUS + fracHTML(coefHTML(a, Y(), true), coefHTML(b, V(), true)) + '</b>')
      ]
    };
  }
  if (v === 'gemischt') {
    /* a x² + b xy + c y² = k  →  y′ = −(2a x + b y)/(b x + 2c y) */
    const a = rnz(-R, R), b = rnz(-R, R), c = rnz(-R, R), k = rnz(-9, 9);
    const ref = (x, y) => -(2 * a * x + b * y) / (b * x + 2 * c * y);
    return {
      promptHTML: '<span class="big">' + fxyHTML([[a, 2, 0], [b, 1, 1], [c, 0, 2]]) + ' = ' + num(k) + '</span>',
      fields: [Fexpr(Y() + '′ =', 'z. B. -(4x+3y)/(3x-2y)')], check: checkExpr2(ref, XY),
      solHTML: Y() + '′ = ' + fracHTML(fxyHTML([[-2 * a, 1, 0], [-b, 0, 1]]), fxyHTML([[b, 1, 0], [2 * c, 0, 1]])),
      steps: [
        st('Nach x ableiten', fxyHTML([[2 * a, 1, 0]])
          + coefHTML(b, '(' + Y() + ' + ' + V() + Y() + '′)', false)
          + coefHTML(2 * c, Y() + Y() + '′', false) + ' = 0'),
        st('Nach y′ sortieren', Y() + '′·(' + fxyHTML([[b, 1, 0], [2 * c, 0, 1]]) + ') = ' + MINUS + '('
          + fxyHTML([[2 * a, 1, 0], [b, 0, 1]]) + ')'),
        st('Ergebnis', '<b>' + Y() + '′ = ' + fracHTML(fxyHTML([[-2 * a, 1, 0], [-b, 0, 1]]), fxyHTML([[b, 1, 0], [2 * c, 0, 1]])) + '</b>')
      ]
    };
  }
  /* kreis: a x² + b y² = k → y′ = −(a x)/(b y) */
  const a = ri(1, R), b = ri(1, R), k = ri(4, 40);
  const ref = (x, y) => -(a * x) / (b * y);
  return {
    plot: { kind: 'contour', f: fxyF([[a, 2, 0], [b, 0, 2]]), levels: [k],
      iso: true, r: Math.sqrt(k / Math.min(a, b)) * 1.35, highlight: false, levelLabel: 'Kurve' },
    promptHTML: '<span class="big">' + fxyHTML([[a, 2, 0], [b, 0, 2]]) + ' = ' + k + '</span>',
    fields: [Fexpr(Y() + '′ =', 'z. B. -3x/(2y)')], check: checkExpr2(ref, XY),
    solHTML: Y() + '′ = ' + fracHTML(coefHTML(-a, V(), true), coefHTML(b, Y(), true)),
    steps: [
      st('Beide Seiten ableiten', fxyHTML([[2 * a, 1, 0]]) + ' + ' + num(2 * b) + Y() + '·' + Y() + '′ = 0'),
      st('Nach y′ auflösen', num(2 * b) + Y() + '·' + Y() + '′ = ' + fxyHTML([[-2 * a, 1, 0]])),
      st('Kürzen', 'Der Faktor 2 fällt weg.'),
      st('Ergebnis', '<b>' + Y() + '′ = ' + fracHTML(coefHTML(-a, V(), true), coefHTML(b, Y(), true)) + '</b>')

topic({
  id: 'elastizitaet', group: 'Analysis', name: 'Elastizitäten', icon: 'i-t-elast',
  sub: 'Prozentuale Reaktion — die Preiselastizität der Nachfrage.',
  variants: [
    { id: 'linear', name: 'Lineare Nachfrage', desc: 'ε an einer Stelle berechnen.' },
    { id: 'potenz', name: 'Potenzfunktion', desc: 'Bei x^n ist ε konstant.' },
    { id: 'einordnen', name: 'Elastisch oder nicht?', desc: '|ε| größer oder kleiner als 1.' },
  ],
  formulas: [
    st('Definition', 'ε(x) = ' + fracHTML("f′(x)·x", 'f(x)') + ' — relative Änderung geteilt durch relative Änderung.'),
    st('Deutung', '|ε| &gt; 1 → <b>elastisch</b> · |ε| &lt; 1 → <b>unelastisch</b> · |ε| = 1 → proportional.'),
    st('Potenzfunktion', 'Für f(x) = a·x<sup>n</sup> ist ε = n — unabhängig von x.'),
    st('Lineare Nachfrage', 'Für f(x) = b − a·x gilt ε(x) = ' + fracHTML('−a·x', 'b − a·x') + '.'),
  ],
  gen: function (d, v) { return genElast(d, v); }
});

function genElast(d, v) {
  if (v === 'potenz') {
    const a = ri(2, 12), n = rnz(-4, 4);
    const x0 = ri(1, 6);
    return {
      promptHTML: '<span class="big">f(' + V() + ') = ' + coefHTML(a, xpow(n), true) + '</span>'
        + '<p class="qtext">Elastizität ε an der Stelle ' + V() + ' = ' + x0 + '?</p>',
      fields: [Fnum('ε =', 'Zahl')], check: checkNum(n), solHTML: 'ε = ' + num(n),
      steps: [
        st('Ableiten', 'f′(x) = ' + coefHTML(a * n, xpow(n - 1), true)),
        st('Einsetzen', 'ε = ' + fracHTML(coefHTML(a * n, xpow(n - 1), true) + '·' + V(), coefHTML(a, xpow(n), true))),
        st('Kürzen', 'a und x<sup>' + n + '</sup> kürzen sich vollständig heraus.'),
        st('Ergebnis', 'ε = <b>' + num(n) + '</b> — bei Potenzfunktionen unabhängig von x.')
      ]
    };
  }

  if (v === 'einordnen') {
    const a = ri(1, 6), b = a * ri(4, 14);
    const x0 = ri(1, Math.floor(b / a) - 1);
    const eps = (-a * x0) / (b - a * x0);
    const opts = ['elastisch (|ε| &gt; 1)', 'unelastisch (|ε| &lt; 1)'];
    const idx = Math.abs(eps) > 1 ? 0 : 1;
    if (Math.abs(Math.abs(eps) - 1) < 1e-9) return genElast(d, v);
    return {
      promptHTML: '<span class="big">p(' + V() + ') = ' + num(b) + ' <span class="op">−</span> ' + coefHTML(a, V(), true) + '</span>'
        + '<p class="qtext">Verhalten der Nachfrage bei ' + V() + ' = ' + x0 + '?</p>',
      fields: [Fmc(opts, 'Einordnung')], check: checkMC(idx),
      solHTML: 'ε = ' + fmt(eps, 3) + ' → ' + (idx === 0 ? 'elastisch' : 'unelastisch'),
      plot: {
        fns: [{ f: x => b - a * x, label: 'Nachfrage p(x)' }],
        points: [{ x: x0, y: b - a * x0 }]
      },
      steps: [
        st('Formel', 'ε = ' + fracHTML('p′(x)·x', 'p(x)')),
        st('Einsetzen', 'ε = ' + fracHTML(num(-a) + '·' + x0, num(b) + ' − ' + num(a) + '·' + x0) + ' = ' + fmt(eps, 3)),
        st('Ergebnis', '|ε| ' + (idx === 0 ? '&gt;' : '&lt;') + ' 1 → <b>' + (idx === 0 ? 'elastisch' : 'unelastisch') + '</b>')
      ]
    };
  }

  /* linear */
  const a = ri(1, 6), b = a * ri(4, 16);
  const x0 = ri(1, Math.floor(b / a) - 1);
  const eps = (-a * x0) / (b - a * x0);
  if (!isNice(eps)) return genElast(d, v);
  return {
    promptHTML: '<span class="big">p(' + V() + ') = ' + num(b) + ' <span class="op">−</span> ' + coefHTML(a, V(), true) + '</span>'
      + '<p class="qtext">Elastizität ε an der Stelle ' + V() + ' = ' + x0 + '?</p>',
    fields: [Fnum('ε =', 'Zahl')], check: checkNum(eps, 1e-4), solHTML: 'ε = ' + valHTML(eps),
    plot: {
      fns: [{ f: x => b - a * x, label: 'Nachfrage p(x)' }],
      points: [{ x: x0, y: b - a * x0 }]
    },
    steps: [
      st('Ableiten', 'p′(x) = ' + num(-a)),
      st('Formel', 'ε = ' + fracHTML('p′(x)·x', 'p(x)')),
      st('Einsetzen', 'ε = ' + fracHTML(num(-a) + '·' + x0, num(b) + ' − ' + num(a) + '·' + x0)
        + ' = ' + fracHTML(num(-a * x0), num(b - a * x0))),
      st('Ergebnis', 'ε = <b>' + valHTML(eps) + '</b>')
    ]
  };
}

/* Die Varianten sind je Thema von leicht nach schwer sortiert. Im Zufallsmodus
   zieht eine niedrige Stufe eher die vorderen, eine hohe eher die hinteren Typen. */
function pickByDifficulty(list, d) {
  const n = list.length;
  if (n < 2) return list[0];
  const target = (d - 1) / 9;
  let sum = 0;
  const w = list.map((_, i) => {
    const pos = i / (n - 1);
    const val = Math.exp(-Math.pow(pos - target, 2) / 0.10) + 0.06;
    sum += val; return val;
  });
  let r = Math.random() * sum;
  for (let i = 0; i < n; i++) { r -= w[i]; if (r <= 0) return list[i]; }
  return list[n - 1];
}

const NICE_SKIP = { kopf: true };
function taskSols(task) {
  const c = task && task.check;
  if (!c || !c.__sol) return [];
  const arr = c.__k === 'cond' ? c.__sol.map(s => s.b) : c.__sol;
  return arr.filter(x => typeof x === 'number');
}
function taskNice(task, id) {
  if (NICE_SKIP[id]) return true;
  return taskSols(task).every(x => isNice(x));
}

TOPICS.forEach(t => {
  const real = t.variants.map(v => v.id);
  const base = t.gen;
  t.gen = function (d, v) {
    const vv = (v === 'mix') ? (t.pickVar ? t.pickVar(d, real) : pickByDifficulty(real, d)) : v;
    let task = null;
    for (let i = 0; i < 45; i++) {
      const cand = base.call(t, d, vv);
      if (!cand) continue;
      task = cand;
      if (taskNice(cand, t.id)) break;
    }
    /* Wo ein Term die Antwort ist, kann der Graph dieses Terms gezeigt werden. */
    if (task && !task.plot && task.check && task.check.__k === 'expr' && task.check.__ref) {
      const o = task.check.__opts || {};
      task.plot = { fns: [{ f: task.check.__ref, label: 'Term' }] };
      if (o.lo !== undefined && o.hi !== undefined) task.plot.points = [];
    }
    if (task) {
      task.variantId = vv;
      const found = t.variants.filter(x => x.id === vv)[0];
      task.variantName = found ? found.name : '';
    }
    return task;
  };
  t.variants.push({ id: 'mix', name: 'Zufällig', desc: 'Alle Typen dieses Themas gemischt.' });
});

</script>
<script>
/* ============================================================
   APP — Stake-Layout: Rail, geteiltes Panel, Fußleiste, Info-Karte
   ============================================================ */
const $ = id => document.getElementById(id);
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
function ico(id, w) { return '<svg style="width:' + (w || 17) + 'px;height:' + (w || 17) + 'px"><use href="#' + id + '"/></svg>'; }

const DIFF_TXT = ['Sehr Leicht', 'Leicht', 'Einfach', 'Mittel', 'Solide', 'Fortgeschritten', 'Schwer', 'Sehr Schwer', 'Profi', 'Meister'];
const SCOPES = [{ id: 'alle', name: 'Alle Themen' }, { id: 'Grundlagen', name: 'Grundlagen' },
{ id: 'Gleichungen', name: 'Gleichungen' }, { id: 'Analysis', name: 'Analysis' },
{ id: 'Mehrdim. Analysis', name: 'Mehrdim. Analysis' }, { id: 'Lineare Algebra', name: 'Lineare Algebra' }];
const MODES = [
  { k: 'frei', t: 'Freies Üben', s: 'Ohne Zeit- oder Aufgabenlimit' },
  { k: 'serie', n: 10, t: 'Serie · 10 Aufgaben', s: 'Auswertung am Ende' },
  { k: 'serie', n: 20, t: 'Serie · 20 Aufgaben', s: 'Längere Einheit' },
  { k: 'zeit', n: 120, t: 'Zeit · 2 Minuten', s: 'So viele wie möglich' },
  { k: 'zeit', n: 300, t: 'Zeit · 5 Minuten', s: 'Zum Warmrechnen' }
];

const state = {
  view: 'train', topic: null, variant: null, diff: 3, task: null,
  answered: false, revealed: false, getters: [], flagEls: {}, lastInput: null,
  stats: {}, runs: [], session: null, timer: null, mode: 'frei',
  random: false, scope: 'alle', view2: null, open: {}
};

/* ---------- Statistik-Daten ---------- */
function S(id) {
  if (!state.stats[id]) state.stats[id] = { n: 0, ok: 0, streak: 0, best: 0, hist: [], lvl: [] };
  const s = state.stats[id];
  if (!s.hist) { s.hist = []; s.lvl = []; }
  return s;
}
/* Jede gewertete Antwort wird mitgeschrieben — daraus entstehen die Kurven. */
function logAnswer(id, ok, lvl) {
  const s = S(id);
  s.hist.push(ok ? 1 : 0); s.lvl.push(lvl);
  if (s.hist.length > 120) { s.hist.shift(); s.lvl.shift(); }
  const g = S('__all');
  g.hist.push(ok ? 1 : 0); g.lvl.push(lvl);
  if (g.hist.length > 120) { g.hist.shift(); g.lvl.shift(); }
  saveSoon();
}

/* Gebuendeltes Schreiben: waehrend man am Regler zieht, soll nicht bei jedem
   Pixel in den Speicher geschrieben werden. */
let saveT = null;
function saveSoon() { clearTimeout(saveT); saveT = setTimeout(saveAll, 250); }
function totals() {
  let n = 0, ok = 0, best = 0, themen = 0;
  for (const k in state.stats) {
    if (k === '__all') continue;
    const s = state.stats[k]; n += s.n; ok += s.ok; best = Math.max(best, s.best); if (s.n) themen++;
  }
  return { n, ok, best, themen };
}
function topicById(id) { return TOPICS.filter(t => t.id === id)[0]; }
/* Feste Reihenfolge — sonst haengt sie davon ab, in welcher Datei ein Thema steht. */
const GROUP_ORDER = ['Grundlagen', 'Gleichungen', 'Analysis', 'Mehrdim. Analysis', 'Lineare Algebra'];
const TOPIC_ORDER = [
  'kopf', 'vereinfachen', 'summen', 'defmenge', 'oekonomie',
  'linear', 'quadratisch', 'kubisch', 'bruchgl', 'betrag', 'potenz', 'wurzelgl', 'expo', 'logar', 'ungleichung',
  'grenzwert', 'ableitung', 'implizit', 'extremwert', 'integral', 'elastizitaet',
  'partiell', 'gradient', 'extrem2d', 'lagrange',
  'matrix', 'determinante', 'gauss'
];
function groups() {
  const g = [];
  TOPICS.forEach(t => { if (g.indexOf(t.group) < 0) g.push(t.group); });
  return g.sort((a, b) => {
    const ia = GROUP_ORDER.indexOf(a), ib = GROUP_ORDER.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
  });
}
function topicsOf(g, filter) {
  return TOPICS.filter(t => t.group === g && (!filter || filter(t))).sort((a, b) => {
    const ia = TOPIC_ORDER.indexOf(a.id), ib = TOPIC_ORDER.indexOf(b.id);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
  });
}

/* ============================================================
   RAIL
   ============================================================ */
/* Nach einem Klick soll die Hervorhebung sofort weg sein. Manche Browser halten
   den Zeigezustand nach einem Tipp fest; darum schaltet die Leiste ihn kurz ab
   und laesst ihn erst wieder zu, wenn sich der Zeiger tatsaechlich bewegt. */
function dropHover(btn) {
  if (btn && btn.blur) btn.blur();
  const r = $('rail');
  if (!r || r.classList.contains('nohover')) return;
  r.classList.add('nohover');
  const off = () => { r.classList.remove('nohover'); document.removeEventListener('pointermove', off); };
  document.addEventListener('pointermove', off);
}
function railBtn(cls, icoHTML, name, onClick, chev) {
  const b = el('button', 'railbtn' + (cls ? ' ' + cls : ''));
  b.title = name;
  b.innerHTML = '<span class="ic">' + icoHTML + '</span><span class="nm">' + name + '</span>'
    + (chev ? '<svg class="chev"><use href="#i-chev"/></svg>' : '');
  b.onclick = e => { dropHover(b); onClick(e); };
  return b;
}
function viewBtn(on, icoHTML, name, onClick) {
  const b = el('button', 'vbtn' + (on ? ' on' : ''));
  b.title = name;
  b.innerHTML = icoHTML + '<span class="nm">' + name + '</span>';

}
function renderNav(filter) {
  /* Umschalter oben — bei Stake die beiden Produktbereiche */
  const vw = $('railView'); vw.innerHTML = '';
  vw.appendChild(viewBtn(state.view === 'train', ico('i-train', 18), 'Üben',
    () => { setView('train'); closeDrawer(); }));
  vw.appendChild(viewBtn(state.view === 'stats', ico('i-stats', 18), 'Statistik',
    () => { setView('stats'); closeDrawer(); }));

  /* zweiter Kartenabschnitt unter der Trennlinie */
  const top = $('railTop'); top.innerHTML = '';
  top.appendChild(railBtn('dice' + (state.random && state.view === 'train' ? ' on' : ''), ico('i-dice', 19), 'Zufallsmodus',
    () => { selectRandom(); closeDrawer(); }));
  top.appendChild(railBtn('', ico('i-timer', 19), 'Übungsmodus',
    e => { if (e) e.stopPropagation(); closeDrawer(); openModeMenu($('modeBtn')); }));
  top.appendChild(railBtn(state.view === 'fml' ? 'on' : '', ico('i-book', 19), 'Formelsammlung',
    () => { setView('fml'); closeDrawer(); }));

  const nav = $('nav'); nav.innerHTML = '';
  const f = (filter || '').trim().toLowerCase();
  const drawerOpen = $('rail').classList.contains('open');
  let any = false;
  groups().forEach(g => {
    const items = topicsOf(g, t => !f ||
      t.name.toLowerCase().indexOf(f) >= 0 || t.sub.toLowerCase().indexOf(f) >= 0 ||
      t.variants.some(v => v.name.toLowerCase().indexOf(f) >= 0));
    if (!items.length) return;
    any = true;
    if (state.open[g] === undefined) { const cur = topicById(state.topic); state.open[g] = !!(cur && cur.group === g); }
    const closed = f ? false : !state.open[g];
    const grp = el('div', 'railgroup' + (closed ? ' closed' : ''));
    const active = state.view === 'train' && !state.random && items.some(t => t.id === state.topic);
    /* Die Themenliste ist nur sichtbar, wenn die Leiste offen UND die Gruppe aufgeklappt ist.
       Nur wenn der aktive Eintrag dadurch unsichtbar bleibt, uebernimmt das Uebertema das Blau. */
    const childVisible = drawerOpen && !closed;
    const h = railBtn('head has' + (active && !childVisible ? ' on' : ''), ico(GROUP_ICON[g] || 'i-grid', 19), g,
      () => {
        if (!$('rail').classList.contains('open')) { openDrawer(); state.open[g] = true; renderNav($('search').value); return; }
        /* In der offenen Leiste nur umschalten, statt neu zu zeichnen — sonst
           entsteht ein neues Element und die Bewegung fällt aus. */
        state.open[g] = !state.open[g];
        grp.classList.toggle('closed', !state.open[g]);
        h.classList.toggle('on', active && !state.open[g]);
      }, true);
    grp.appendChild(h);
    const box = el('div', 'railgroup-b');
    const gin = el('div', 'gin');
    items.forEach(t => {
      gin.appendChild(railBtn(state.topic === t.id && state.view === 'train' && !state.random ? 'on' : '',
        topicIco(t, 17), t.name, () => { setView('train'); selectTopic(t.id); closeDrawer(); }));
    });
    box.appendChild(gin);
    grp.appendChild(box);
    nav.appendChild(grp);
  });
  if (!any) nav.appendChild(el('div', 'raillbl', 'Nichts gefunden'));
}

const GROUP_ICON = {
  'Grundlagen': 'i-grid', 'Gleichungen': 'i-scale', 'Analysis': 'i-chart',
  'Mehrdim. Analysis': 'i-g-multi', 'Lineare Algebra': 'i-g-lin'
};
/* Jedes Thema bekommt ein Strichsymbol im Stil der Ueberthemen — keine Emojis. */
const TOPIC_ICON = {
  kopf: 'i-t-kopf', defmenge: 'i-t-defmenge', vereinfachen: 'i-t-vereinfachen',
  linear: 'i-t-linear', quadratisch: 'i-t-quadratisch', kubisch: 'i-t-kubisch',
  bruchgl: 'i-t-bruchgl', betrag: 'i-t-betrag', potenz: 'i-t-potenz',
  wurzelgl: 'i-t-wurzelgl', expo: 'i-t-expo', logar: 'i-t-logar',
  ungleichung: 'i-t-ungleichung', grenzwert: 'i-t-grenzwert', ableitung: 'i-t-ableitung',
  extremwert: 'i-t-extremwert', integral: 'i-t-integral',
  partiell: 'i-t-partiell', gradient: 'i-t-gradient', extrem2d: 'i-t-extrem2d', lagrange: 'i-t-lagrange',
  matrix: 'i-t-matrix', determinante: 'i-t-det', gauss: 'i-t-gauss',

};
function topicIco(t, w) { return ico(TOPIC_ICON[t && t.id] || 'i-grid', w || 19); }

function setView(v) {
  state.view = v;
  $('vTrain').className = 'view' + (v === 'train' ? ' on' : '');
  $('vStats').className = 'view' + (v === 'stats' ? ' on' : '');

}

/* ---------- Formelsammlung als eigene Seite ---------- */
/* Kurze Schreibweisen-Hilfe — was man wie eintippt. */
const SYNTAX = [
  ['Mal &amp; geteilt', '2*x  oder  2x &nbsp;·&nbsp; 6/2', '2·x &nbsp;·&nbsp; ' + fracHTML(6, 2)],
  ['Potenz', 'x^2 &nbsp;·&nbsp; x^(n+1)', 'x<sup>2</sup> &nbsp;·&nbsp; x<sup>n+1</sup>'],
  ['Bruch', '1/x &nbsp;·&nbsp; (x+1)/(x-1)', fracHTML('1', '<i>x</i>') + ' &nbsp;·&nbsp; ' + fracHTML('x+1', 'x−1')],
  ['Wurzel', 'sqrt(x) &nbsp;·&nbsp; root(3, x)', sqrtHTML('<i>x</i>') + ' &nbsp;·&nbsp; ' + sqrtHTML('<i>x</i>', 3)],
  ['e-Funktion &amp; ln', 'e^(2x) &nbsp;·&nbsp; ln(x)', 'e<sup>2x</sup> &nbsp;·&nbsp; ln(<i>x</i>)'],
  ['Betrag', 'abs(x-3) &nbsp;·&nbsp; |x-3|', '<span class="bars"><i>x</i>−3</span>'],
  ['Konstanten', 'pi &nbsp;·&nbsp; e &nbsp;·&nbsp; inf', 'π &nbsp;·&nbsp; e &nbsp;·&nbsp; ∞'],
  ['Dezimalzahlen', '0.25 &nbsp;·&nbsp; 0,25 &nbsp;·&nbsp; 1/4', '0,25'],
];
function renderAllFormulas() {
  const box = $('fmlAll');
  let n = 0;
  TOPICS.forEach(t => { n += (t.formulas || []).length; });
  $('fmlSum').textContent = n + ' Formeln aus ' + TOPICS.length + ' Themen';
  if (box.dataset.built) return;
  let h = '<div class="fmlgrp"><h3>Schreibweise</h3><div class="fmlcard">'
    + '<div class="ft"><span class="ic">' + ico('i-t-vereinfachen', 19) + '</span>So tippst du ein</div>'
    + '<div class="fmlcols">'
    + SYNTAX.map(r => '<div class="fml"><div class="t">' + r[0] + '</div>'
      + '<div class="h"><code class="syn">' + r[1] + '</code><span class="synto">→</span>' + r[2] + '</div></div>').join('')
    + '</div></div></div>';
  groups().forEach(g => {
    const items = topicsOf(g, t => (t.formulas || []).length);
    if (!items.length) return;
    h += '<div class="fmlgrp"><h3>' + g + '</h3>';
    items.forEach(t => {
      h += '<div class="fmlcard"><div class="ft"><span class="ic">' + topicIco(t, 19) + '</span>' + t.name + '</div><div class="fmlcols">';
      t.formulas.forEach(fo => {
        h += '<div class="fml"><div class="t">' + fo.t + '</div><div class="h">' + fo.h + '</div></div>';
      });
      h += '</div></div>';
    });

  });
  box.innerHTML = h;
  box.dataset.built = '1';
  Array.prototype.forEach.call(box.querySelectorAll('.fml .h'), e => paintOps(e));
}
function selectRandom() {
  state.random = true;
  setView('train');
  renderTopic();
  state.anim = 'anim-topic';
  newTask();
}
function selectTopic(id) {
  state.random = false;
  state.topic = id;
  const t = topicById(id);
  state.open[t.group] = true;      /* damit der aktive Eintrag auch sichtbar markiert ist */
  state.variant = t.variants[0].id;
  renderNav($('search').value);
  renderTopic();
  state.anim = 'anim-topic';
  newTask();
}
function renderFormulas(t) {
  const fb = $('formulas'); fb.innerHTML = '';
  (t.formulas || []).forEach(fo => {
    const d = el('div', 'fml');
    d.appendChild(el('div', 't', fo.t));
    d.appendChild(el('div', 'h', fo.h));
    fb.appendChild(d);
  });
}
/* Die blaue Markierung ist ein eigenes Element und gleitet zum aktiven Reiter.
   Nur beim Themenwechsel springt sie, damit sie nicht durch eine neue Liste faehrt. */
function moveTabInd(jump) {
  const ind = $('tabInd'), act = $('tabsRow').querySelector('.tab.on');
  if (!ind) return;
  if (!act) { ind.classList.remove('show'); return; }
  const set = () => {
    ind.style.left = act.offsetLeft + 'px';
    ind.style.width = act.offsetWidth + 'px';
    ind.classList.add('show');
  };
  if (jump) {
    ind.classList.add('jump'); set();
    requestAnimationFrame(() => requestAnimationFrame(() => ind.classList.remove('jump')));
  } else set();
}
/* Reiterwechsel ohne Neuaufbau der Liste — sonst koennte nichts gleiten. */
function pickTab(btn, apply) {
  const row = $('tabsRow');
  Array.prototype.forEach.call(row.querySelectorAll('.tab'), b => b.classList.remove('on'));
  btn.classList.add('on');
  apply();
  moveTabInd(false);
  const l = Math.max(0, btn.offsetLeft - row.clientWidth / 2 + btn.offsetWidth / 2);
  row.scrollTo ? row.scrollTo({ left: l, behavior: 'smooth' }) : (row.scrollLeft = l);
  newTask();
}
function renderTopic() {
  const tabs = $('tabs'), fixed = $('tabsFixed');
  tabs.innerHTML = ''; fixed.innerHTML = '';
  $('tabsRow').classList.toggle('rndmode', !!state.random);
  if (state.random) {
    $('tTitle').textContent = 'Zufallsmodus';
    $('tSub').textContent = 'Thema und Aufgabentyp werden gelost';
    $('infoIcon').innerHTML = ico('i-dice', 24);
    SCOPES.forEach(s => {
      const b = el('button', 'tab' + (state.scope === s.id ? ' on' : ''), s.name);
      b.onclick = () => pickTab(b, () => { state.scope = s.id; });
      tabs.appendChild(b);
    });
    $('hint').textContent = 'Die Stufe steuert, wie schwer die gezogenen Typen sind.';
    $('pillsep').style.display = 'none';
    setTimeout(() => moveTabInd(true), 0);
    return;
  }
  const t = topicById(state.topic);
  const list = t.variants.filter(v => v.id !== 'mix');
  $('tTitle').textContent = t.name;
  $('tSub').textContent = list.length + ' Aufgabentypen · ' + t.sub;
  $('infoIcon').innerHTML = topicIco(t, 24);
  list.forEach(v => {
    const b = el('button', 'tab' + (state.variant === v.id ? ' on' : ''), v.name);
    b.onclick = () => pickTab(b, () => { state.variant = v.id; $('hint').innerHTML = v.desc || ''; });
    tabs.appendChild(b);
  });
  const mixV = t.variants.filter(v => v.id === 'mix')[0];
  $('pillsep').style.display = mixV ? '' : 'none';
  if (mixV) {
    const b = el('button', 'tab rnd' + (state.variant === 'mix' ? ' on' : ''),
      mixV.name);
    b.onclick = () => pickTab(b, () => { state.variant = 'mix'; $('hint').innerHTML = mixV.desc || ''; });
    fixed.appendChild(b);
  }
  const v = t.variants.filter(x => x.id === state.variant)[0];
  $('hint').innerHTML = v ? v.desc : '';
  renderFormulas(t);
  /* Die Pillen laufen nacheinander ein, damit der Wechsel sichtbar ist. */
  const row0 = $('tabsRow');
  row0.classList.remove('tabsin'); void row0.offsetWidth; row0.classList.add('tabsin');
  Array.prototype.forEach.call(row0.querySelectorAll('.tab'), (e, i) => {
    e.style.animationDelay = Math.min(30 + i * 38, 420) + 'ms';
  });
  const act = $('tabsRow').querySelector('.tab.on');
  setTimeout(() => {
    const row = $('tabsRow');
    if (act) row.scrollLeft = Math.max(0, act.offsetLeft - row.clientWidth / 2 + act.offsetWidth / 2);
    if (row.__upd) row.__upd();
    moveTabInd(true);
  }, 0);
}

/* ============================================================
   AUFGABE
   ============================================================ */
function newTask() {
  let t;
  if (state.random) {
    const pool = TOPICS.filter(x => state.scope === 'alle' || x.group === state.scope);
    t = pick(pool);
    state.topic = t.id;
    renderFormulas(t);
  } else t = topicById(state.topic);
  const variant = state.random ? 'mix' : state.variant;
  let task = null, tries = 0;
  while (!task && tries++ < 30) { try { task = t.gen(state.diff, variant); } catch (e) { task = null; } }
  if (!task) {
    setFb('bad', 'Für diese Stufe liess sich keine Aufgabe erzeugen — bitte Stufe oder Typ wechseln.');
    $('btnCheck').disabled = false;
    return;
  }
  state.task = task; state.answered = false; state.revealed = false; state.lastInput = null;
  state.tries = 0;

  $('diff').value = state.diff; $('lvlVal').textContent = state.diff;
  setLvlColor(state.diff);
  $('mTopic').textContent = t.name;
  $('mType').textContent = task.variantName || (t.variants.filter(v => v.id === variant)[0] || {}).name || '—';
  $('mLvl').textContent = state.diff + ' · ' + DIFF_TXT[state.diff - 1];
  $('stage').className = 'stage' + (task.wordy ? ' wordy' : (task.mid ? ' mid' : ''));
  $('prompt').innerHTML = task.promptHTML;
  paintOps($('prompt'));
  setFb(null);
  $('btnCheck').disabled = false;
  buildAnswer();
  buildKeys();
  buildSteps();
  setupPlot();
  hidePreview();
  foldPanel($('stepCard'), false);
  replay($('taskCard'), state.anim || 'anim-task');
  state.anim = null;
  updateSession();
}

function buildAnswer() {
  const box = $('answer'); box.innerHTML = '';
  state.getters = []; state.flagEls = {}; state.mcSel = [];
  const t = state.task;
  const track = inp => {
    inp.addEventListener('focus', () => { state.lastInput = inp; if (!state.noPrev) showPreview(inp); });
    inp.addEventListener('input', () => { state.noPrev = false; showPreview(inp); });
    inp.addEventListener('blur', () => setTimeout(() => {
      const a = document.activeElement;
      if (a && a.closest && a.closest('#answer')) return;   /* nur Feldwechsel */
      hidePreview();
    }, 90));
    return inp;
  };
  (t.fields || []).forEach(f => {
    if (f.type === 'set') {
      const wrap = el('div');
      if (f.label) wrap.appendChild(el('div', 'setlab', f.label));
      const row = el('div', 'setrow'); const inputs = [];
      for (let k = 0; k < (f.slots || 2); k++) {
        const inp = track(el('input', 'inp'));
        inp.placeholder = 'x' + ['₁', '₂', '₃', '₄', '₅'][k];
        inp.autocomplete = 'off'; inp.spellcheck = false;
        row.appendChild(inp); inputs.push(inp);
      }
      wrap.appendChild(row); box.appendChild(wrap);
      state.getters.push(() => inputs.map(x => x.value));
    } else if (f.type === 'mat') {
      const wrap = el('div');
      if (f.label) wrap.appendChild(el('div', 'setlab', f.label));
      const m = el('div', 'matin');
      m.appendChild(el('span', 'mbr'));
      const grid = el('div', 'mgrid');
      grid.style.gridTemplateColumns = 'repeat(' + f.cols + ',auto)';
      const cells = [];
      for (let r = 0; r < f.rows; r++) for (let c = 0; c < f.cols; c++) {
        const inp = track(el('input', 'inp'));
        inp.autocomplete = 'off'; inp.spellcheck = false; inp.placeholder = '';
        grid.appendChild(inp); cells.push(inp);
      }
      m.appendChild(grid);

/* ---------- Zeichen-Tasten: einfache Schreibweise, kein LaTeX ---------- */
/* Zeichentasten: nur was im jeweiligen Thema wirklich vorkommt, durch Striche getrennt */
function keySet() {
  const t = state.task, id = state.topic;
  const hasExpr = (t.fields || []).some(f => f.type === 'expr');
  const k = [['+', '+'], ['−', '-'], ['·', '*'], [':', '/'], ['|']];
  if (hasExpr) k.push(['<i>x</i>', 'x']);
  k.push(['<i>x</i>²', '^2'], ['<i>x</i><sup>n</sup>', '^(', ')'], ['√', 'sqrt(', ')', 'big2'],
    ['<sup>n</sup>√', 'root(3, ', ')', 'big2'], ['|']);
  k.push(['e<sup><i>x</i></sup>', 'e^(', ')'], ['ln', 'ln(', ')']);
  if (id === 'ableitung' || id === 'grenzwert') k.push(['sin', 'sin(', ')'], ['cos', 'cos(', ')']);
  k.push(['|'], ['( )', '(', ')']);
  if (id === 'betrag') k.push(['|x|', 'abs(', ')']);
  if (id === 'extremwert') k.push(['π', 'pi']);
  if (id === 'grenzwert') k.push(['∞', 'inf'], ['−∞', '-inf']);
  return k;
}
function buildKeys() {
  const box = $('keys'); box.innerHTML = '';
  const hasInput = (state.task.fields || []).some(f => f.type !== 'mc');
  box.style.display = hasInput ? '' : 'none';
  if (!hasInput) return;
  keySet().forEach(k => {
    if (k[0] === '|') { box.appendChild(el('span', 'sp')); return; }
    const b = el('button', 'key' + (k[3] ? ' ' + k[3] : ''), k[0]);
    b.type = 'button';
    b.onmousedown = e => e.preventDefault();
    b.onclick = () => insertSym(k[1], k[2]);
    box.appendChild(b);
  });
}
function insertSym(before, after) {
  let inp = state.lastInput;
  if (!inp || !inp.isConnected) inp = $('answer').querySelector('input:not([type=checkbox])');
  if (!inp) return;
  after = after || '';
  const s = inp.selectionStart == null ? inp.value.length : inp.selectionStart;
  const e = inp.selectionEnd == null ? s : inp.selectionEnd;
  const sel = inp.value.slice(s, e);
  inp.value = inp.value.slice(0, s) + before + sel + after + inp.value.slice(e);
  const pos = s + before.length + sel.length;
  inp.focus(); try { inp.setSelectionRange(pos, pos); } catch (err) { }
  state.lastInput = inp;
  showPreview(inp);
}

let PREV = null;
function previewEl() { if (!PREV) { PREV = el('div', 'mprev'); document.body.appendChild(PREV); } return PREV; }
function hidePreview() { if (PREV) PREV.classList.remove('show'); }
function showPreview(inp) {
  const box = previewEl();
  const v = (inp.value || '').trim();

    box.classList.add('side'); box.classList.remove('over');
    box.style.left = (r.right + 12) + 'px';

  } else {

    const above = r.top - h - 9, below = r.bottom + 9;

    else { box.style.top = below + 'px'; box.classList.remove('over'); }

}
/* Rechenzeichen einfaerben — dieselbe Optik wie die Kopfrechen-Aufgaben.
   Exponenten, Indizes und das Relationszeichen bleiben unberuehrt. */
const OP_RE = /[+\u2212\u00b7\u00d7\u00f7=%]/;
const OP_SKIP = { SUP: 1, SUB: 1, SCRIPT: 1, STYLE: 1, SVG: 1, svg: 1 };
function paintOps(root) {
  if (!root) return;
  const texts = [];
  (function walk(node) {
    for (let c = node.firstChild; c; c = c.nextSibling) {
      if (c.nodeType === 3) { if (OP_RE.test(c.nodeValue)) texts.push(c); }
      else if (c.nodeType === 1) {
        const cl = c.classList;
        if (OP_SKIP[c.tagName]) continue;
        /* In Matrizen und Vektoren ist ein Minus ein Vorzeichen, kein Rechenzeichen. */
        if (cl && (cl.contains('op') || cl.contains('op2') || cl.contains('rel')
          || cl.contains('rti') || cl.contains('rts') || cl.contains('syn')
          || cl.contains('mgrid') || cl.contains('bigop'))) continue;
        walk(c);
      }
    }
  })(root);
  texts.forEach(t => {
    const frag = document.createDocumentFragment();
    /* Ein Zeichen ganz am Anfang ist ein Vorzeichen und bleibt eng am Term. */
    /* Auch nach einem Zeilenumbruch ist ein Zeichen ein Vorzeichen. */
    const pv = t.previousSibling;
    const lead = (!pv || (pv.nodeType === 1 && pv.tagName === 'BR')) && /^\s*[+\u2212]/.test(t.nodeValue);
    let first = true;
    t.nodeValue.split(/([+\u2212\u00b7\u00d7\u00f7=%])/).forEach(part => {
      if (!part) return;
      if (part.length === 1 && OP_RE.test(part)) {
        const sp = document.createElement('span');
        sp.className = 'op' + (part === '%' ? ' pct' : '') + (first && lead ? ' lead' : ''); sp.textContent = part;
        frag.appendChild(sp);
      } else frag.appendChild(document.createTextNode(part));
      first = false;
    });
    if (t.parentNode) t.parentNode.replaceChild(frag, t);
  });
}

/* Gedaempfte Ampel ueber die zehn Stufen: Gruen → Gelb → Rot, bewusst blass.
   Im Hellmodus dieselbe Abfolge, nur so weit abgedunkelt, dass sie auf Weiss traegt. */
const LVL_COLORS = {
  dark: ['#00e701', '#55c44a', '#8dbe42', '#c1b23d', '#d9a63a',
    '#ffbf3f', '#e37c3e', '#e56746', '#e85450', '#ed4163'],
  light: ['#12a150', '#3d9c41', '#6a9a35', '#9a9430', '#b5892e',
    '#d99b00', '#c9662f', '#c85238', '#cf4340', '#d92d4e']
};
let LVL_COLOR = LVL_COLORS.dark;
function setLvlColor(d) {
  d = Math.max(1, Math.min(10, d));
  const pct = (d - 1) / 9 * 100;
  /* Der Knopf ist 15 px breit: seine Mitte laeuft von 7.5 px bis Breite − 7.5 px,
     sonst haengt er an den Enden ueber die − / + Tasten hinaus. */
  const pos = 'calc(' + pct + '% + ' + (7.5 - pct * 0.15).toFixed(3) + 'px)';
  const fill = $('lvlFill'), knob = $('lvlKnob'), val = $('lvlVal');
  if (fill) fill.style.width = pos;
  if (knob) knob.style.left = pos;
  if (val) val.style.left = pos;
  const c = LVL_COLOR[d - 1];
  const r = parseInt(c.slice(1, 3), 16), g = parseInt(c.slice(3, 5), 16), b2 = parseInt(c.slice(5, 7), 16);
  const st = document.documentElement.style;
  st.setProperty('--lvl', c);
  st.setProperty('--lvlsoft', 'rgba(' + r + ',' + g + ',' + b2 + ',.4)');
  if (typeof saveSoon === 'function') saveSoon();
}

/* ---------- Prüfen ---------- */
function readAnswer() {
  const vals = state.getters.map(g => g());
  const flags = {}; for (const k in state.flagEls) flags[k] = state.flagEls[k].checked;
  let anyEmpty = true, condMissing = false;
  vals.forEach((v, i) => {
    const f = state.task.fields[i];
    if (f.type === 'set' || f.type === 'mat') { if (v.some(s => String(s).trim())) anyEmpty = false; }
    else if (f.type === 'cond') v.forEach(r => { if (String(r.v).trim()) { anyEmpty = false; if (!r.op) condMissing = true; } });
    else if (String(v).trim()) anyEmpty = false;
  });
  for (const k in flags) if (flags[k]) anyEmpty = false;
  return { vals, flags, anyEmpty, condMissing };
}
const PRAISE = ['Sauber gerechnet.', 'Genau so geht das.', 'Perfekt.', 'Stimmt exakt.', 'Sitzt.'];

function check() {
  if (state.answered) { newTask(); return; }
  const a = readAnswer(), fb = $('fb');
  if (a.anyEmpty) { setFb('bad', 'Trage zuerst eine Antwort ein.'); playBad(1); return; }
  if (a.condMissing) { setFb('bad', 'Wähle in jeder Zeile ein Vergleichszeichen.'); playBad(1); return; }
  hidePreview(); state.noPrev = true;   /* Vorschau darf die Rueckmeldung nicht verdecken */
  let ok = false;
  try { ok = !!state.task.check(a.vals, a.flags); } catch (e) { ok = false; }

  const s = S(state.topic);
  const inputs = $('answer').querySelectorAll('input:not([type=checkbox])');
  const mcs = $('answer').querySelectorAll('.mcopt');

  if (!ok) {
    /* Falsch → keine Lösung verraten, nur ein neuer Versuch. */
    state.tries = (state.tries || 0) + 1;
    if (state.tries === 1) { s.n++; s.streak = 0; logAnswer(state.topic, false, state.diff); }   /* der Fehlversuch zählt genau einmal */
    Array.prototype.forEach.call(inputs, i => {
      i.classList.remove('bad'); void i.offsetWidth; if (String(i.value).trim()) i.classList.add('bad');
    });
    Array.prototype.forEach.call(mcs, b => b.classList.remove('on'));
    (state.mcSel || []).forEach(x => { x.i = null; });   /* sonst zaehlt der naechste Klick auf Pruefen die alte Wahl */
    setFb('bad', '<b>Noch nicht richtig.</b> Versuch es nochmal'
      + (state.tries >= 3 ? ' — der Lösungsweg hilft weiter.' : '.'),
      state.tries + (state.tries === 1 ? ' Versuch' : ' Versuche'));
    playBad(state.tries);
    /* Feld fuer den naechsten Versuch bereitstellen — die Vorschau bleibt dabei zu,
       sie wuerde sonst die Rueckmeldung ueberdecken. */
    state.noPrev = true;
    const first = $('answer').querySelector('input:not([type=checkbox])');
    if (first) setTimeout(() => { try { first.focus({ preventScroll: true }); first.select(); } catch (e) { } }, 30);
    if (state.tries === 1 && state.session) sessionAnswered(false);
    return;
  }

  state.answered = true;
  $('btnCheck').disabled = true;
  if (!state.tries) {                              /* nur ohne Fehlversuch als richtig zählen */
    s.n++; s.ok++; s.streak++; s.best = Math.max(s.best, s.streak);
    logAnswer(state.topic, true, state.diff);
  }
  Array.prototype.forEach.call(inputs, i => { i.classList.remove('bad'); if (String(i.value).trim()) i.classList.add('ok'); });
  Array.prototype.forEach.call(mcs, b => { b.disabled = true; if (b.classList.contains('on')) b.classList.add('ok'); });

  setFb('good', '<b>Richtig.</b> ' + PRAISE[Math.floor(Math.random() * PRAISE.length)],
    s.streak >= 3 ? s.streak + ' in Folge' : '');
  /* Richtig ist richtig — nach Fehlversuchen klingt es nur ruhiger. */
  state.tries ? playRecover() : playGood(s.streak);

  if (state.session && !state.tries) { sessionAnswered(true); return; }   /* Serie lädt selbst nach */
  const cur = state.task;
  setTimeout(() => { if (state.task === cur && state.answered) newTask(); }, 1150);
}

function buildSteps() {
  const box = $('steps'); box.innerHTML = '';
  (state.task.steps || []).forEach((s, i) => {
    const d = el('div', 'step');
    d.style.animationDelay = (i * 45) + 'ms';
    d.appendChild(el('div', 'sn', '' + (i + 1)));

  });

    const c = el('div');
    c.appendChild(el('div', 'st', 'Lösung'));
    c.appendChild(el('div', 'sh', '<b>' + state.task.solHTML + '</b>'));

}
function foldPanel(card, open) {
  const was = !card.classList.contains('closed');

  if (card.id === 'fmlCard') $('ficFml').classList.toggle('on', open);

}

function renderModeMenu() {
  const m = $('modeMenu'); m.innerHTML = '';

    b.onclick = () => {

function modeLabel() {
  const S0 = state.session, b = $('modeBtn');
  if (!S0 || S0.done) { b.className = 'btn grey'; b.textContent = 'Freies Üben'; return; }
  b.className = 'btn grey live';
  if (S0.kind === 'serie') b.innerHTML = '<span class="dot2"></span>Serie ' + Math.min(S0.n + 1, S0.target) + '/' + S0.target;
  else {
    const left = Math.max(0, Math.ceil((S0.endsAt - Date.now()) / 1000));
    b.innerHTML = '<span class="dot2"></span>' + Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
  }
}
function updateSession() {
  modeLabel();
  const S0 = state.session, m = $('taskMeta');
  if (!S0 || S0.done) { m.textContent = ''; return; }
  if (S0.kind === 'serie') m.innerHTML = '<b>' + Math.min(S0.n + 1, S0.target) + ' / ' + S0.target + '</b>';
  else {
    const left = Math.max(0, Math.ceil((S0.endsAt - Date.now()) / 1000));
    m.innerHTML = '<b>' + Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0') + '</b>';
  }
}
function startSession(kind, target) {
  state.session = { kind, target, n: 0, ok: 0, done: false, topic: state.random ? null : state.topic, endsAt: kind === 'zeit' ? Date.now() + target * 1000 : 0 };
  if (state.timer) clearInterval(state.timer);
  if (kind === 'zeit') state.timer = setInterval(() => {
    if (!state.session || state.session.done) return;
    if (Date.now() >= state.session.endsAt) endSession(false); else updateSession();
  }, 500);
  newTask();
}
function sessionAnswered(ok) {
  const S0 = state.session;
  S0.n++; if (ok) S0.ok++;
  if (S0.kind === 'serie' && S0.n >= S0.target) return endSession(false);
  if (S0.kind === 'zeit' && Date.now() >= S0.endsAt) return endSession(false);
  updateSession();
  const cur = state.task;
  if (ok) setTimeout(() => { if (state.session && !state.session.done && state.task === cur) newTask(); }, 800);
}
function endSession(cancel) {
  const S0 = state.session;
  if (state.timer) { clearInterval(state.timer); state.timer = null; }
  state.mode = 'frei';
  if (!S0) { updateSession(); return; }
  if (!cancel && S0.n > 0) {
    state.runs.unshift({
      ok: S0.ok, n: S0.n, topic: S0.topic,
      label: S0.kind === 'serie' ? 'Serie ' + S0.target : (S0.target / 60) + ' Minuten',
      at: new Date()
    });
    state.runs = state.runs.slice(0, 12);
    saveSoon();
    const q = Math.round(100 * S0.ok / S0.n), fb = $('fb');
    setFb(q >= 60 ? 'good' : 'bad',
      '<b>Runde beendet: ' + S0.ok + ' von ' + S0.n + ' richtig (' + q + ' %).</b> Auswertung unter Statistik.');
    if (q >= 60) playDone();
  }
  state.session = null;
  updateSession(); renderModeMenu();
}

        '<td>' + s.n + '</td><td>' + s.ok + '</td>' +
        '<td>' + qq + ' %<div class="qbar"><i style="width:' + qq + '%;background:'
        + (qq >= 70 ? 'var(--green)' : (qq >= 40 ? 'var(--yellow)' : 'var(--red)')) + '"></i></div></td>' +
        '<td>' + s.best + '</td></tr>';
    });
    $('statTable').innerHTML = h + '</tbody></table>';
  }
  if (!state.runs.length) {
    $('runList').innerHTML = '<div class="empty">Noch keine Runde gespielt. Wähle links im Panel „Serie" oder „Zeit".</div>';
  } else {
    $('runList').innerHTML = state.runs.map(r => {
      const qq = Math.round(100 * r.ok / r.n);
      const col = qq >= 70 ? 'var(--green)' : (qq >= 40 ? 'var(--yellow)' : 'var(--red)');
      const tp = topicById(r.topic);
      return '<div class="run"><span class="score" style="color:' + col + '">' + r.ok + '/' + r.n + '</span>' +
        '<span>' + (tp ? tp.name : 'Zufallsmodus') + '</span>' +
        '<span class="meta">' + r.label + ' · ' + String(r.at.getHours()).padStart(2, '0') + ':' + String(r.at.getMinutes()).padStart(2, '0') + '</span></div>';
    }).join('');
  }
}


/* ============================================================
   DIAGRAMME — gleiche Bildsprache wie der Funktionsgraph
   ============================================================ */
function fitCanvas(cv) {
  /* clientWidth/Height statt getBoundingClientRect: die Einblendung des Popups
     skaliert kurzzeitig, das wuerde die Zeichenflaeche verzerren. */
  const w = cv.clientWidth, h = cv.clientHeight;
  const dpr = window.devicePixelRatio || 1;
  if (!w || !h) return null;
  cv.width = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  const c = cv.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, w, h);
  return { c: c, w: w, h: h };
}
/* abgerundete Rechtecke gibt es nicht in jedem Browser */
function rrect(c, x, y, w, h, r) {
  if (c.roundRect) { c.beginPath(); c.roundRect(x, y, w, h, r); return; }
  const rr = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + rr, y); c.lineTo(x + w - rr, y); c.quadraticCurveTo(x + w, y, x + w, y + rr);
  c.lineTo(x + w, y + h - rr); c.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
  c.lineTo(x + rr, y + h); c.quadraticCurveTo(x, y + h, x, y + h - rr);
  c.lineTo(x, y + rr); c.quadraticCurveTo(x, y, x + rr, y);
  c.closePath();
}
function emptyChart(g, txt) {
  g.c.fillStyle = CC.lbl;
  g.c.font = '600 12.5px ' + FONT_UI;
  g.c.textAlign = 'center'; g.c.textBaseline = 'middle';
  g.c.fillText(txt, g.w / 2, g.h / 2);
}
const FONT_UI = 'Montserrat,-apple-system,Segoe UI,Roboto,sans-serif';

/* Farben der Zeichenflaechen — dieselben Rollen wie in der Palette, nur als

const CANVAS_COLORS = {

    bg: '#1a2c38', green: '#00e701', red: '#ed4163', blue: '#1475e1', yellow: '#ffbf3f',
    pink: '#ff9aa9', area: 'rgba(0,231,1,.10)', areaEdge: 'rgba(0,231,1,.32)',
    fill0: 'rgba(20,117,225,.30)', fill1: 'rgba(20,117,225,0)', legendGreen: 'rgba(0,231,1,.7)'
  },
  light: {
