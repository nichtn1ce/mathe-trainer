/* Ziffern bewusst NICHT aus Montserrat: U+0030-0039 fehlt im Bereich oben */
:root{
  /* Palette 1:1 aus dem Stake-Screenshot abgegriffen */
  --dark:#0e1f2c;                 /* Leiste */
  --railcard:#172b39;             /* Karte hinter den Menuetexten */
  --railtxt:#c0c9d1;              /* Menuetext */
  --bg:#1a2c38;                   /* Seite — Farbe aus der Vorlage */
  --panel:#213545;                /* Karten */
  --sur2:#354d5e;                 /* angehobene Flaechen: Pillen, aktive Zeilen */
  --sur3:#3a5366;                 /* Raender und Trennlinien — bewusst weich */
  --inset:#152633;                /* vertiefte Felder: Eingaben, Regler */
  --sur4:#66849c;                 /* Zustand "darauf gezeigt" fuer gefuellte Knoepfe */
  --txt:#ecf3f9;
  --mut:#a9bcd4;
  --mut2:#7e9aaf;
  --mathtxt:#ecf3f9;              /* gesetzte Mathematik in Karten */
  /* Akzente */
  --blue:#1475e1;
  --blue2:#1a80f0;
  --opblue:#79b6ff;               /* Rechenzeichen und Schrittnummern */
  --green:#00e701;
  --greens:rgba(0,231,1,.14);
  --red:#ed4163;
  --reds:rgba(237,65,99,.14);
  --yellow:#ffbf3f;
  --r:8px;
  --rp:14px;
  --ui:"Montserrat",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --math:"Cambria Math","Latin Modern Math",Cambria,"Times New Roman",Georgia,serif;
  --e:cubic-bezier(.2,.7,.2,1);
  --t1:120ms; --t2:210ms; --t3:340ms;
  --hdrbg:#12232f;               /* Kopfzeile im Ton der Leiste — Rahmen um den Inhalt */
  --hdr:60px; --rail:60px; --tb:74px; --pad:18px;
  /* Farbe der Schwierigkeitsstufe — wird je Stufe gesetzt, von Gruen nach Rot */
  --lvl:#8fae5f; --lvlsoft:rgba(143,174,95,.4);
  /* Rollen, die im Hellmodus kippen muessen */
  --on:#ffffff;                   /* Text auf hervorgehobenen Flaechen */
  --tint:rgba(255,255,255,.08);
  --bluetxt:#9ecbff;
  --goodtxt:#7dff8a;
  --badtxt:#ff9aa9;
  --chiptxt:#cfe6ff;
  --ongreen:#04250a;              /* Text auf gefuelltem Gruen */
  --sh:0 14px 38px rgba(0,0,0,.55);
  --shb:0 26px 70px rgba(0,0,0,.6);
  --scrim:rgba(4,14,21,.62);
  --scrim2:rgba(0,0,0,.55);
}

/* ============ HELLMODUS ============
   Nur die Palette kippt — jede Regel darunter arbeitet weiter mit denselben
   Tokens, damit Teile mit gleicher Rolle auch hier exakt gleich aussehen. */
/* Im Hellmodus sind Leiste und Kopfzeile weiss wie die Karten — dort braucht es
   je eine feine Kante, damit die Bereiche auseinanderfallen. */
:root.light .hdr{box-shadow:inset 0 -1px 0 var(--sur3)}
:root.light .rail{box-shadow:inset -1px 0 0 var(--sur3)}
:root.light .hdr:before{box-shadow:inset -1px 0 0 var(--sur3)}
:root.light .pfoot{box-shadow:inset 0 1px 0 var(--sur3)}
:root.light{
  --dark:#ffffff;
  --railcard:#f1f4f8;
  --railtxt:#41505d;
  --bg:#eef2f6;
  --panel:#ffffff;
  --sur2:#dde5ee;
  --sur3:#d5dee6;
  --inset:#f4f7fa;
  --sur4:#b4c2ce;
  --txt:#132330;
  --mut:#5c6b7a;
  --mut2:#8595a3;
  --mathtxt:#132330;
  --opblue:#1668c9;
  --green:#12a150;
  --greens:rgba(18,161,80,.14);
  --red:#d92d4e;
  --reds:rgba(217,45,78,.12);
  --yellow:#d99b00;
  --hdrbg:#ffffff;
  --on:#0d1b26;
  --tint:rgba(19,35,48,.07);
  --bluetxt:#125fbd;
  --goodtxt:#0b7a3b;
  --badtxt:#bf1f3d;
  --chiptxt:#15537f;
  --ongreen:#ffffff;
  --sh:0 14px 38px rgba(20,40,60,.16);
  --shb:0 26px 70px rgba(20,40,60,.22);
  --scrim:rgba(30,45,60,.38);
  --scrim2:rgba(30,45,60,.35);
}
*{box-sizing:border-box}
/* Auf Beruehrung malt der Browser sonst ein graues Rechteck ueber den Knopf. */
*{-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--txt);font-family:var(--ui);font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;overflow:hidden;font-weight:500}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
::selection{background:rgba(43,134,240,.4)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--sur3);border-radius:6px}
@media (hover:hover){::-webkit-scrollbar-thumb:hover{background:var(--sur4)}}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ============ BEWEGUNG ============ */
@keyframes riseIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:translateY(-6px) scale(.985)}to{opacity:1;transform:none}}
@keyframes okPulse{0%{box-shadow:0 0 0 0 rgba(34,221,110,.35)}70%{box-shadow:0 0 0 8px rgba(34,221,110,0)}100%{box-shadow:0 0 0 0 rgba(34,221,110,0)}}
@keyframes nudge{12%,88%{transform:translateX(-2px)}34%,66%{transform:translateX(3px)}50%{transform:translateX(-3px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.anim-task #stage{animation:riseIn var(--t3) var(--e) both}
.anim-task .metastrip{animation:fadeUp var(--t3) var(--e) both;animation-delay:60ms}
/* Stufenwechsel bekommt eine eigene Bewegung: die Aufgabe schiebt seitlich herein,
   Stufenanzeige und Regler quittieren den Sprung. */
@keyframes slideFromR{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
@keyframes slideFromL{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
@keyframes lvlPop{0%{transform:scale(1)}38%{transform:scale(1.42)}100%{transform:scale(1)}}
@keyframes knobPop{0%{transform:translate(-50%,-50%) scale(1)}38%{transform:translate(-50%,-50%) scale(1.3)}
  100%{transform:translate(-50%,-50%) scale(1)}}
.ztrack.hit .knob{animation:knobPop 380ms var(--e)}
@keyframes valPop{0%{transform:scale(1)}40%{transform:scale(1.16)}100%{transform:scale(1)}}
@keyframes lvlGlow{0%{box-shadow:0 0 0 0 var(--lvlsoft)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes trackSweep{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
/* Themenwechsel: die ganze Karte baut sich gestaffelt auf */
@keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.993)}to{opacity:1;transform:none}}
@keyframes pillIn{from{opacity:0;transform:translateY(-9px) scale(.96)}to{opacity:1;transform:none}}
@keyframes swipeIn{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
.anim-topic{animation:cardIn 420ms var(--e) both}
.anim-topic #stage{animation:swipeIn 460ms var(--e) both;animation-delay:70ms}
.anim-topic .metastrip{animation:fadeUp 420ms var(--e) both;animation-delay:130ms}
.anim-topic .csec:nth-of-type(1){animation:fadeUp 420ms var(--e) both;animation-delay:190ms}
.anim-topic .csec:nth-of-type(2){animation:fadeUp 420ms var(--e) both;animation-delay:240ms}
.anim-topic .pfoot{animation:fadeUp 420ms var(--e) both;animation-delay:290ms}
.tabsin .tab{animation:pillIn 340ms var(--e) both}
.tabsin .tabind{animation:pillIn 340ms var(--e) both}
.anim-up #stage{animation:slideFromR var(--t3) var(--e) both}
.anim-down #stage{animation:slideFromL var(--t3) var(--e) both}
.anim-lvl #lvlVal{display:inline-block;animation:valPop 380ms var(--e)}
.inp.ok{animation:okPulse 640ms var(--e)}
.inp.bad{animation:nudge 380ms var(--e)}
.step{animation:fadeUp var(--t2) var(--e) both}
.key:active,.btn:active{transform:scale(.97)}
.tab,.railbtn,.btn,.key,.seg button{transition:background var(--t1) var(--e),color var(--t1) var(--e),transform var(--t1) var(--e)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- Wechsel zwischen Hell und Dunkel ----
   Der neue Modus wird als Kreis aus dem Knopf heraus aufgezogen. Die beiden
   Standbilder sollen dabei nicht zusaetzlich ueberblenden. */
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-old(root){z-index:1}
::view-transition-new(root){z-index:2}
/* Ohne Unterstuetzung fuer den Kreis blenden die Farben weich um. */
:root.theming *{transition:background-color .38s var(--e),color .38s var(--e),
  border-color .38s var(--e),box-shadow .38s var(--e),fill .38s var(--e),stroke .38s var(--e)!important}
/* ---- Rueckmeldung ----
   Statt fliegender Teilchen zwei ruhige Bewegungen: eine Farbe laeuft einmal
   durch die Leiste, und das Zeichen davor wird gezeichnet statt eingeblendet. */
.fb{position:relative;overflow:hidden}
.fb:before{content:'';position:absolute;inset:0;pointer-events:none;
  transform-origin:left center;transform:scaleX(0)}
.fb.good:before{background:var(--greens);animation:fbWipe 460ms var(--e) forwards}
.fb.bad:before{background:var(--reds);animation:fbWipe 460ms var(--e) forwards}
@keyframes fbWipe{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.fb .msg,.fb .tries,.fb .fbic{position:relative;z-index:1}
.fbic{width:19px;height:19px;flex:0 0 19px;margin-right:9px;overflow:visible}
.fbic path{fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:30;stroke-dashoffset:30;animation:draw 420ms var(--e) 90ms forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.fb .tries{animation:chipPop 380ms var(--e) 140ms both}
@keyframes chipPop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
/* Der Rahmen des Feldes zieht einmal nach — ein Ring, kein Blinken. */
@keyframes themeSpin{from{transform:rotate(-140deg) scale(.4);opacity:0}to{transform:none;opacity:1}}
.iconbtn.spin svg{animation:themeSpin .55s var(--e)}

/* ============ KOPFLEISTE ============ */
.hdr{position:fixed;left:0;right:0;top:0;height:var(--hdr);background:var(--hdrbg);z-index:60;
  display:flex;align-items:center;padding:0}
.hdr-in{flex:1;min-width:0;display:flex;justify-content:center;padding:0 16px;margin-left:0;
  position:relative;z-index:1;transition:margin-left var(--t2) var(--e)}   /* nie vom dunklen Streifen verdeckt */
/* Kopfzeile mit demselben Inhaltsbereich zentrieren wie Typleiste und Seite */
.hdr.wide .hdr-in{margin-left:calc(254px - var(--rail))}
.hdr-row{width:100%;max-width:1180px;display:flex;align-items:center;gap:12px;min-width:0}
.burger{width:var(--rail);height:var(--hdr);display:grid;place-items:center;color:var(--mut);
  flex:0 0 var(--rail);position:relative;z-index:1}
/* Der Streifen mit den drei Balken gehoert optisch zur Leiste darunter und
   waechst mit ihr mit. */
.hdr:before{content:'';position:absolute;left:0;top:0;bottom:0;width:var(--rail);
  background:var(--dark);transition:width var(--t2) var(--e)}
/* Sobald die Leiste offen ist, reicht das Dunkelblau ueber ihre volle Breite —
   auch auf dem Handy, wo die Leiste ueber den Inhalt gleitet. */
.hdr.wide:before,.hdr.railopen:before{width:254px}
@media (hover:hover){.burger:hover{color:var(--on)}}
.burger svg{width:18px;height:18px}
.wordmark{display:flex;align-items:center;gap:3px;font-family:'Afacad',var(--ui);
  font-size:25px;font-weight:600;letter-spacing:.008em;color:var(--txt);min-width:0;line-height:1}
/* Der Schriftzug kuerzt notfalls und weicht erst ganz zum Schluss —
   dann bleibt das Summenzeichen als Logo stehen. */
.wordmark span:not(.sig){white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:400px){ .wordmark span:not(.sig){display:none} }
/* Flache Bildmarke wie bei Khan Academy: eine Form, eine Farbe, kein Verlauf. */
.wordmark .sig{width:38px;height:38px;flex:0 0 38px;display:grid;place-items:center;color:#14bf96}
.wordmark .sig svg{width:38px;height:38px;display:block}
/* Im Hellmodus traegt die Bildmarke das Blau der Oberflaeche, das Zeichen darin wird weiss. */
:root.light .wordmark .sig{color:var(--blue)}
:root.light .wordmark .sig .ink{stroke:#fff}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.iconbtn{width:36px;height:36px;flex:0 0 36px;border-radius:var(--r);display:grid;place-items:center;
  color:var(--mut);background:transparent;transition:background var(--t1) var(--e),color var(--t1) var(--e)}
@media (hover:hover){.iconbtn:hover{background:var(--sur2);color:var(--on)}}
.iconbtn svg{width:18px;height:18px;display:block}
/* Sichtbare Rueckmeldung beim Druecken — auf dem Handy gibt es sonst keine,
   weil dort kein Zeigezustand existiert. */
.btn:active,.tab:active,.key:active,.railbtn:active,.vbtn:active,.rowbtn:active,
.stepbtn:active,.ops button:active,.seg button:active,.mcopt:active,.pfoot .fic:active,
.iconbtn:active,.stepbtn:active{transform:scale(.96)}
.btn,.tab,.key,.railbtn,.vbtn,.rowbtn,.stepbtn,.ops button,.seg button,.mcopt,
.pfoot .fic,.iconbtn{transition:transform 90ms var(--e),background var(--t1) var(--e),color var(--t1) var(--e)}
.iconbtn:active{transform:scale(.90)}
/* Wird der Platz knapp, weicht der Modus-Knopf — er steht auch in der Leiste.
   Sobald wieder Platz ist, kommt er zurueck. */
@media (max-width:640px){ #modeBtn{display:none} }
.menu{position:fixed;right:14px;top:calc(var(--hdr) + 8px);background:var(--panel);
  border:1px solid var(--sur3);border-radius:var(--rp);padding:5px;min-width:220px;z-index:80;
  display:none;box-shadow:var(--sh)}
.menu.show{display:block}
.menu button{display:block;width:100%;text-align:left;padding:9px 11px;border-radius:var(--r);
  font-size:13px;font-weight:600;transition:background var(--t1)}
@media (hover:hover){.menu button:hover{background:var(--sur2)}}
.menu button small{display:block;font-size:11px;color:var(--mut2);font-weight:500}
.menu hr{border:none;border-top:1px solid var(--sur3);margin:4px 0}
.btn.live{background:rgba(43,134,240,.2);color:var(--bluetxt)}
.btn .dot2{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--blue);margin-right:7px;vertical-align:1px}

/* ============ RAIL (Stake-Aufbau) ============ */
.rail{position:fixed;left:0;top:var(--hdr);bottom:0;width:var(--rail);background:var(--dark);
  z-index:50;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;
  padding:8px 0 18px;gap:8px;transition:width var(--t2) var(--e),transform var(--t2) var(--e);scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail.open{width:254px}

/* Umschalter oben (bei Stake: Casino | Sport) */
.railview{display:flex;flex-direction:column;gap:6px;padding:0 8px}
.rail.open .railview{flex-direction:row;gap:8px;padding:2px 8px 4px}
.vbtn{display:flex;align-items:center;gap:9px;justify-content:center;height:42px;border-radius:var(--r);
  background:var(--railcard);color:var(--railtxt);font-size:13.5px;font-weight:700;
  transition:background var(--t1) var(--e),color var(--t1) var(--e)}
.rail.open .vbtn{flex:1;min-width:0}
.vbtn svg{width:18px;height:18px;flex:0 0 18px}
.vbtn .nm{display:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail.open .vbtn .nm{display:block}
@media (hover:hover){.vbtn:hover{background:var(--sur2);color:var(--on)}}
/* Aktiv heisst blau — keine dauerhafte Flaeche. Die Flaeche zeigt nur Zeigen und Druecken an. */
.vbtn.on{background:var(--railcard);color:var(--blue)}
.vbtn.on svg{color:var(--blue)}
/* Eingeklappt gibt es nur eine Hervorhebung: den aktiven Themenbereich.
   Die beiden Ansichtsknoepfe sind dort schlichte Symbole. */
.rail:not(.open) .vbtn{background:transparent}
@media (hover:hover){.rail:not(.open) .vbtn:hover{background:var(--sur2)}}
.rail:not(.open) .vbtn.on{background:transparent;color:var(--blue)}
.rail:not(.open) .vbtn.on svg{color:var(--blue)}

/* Suche */
.railsearch{display:none;padding:0 8px 2px;position:relative}
.rail.open .railsearch{display:block}
.railsearch .rs-ic{position:absolute;left:19px;top:50%;transform:translateY(-50%);
  width:15px;height:15px;color:var(--mut2);pointer-events:none}
.railsearch .rs-ic svg{width:15px;height:15px;display:block}
.railsearch input{width:100%;background:var(--railcard);border:1px solid transparent;border-radius:var(--rp);
  padding:10px 10px 10px 32px;font-size:12.5px;outline:none;font-weight:600;color:var(--on)}
.railsearch input:focus{border-color:var(--blue)}
.railsearch input::placeholder{color:var(--mut2);font-weight:600}

/* Menükarte */
.railcard{background:var(--railcard);border-radius:var(--rp);margin:0 8px;padding:6px}
.rail:not(.open) .railcard{background:transparent;padding:0;margin:0 8px}
.raildiv{height:1px;background:var(--sur3);margin:7px 10px}
.rail:not(.open) .raildiv{margin:8px 6px}
/* Eingeklappt trennt ein Strich die Ansichten von den Themen — gleiche
   Gliederung wie unten vor Zufallsmodus & Co. Aufgeklappt uebernimmt das die Suche. */
.topdiv{display:none}
.rail:not(.open) .topdiv{display:block;margin:2px 14px 0}   /* gleiche Breite wie der untere Strich */
.railsec,.railgrp{display:block}
.railgroup{margin:0}
.railgroup-b{margin-bottom:2px;display:grid;grid-template-rows:1fr;
  transition:grid-template-rows var(--t2) var(--e)}
.railgroup-b>.gin{overflow:hidden;min-height:0}
.rail.open .railgroup.closed .railgroup-b{grid-template-rows:0fr}
.railgroup-b>.gin{opacity:1;transition:opacity 150ms var(--e) 60ms}
.rail.open .railgroup.closed .railgroup-b>.gin{opacity:0;transition:opacity 100ms var(--e)}

/* Menüzeile — identisch für Gruppenkopf und Eintrag */
.railbtn{display:flex;align-items:center;gap:11px;width:100%;height:42px;border-radius:var(--r);
  color:var(--railtxt);justify-content:center;position:relative;padding:0;
  font-size:13.5px;font-weight:700;text-align:left}
.rail.open .railbtn{justify-content:flex-start;padding:0 10px}
@media (hover:hover){.railbtn:hover{background:var(--sur2);color:var(--on)}}
.railbtn .ic{width:40px;flex:0 0 40px;height:40px;display:grid;place-items:center;
  font-family:var(--math);font-size:15px;border-radius:var(--r);color:var(--railtxt)}
.rail.open .railbtn .ic{width:20px;flex:0 0 20px;height:20px;font-size:14px}
.railbtn .ic svg{width:19px;height:19px}
@media (hover:hover){.railbtn:hover .ic{color:var(--on)}}
.railbtn .nm{display:none;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail.open .railbtn .nm{display:block}
.railbtn .chev{display:none;width:13px;height:13px;flex:0 0 13px;color:var(--mut2);
  transition:transform var(--t2) var(--e)}
.rail.open .railbtn .chev{display:block}
/* Ueberthemen behalten ihre Flaeche — bei ihnen ist sie der einzige Hinweis,
   solange die Gruppe zu ist. */
.railbtn.on{color:var(--on);background:var(--sur2)}
/* Zeigezustand direkt nach einem Klick unterdruecken (siehe dropHover) */
.rail.nohover .railbtn:not(.on):hover{background:transparent;color:var(--railtxt)}
.rail.nohover .railbtn:not(.on):hover .ic{color:var(--railtxt)}
.rail.nohover .vbtn:not(.on):hover{background:var(--railcard);color:var(--railtxt)}
/* Auch der aktive Eintrag reagiert aufs Zeigen — sonst waere ausgerechnet er
   der einzige, der sich tot anfuehlt. Die Flaeche ist dabei rein voruebergehend. */
@media (hover:hover){
  .vbtn.on:hover{background:var(--sur2)}
  .railbtn.on:hover{background:var(--sur3)}
  .railgroup-b .railbtn.on:hover{background:var(--sur2)}
}
/* ... und verschwindet direkt nach einem Klick wieder (siehe dropHover) */
.rail.nohover .vbtn.on:hover{background:var(--railcard)}
.rail.nohover .railbtn.on:hover{background:var(--sur2)}
.rail.nohover .railgroup-b .railbtn.on:hover{background:transparent}
.railbtn.on .ic{color:var(--blue)}
.rail:not(.open) .railbtn.on{background:var(--sur2)}
.railgroup.closed .railbtn.head .chev{transform:rotate(-90deg)}
.rail:not(.open) .railgroup-b{display:none}

/* Themeneinträge etwas eingerückt und ruhiger als die Gruppenköpfe */
/* Themeneintraege tragen dieselbe Schrift wie die Eintraege unter dem Trenner —
   nur eingerueckt, damit die Hierarchie erhalten bleibt. */
.railgroup-b .railbtn{height:40px;font-weight:700;font-size:13.5px;color:var(--mut)}
.rail.open .railgroup-b .railbtn{padding-left:20px}
.railgroup-b .railbtn .ic{font-size:14px;line-height:1;overflow:visible;color:var(--mut)}
/* Das aktive Thema wird nur durch die Farbe markiert — die graue Flaeche bleibt
   dem Ueberthema vorbehalten, sonst konkurrieren zwei Hervorhebungen. */
.railgroup-b .railbtn.on{background:transparent;color:var(--blue)}
.railgroup-b .railbtn.on .ic{color:var(--blue)}

.raillbl{display:none;font-size:11px;color:var(--mut2);padding:12px 12px;font-weight:600}
.rail.open .raillbl{display:block}

/* ============ TYPLEISTE (ganz oben) ============ */
.typebar{position:fixed;left:var(--rail);right:0;top:var(--hdr);height:var(--tb);z-index:40;
  background:var(--bg);display:flex;align-items:center;padding:0 16px;
  transition:left var(--t2) var(--e)}
.typebar.wide{left:254px}
.typewrap{width:100%;max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;min-width:0}
/* Aussen die Huelle mit Rahmen und Rundung, innen die scrollende Spur. So bleibt
   die Kante scharf, waehrend nur der Inhalt am Rand ausblendet. */
.pillbox{display:flex;background:var(--panel);border:1px solid var(--sur3);
  border-radius:24px;padding:4px;max-width:100%;flex:0 1 auto;min-width:0}
.pillbar{position:relative;display:flex;align-items:center;gap:3px;
  overflow-x:auto;scrollbar-width:none;flex:1 1 auto;min-width:0}
.pillbar::-webkit-scrollbar{display:none}
.pillbar{cursor:grab;-webkit-user-select:none;user-select:none;scroll-behavior:auto;
  -webkit-mask-image:none;position:relative}
.pillbar.grabbing{cursor:grabbing}
.pillbar.fadeL{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 38px,#000 100%);
  mask-image:linear-gradient(90deg,transparent 0,#000 38px,#000 100%)}
.pillbar.fadeR{-webkit-mask-image:linear-gradient(270deg,transparent 0,#000 38px,#000 100%);
  mask-image:linear-gradient(270deg,transparent 0,#000 38px,#000 100%)}
.pillbar.fadeL.fadeR{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 38px,#000 calc(100% - 38px),transparent 100%);
  mask-image:linear-gradient(90deg,transparent 0,#000 38px,#000 calc(100% - 38px),transparent 100%)}
.pillbar .tab{-webkit-user-select:none;user-select:none}
.pillsep{flex:0 0 1px;width:1px;height:18px;background:var(--sur3);margin:0 5px}
.typehint{font-size:11.5px;color:var(--mut2);font-weight:600;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;flex:0 1 auto;margin-left:auto;padding-left:16px;text-align:right}

/* ============ SEITE ============ */
.page{position:absolute;left:var(--rail);right:0;top:calc(var(--hdr) + var(--tb));bottom:0;overflow-y:auto;
  transition:top var(--t2) var(--e),left var(--t2) var(--e);padding:0 16px 60px}
.page.wide{left:254px}
.page.notb{top:var(--hdr);padding-top:14px}   /* gleicher Rhythmus wie der Kartenabstand */
.typebar.hide{display:none}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
/* Beim Scrollen laeuft die oberste Karte unter die Typleiste — ohne Hilfe waere
   die Schnittkante dort eckig. Dieser mitlaufende Streifen malt die beiden
   Eckzwickel in Seitenfarbe nach, sodass die Rundung erhalten bleibt. */
.topround{position:sticky;top:0;z-index:6;height:var(--rp);margin:0 auto calc(-1 * var(--rp));
  max-width:1180px;pointer-events:none;
  background:
    radial-gradient(circle var(--rp) at var(--rp) var(--rp),transparent calc(var(--rp) - .5px),var(--bg) var(--rp)) left top/var(--rp) var(--rp) no-repeat,
    radial-gradient(circle var(--rp) at 0 var(--rp),transparent calc(var(--rp) - .5px),var(--bg) var(--rp)) right top/var(--rp) var(--rp) no-repeat}
.view{display:none}.view.on{display:block}

/* ============ PANEL ============ */
.panel{background:var(--panel);border-radius:var(--rp);overflow:hidden}
.disp{padding:var(--pad) var(--pad) 0;display:flex;flex-direction:column;gap:14px}
/* Durchgehender Hintergrund von Kante zu Kante, aber sichtbar in Stufen geteilt:
   jede Sektion hat eine eigene Trennlinie ueber die volle Breite. Label, Wert und
   alle Bedienelemente sitzen auf derselben Innenkante (links wie rechts). */
.ctrl{background:transparent;margin-top:16px;padding:0 0 4px;
  display:flex;flex-direction:column;align-items:stretch}
.ctrl>*{width:auto;max-width:none}
.csec{padding:14px var(--pad);border-top:1px solid var(--sur3);
  display:flex;flex-direction:column;gap:10px;align-items:stretch}
.csec>*{width:auto;max-width:none}
.answerbox{background:transparent;border:0;border-radius:0;padding:0}
.answerbox .keys{margin-top:12px;padding-top:12px;border-top:1px solid var(--sur3);max-width:none}
.csec>.btn{padding:14px 16px;font-size:15px;margin-top:2px;border-radius:var(--rp)}
/* Die Rueckmeldung steht direkt unter dem Eingabefeld, also dort, wo man nach
   dem Pruefen ohnehin hinschaut. Sie erscheint nur mit Inhalt. */
.fbslot{display:none}
.fbslot.on{display:block;margin-top:12px}
.fbslot>.fb{margin:0}

.seg{display:flex;background:var(--bg);border:1px solid var(--sur3);border-radius:22px;padding:4px;gap:2px}
.seg button{flex:1;padding:8px 4px;border-radius:20px;font-size:12px;font-weight:600;color:var(--mut)}
@media (hover:hover){.seg button:hover{color:var(--on)}}
.seg button.on{background:var(--sur3);color:var(--on)}

.lrow{display:flex;align-items:baseline;justify-content:space-between;font-size:11.5px;color:var(--mut);
  font-weight:600;margin-bottom:-4px}

.lrow b{color:var(--on);font-weight:800}
#lvlVal{color:var(--lvl);transition:color var(--t3) var(--e)}

.slidewrap{display:flex;align-items:center;gap:10px;background:var(--inset);border:1px solid var(--sur3);
  border-radius:var(--r);padding:10px 12px}
/* Eigene Reglerspur: der Knopf wandert weich, statt zu springen. */
.track{position:relative;flex:1;min-width:0;height:20px;display:flex;align-items:center}
.track:before{content:'';position:absolute;left:0;right:0;height:4px;border-radius:2px;background:var(--sur3)}
.track .fill{position:absolute;left:0;height:4px;border-radius:2px;background:var(--lvl);
  transition:width var(--t3) var(--e),background-color var(--t3) var(--e)}
.track .knob{position:absolute;top:50%;width:15px;height:15px;border-radius:50%;background:var(--lvl);
  border:2px solid var(--panel);transform:translate(-50%,-50%);pointer-events:none;
  transition:left var(--t3) var(--e),background-color var(--t3) var(--e),box-shadow var(--t1) var(--e)}
.track.drag .fill,.track.drag .knob{transition:background-color var(--t3) var(--e)}
@media (hover:hover){.track:hover .knob{box-shadow:0 0 0 5px var(--lvlsoft)}}
.track input[type=range]{position:absolute;left:0;top:0;width:100%;height:20px;margin:0;
  -webkit-appearance:none;appearance:none;background:transparent;outline:none;opacity:0;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:var(--blue);cursor:pointer;border:2px solid var(--panel)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--blue);
  cursor:pointer;border:2px solid var(--panel)}
.stepbtn{width:26px;height:26px;border-radius:var(--r);background:var(--sur3);color:var(--on);
  display:grid;place-items:center;font-size:14px;font-weight:700;flex:0 0 26px}
@media (hover:hover){.stepbtn:hover{background:var(--sur4)}}

.btn{border-radius:var(--r);font-weight:700;font-size:13.5px;padding:10px 16px;white-space:nowrap}
.btn.blue{background:var(--blue);color:#fff}
@media (hover:hover){.btn.blue:hover{background:var(--blue2)}}
.btn.grey{background:var(--sur3);color:var(--on)}
@media (hover:hover){.btn.grey:hover{background:var(--sur4)}}
.btn.ghost{background:transparent;color:var(--mut)}
@media (hover:hover){.btn.ghost:hover{color:var(--on);background:var(--sur2)}}
.btn.wide{width:100%;padding:13px 16px;font-size:15px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* Antwortfelder */
.ans{display:flex;flex-direction:column;gap:9px;max-width:none}
.ans .frow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.flab{font-family:var(--math);font-size:16px;color:var(--mut);flex:0 0 auto;min-width:32px}
.inp{background:var(--inset);border:1px solid var(--sur3);border-radius:var(--r);padding:10px 12px;
  font-family:var(--math);font-size:16px;outline:none;min-width:0;flex:1;font-weight:400}
.inp::placeholder{font-family:var(--ui);font-size:11.5px;color:var(--mut2);font-weight:500}
.inp:focus{border-color:var(--blue)}
.inp.ok{border-color:var(--green)}
.inp.bad{border-color:var(--red)}
.setlab{font-size:11.5px;color:var(--mut);font-weight:600;margin-bottom:6px}
.setrow{display:flex;gap:8px;flex-wrap:wrap}
.setrow .inp{flex:1 1 118px}
.fb .tries{flex:0 0 auto;align-self:center;font-weight:700;font-size:11.5px;opacity:.75;
  background:var(--tint);border-radius:20px;padding:3px 10px;margin-left:14px;white-space:nowrap}
/* Sehr schmal rutscht der Zaehler unter den Text — aber weiter nach rechts. */
@media (max-width:430px){
  .fb{flex-direction:column;align-items:stretch;gap:8px}
  .fb .tries{align-self:flex-end;margin-left:0}
}
.fb .msg{flex:1 1 auto;min-width:0}
.qtext{margin-top:14px;font-size:14px;color:var(--mut);font-weight:600;line-height:1.5;max-width:640px}
.qtext b{color:var(--on)}
.stage.wordy .qtext{font-size:13.5px}
.mcwrap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mcwrap .setlab{grid-column:1/-1;margin-bottom:0}
.mcopt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:var(--inset);border:1px solid var(--sur3);border-radius:var(--r);padding:10px 12px;
  transition:border-color var(--t1) var(--e),background var(--t1) var(--e)}
@media (hover:hover){.mcopt:hover:not(:disabled){border-color:var(--blue);background:var(--sur2)}}
.mcopt .mck{flex:0 0 22px;height:22px;display:grid;place-items:center;border-radius:var(--r);
  background:var(--sur3);color:var(--mut);font-size:11px;font-weight:700}
.mcopt .mcv{font-family:var(--math);font-size:16px;line-height:1.2;min-width:0;overflow-x:auto;scrollbar-width:none}
.mcopt .mcv::-webkit-scrollbar{display:none}
.mcopt.on{border-color:var(--blue);background:rgba(43,134,240,.13)}
.mcopt.on .mck{background:var(--blue);color:#fff}
.mcopt.ok{border-color:var(--green);background:var(--greens)}
.mcopt.ok .mck{background:var(--green);color:var(--ongreen)}
.mcopt.bad{border-color:var(--red);background:var(--reds)}
.mcopt.bad .mck{background:var(--red);color:#fff}
.mcopt.sol{border-color:var(--green)}
.mcopt.sol .mck{background:var(--green);color:var(--ongreen)}
.mcopt:disabled{cursor:default}
@media(max-width:640px){.mcwrap{grid-template-columns:1fr}}
.ops{display:flex;border:1px solid var(--sur3);border-radius:var(--r);overflow:hidden;flex:0 0 auto}
.ops button{width:36px;height:40px;font-family:var(--math);font-size:15px;color:var(--mut)}
.ops button + button{border-left:1px solid var(--sur3)}
@media (hover:hover){.ops button:hover{background:var(--sur2);color:var(--on)}}
.ops button.on{background:var(--blue);color:#fff}
.joinl{font-size:10.5px;letter-spacing:.1em;color:var(--mut2);font-weight:700;padding:4px 0 0}
.flag{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);cursor:pointer;
  user-select:none;font-weight:600}
.flag input{position:absolute;opacity:0;width:0;height:0}
.flag .box2{width:17px;height:17px;flex:0 0 17px;border-radius:var(--r);border:1.8px solid var(--sur3);
  background:var(--inset);display:grid;place-items:center;transition:background var(--t1) var(--e),border-color var(--t1) var(--e)}
.flag .box2 svg{width:11px;height:11px;color:#fff;opacity:0;transform:scale(.6);
  transition:opacity var(--t1) var(--e),transform var(--t1) var(--e)}
@media (hover:hover){.flag:hover .box2{border-color:var(--mut2)}}
.flag input:checked + .box2{background:var(--blue);border-color:var(--blue)}
.flag input:checked + .box2 svg{opacity:1;transform:none}
.flag input:focus-visible + .box2{box-shadow:0 0 0 3px rgba(43,134,240,.35)}

.keys{display:flex;flex-wrap:wrap;gap:4px;max-width:none;align-items:center}
.key{min-width:34px;height:32px;padding:0 8px;border-radius:var(--r);background:var(--sur3);
  color:var(--on);font-family:var(--math);font-size:15px;display:inline-flex;align-items:center;
  justify-content:center;line-height:1;overflow:hidden}
@media (hover:hover){.key:hover{background:var(--sur4)}}
.key.txt{font-family:var(--ui);font-size:11.5px;font-weight:700}
.key.big2{font-family:var(--ui);font-size:16px;font-weight:600}   /* Wurzelzeichen bleibt kompakt */
.keys .sp{width:1px;height:20px;background:var(--sur3);margin:0 6px;flex:0 0 1px}

.fb{border-radius:var(--r);padding:11px 14px;font-size:13px;font-weight:600;display:none;
  background:var(--panel);min-width:0;align-items:center;gap:0;line-height:1.45}
.fb.show{display:flex;animation:popIn var(--t2) var(--e)}
.fb.good{color:var(--goodtxt);box-shadow:inset 0 0 0 1px rgba(34,221,110,.3)}
.fb.bad{color:var(--badtxt);box-shadow:inset 0 0 0 1px rgba(255,84,112,.35)}
.fb .sol{display:block;margin-top:6px;font-family:var(--math);font-size:17px;color:var(--on);font-weight:400}

/* Anzeige-Fläche */
.stage{min-height:214px;display:grid;place-items:center;text-align:center;padding:30px 18px;overflow-x:auto}
.big{font-family:var(--math);font-size:39px;line-height:1.5;display:inline-block}
.stage.mid .big{font-size:27px;line-height:1.75}
.stage.wordy .big{font-family:var(--ui);font-size:19px;font-weight:600;line-height:1.7}
.stage.wordy .big i{font-family:var(--math);font-weight:400;font-size:1.05em}
.sub{margin:14px 0 0;font-size:13.5px;color:var(--mut);font-weight:600}
.metastrip{display:flex;gap:10px;background:var(--inset);border-radius:var(--rp);padding:12px}
.mcell{flex:1;min-width:0}
.mcell span{display:block;font-size:11.5px;color:var(--mut);font-weight:600;margin-bottom:6px}
.mcell .box{background:var(--panel);border:1px solid var(--sur3);border-radius:var(--r);
  padding:10px 12px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcell .box.g{color:var(--txt)}   /* Stufe liest sich wie Thema und Aufgabentyp */

/* Fußleiste */
.pfoot{display:flex;align-items:center;gap:6px;padding:11px var(--pad);background:var(--panel);
  box-shadow:inset 0 1px 0 var(--sur3)}
.pfoot .fic{width:32px;height:32px;border-radius:var(--r);display:grid;place-items:center;color:var(--mut)}
@media (hover:hover){.pfoot .fic:hover{background:var(--sur2);color:var(--on)}}
.pfoot .fic.on{color:var(--blue)}
.pfoot .fic svg{width:16px;height:16px}
.pfoot .mid{margin:0 auto;font-family:var(--math);font-size:17px;color:var(--mut2);font-weight:700;
  display:flex;align-items:center;gap:7px}
.pfoot .mid small{font-family:var(--ui);font-size:11px;letter-spacing:.06em;font-weight:700}

/* Mathe-Satz */
i{font-style:italic}
.rel{margin:0 .34em;color:var(--opblue)}
.op{margin:0 .24em;color:var(--opblue)}
.op.lead{margin:0 .05em 0 0}   /* fuehrendes Vorzeichen klebt am Term */
.op.pct{margin:0}             /* das Prozentzeichen bringt seinen Abstand schon mit */
.neg{margin:0 .04em 0 0}
.op2{margin:0 .3em;color:var(--opblue)}
.conj{color:var(--mut2);font-size:.8em;margin:0 .45em;font-style:normal}
sup{font-size:.6em;vertical-align:.66em;margin-left:.03em}
sub{font-size:.6em;vertical-align:-.26em}
.frac{display:inline-grid;grid-template-rows:auto auto;justify-items:center;vertical-align:middle;
  font-size:.84em;margin:0 .2em;line-height:1.22;position:relative;top:-.02em}
.frac>.fn{padding:0 .34em 1px;border-bottom:1.3px solid currentColor;width:100%;text-align:center}
.frac>.fd{padding:1px .34em 0;width:100%;text-align:center}
.rt{display:inline-flex;align-items:stretch;margin:0 .14em 0 .1em;position:relative}
.rt>.rts{width:.58em;flex:0 0 .58em;align-self:stretch;min-height:1.02em;overflow:visible}
.rt>.rtc{border-top:1.2px solid currentColor;padding:.16em .3em .04em .06em}
.rt>.rti{position:absolute;left:0;top:-.34em;font-size:.5em;line-height:1;z-index:1}
.lim{font-size:.8em;display:inline-block;transform:translateY(.08em);margin-right:.22em}
.intg{font-size:1.45em;line-height:.72;margin-right:.16em;vertical-align:-.1em}
.lim2{display:inline-flex;flex-direction:column;align-items:center;line-height:1;vertical-align:middle}
.lim2 .up,.lim2 .lo{font-size:.34em;line-height:1.15}
.muted{color:var(--mut2);font-size:.85em}
.fnm{font-style:normal;padding-right:.06em}
/* ============ MATRIZEN ============ */
/* Klammern werden aus Raendern gezeichnet — so wachsen sie mit der Hoehe mit. */
.mat{display:inline-flex;align-items:stretch;gap:0;vertical-align:middle;margin:0 .14em}
.mat .mbr{flex:0 0 .3em;border:.075em solid var(--mut2)}
.mat .mbr:first-child{border-right:0;border-radius:.7em 0 0 .7em}
.mat .mbr:last-child{border-left:0;border-radius:0 .7em .7em 0}
.mat .mgrid{display:grid;gap:.18em .8em;padding:.22em .5em;align-items:center;justify-items:center}
.mat .mc{white-space:nowrap}
/* Eingabefeld fuer Matrizen */
.matin{display:inline-flex;align-items:stretch;gap:0}
.matin .mbr{flex:0 0 9px;border:2px solid var(--sur3)}
.matin .mbr:first-child{border-right:0;border-radius:12px 0 0 12px}
.matin .mbr:last-child{border-left:0;border-radius:0 12px 12px 0}
.matin .mgrid{display:grid;gap:8px;padding:6px 10px}
.matin .inp{width:78px;text-align:center;padding:9px 6px}
@media (max-width:520px){ .matin .inp{width:60px;padding:8px 4px} }
/* Summen- und Produktzeichen: Grenzen stehen ueber und unter dem Zeichen */
.bigop{display:inline-grid;justify-items:center;align-content:center;vertical-align:middle;
  line-height:1;margin:0 .12em}
.bigop .bo{font-size:1.55em;line-height:.92;font-weight:400}
.bigop .bt,.bigop .bb{font-size:.44em;color:var(--mut);white-space:nowrap;line-height:1.2}
.bopb{vertical-align:middle}
.bars{border-left:1.2px solid currentColor;border-right:1.2px solid currentColor;padding:0 .22em;margin:0 .06em}

/* Formel-Vorschau */
.mprev{position:fixed;z-index:95;background:var(--sur2);border-radius:var(--r);padding:10px 14px;
  font-family:var(--math);font-size:18px;color:var(--on);box-shadow:var(--sh);
  pointer-events:none;opacity:0;transform:translateY(-5px);max-width:min(520px,92vw);
  overflow-x:auto;white-space:nowrap;transition:opacity var(--t1) var(--e),transform var(--t1) var(--e)}
.mprev.show{opacity:1;transform:none}
.mprev::before{content:"";position:absolute;top:-4px;left:18px;width:9px;height:9px;
  background:var(--sur2);transform:rotate(45deg);border-radius:2px}
.mprev.side::before{top:50%;left:-4px;margin-top:-5px}
.mprev.over::before{top:auto;bottom:-4px}
.mprev .plbl{display:block;font-family:var(--ui);font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--mut2);margin-bottom:4px;font-weight:700}
.mprev.err{font-family:var(--ui);font-size:12.5px;color:var(--red);white-space:normal;font-weight:600}

/* Aufklappbare Panels */
.phead{display:flex;align-items:center;gap:10px;padding:14px var(--pad);font-size:13px;font-weight:700;width:100%;text-align:left}
.phead:focus{outline:none}
.panel:has(> .phead:focus-visible){background:var(--sur2)}
@media (hover:hover){/* nur bei Tastaturbedienung */
/* Beim Zeigen hebt sich die ganze Karte, nicht nur ihr Kopf. */
.panel:has(> .phead:hover){background:var(--sur2)}}
.panel{transition:background var(--t1) var(--e)}
.phead .chev{margin-left:auto;width:12px;height:12px;transition:transform var(--t2) var(--e)}
.panel.closed .chev{transform:rotate(-90deg)}
/* Auf- und Zuklappen laeuft ueber die Zeilenhoehe des Rasters — das animiert
   sauber bis zur natuerlichen Hoehe, ohne feste Maximalwerte. */
.pbody{display:grid;grid-template-rows:1fr;transition:grid-template-rows var(--t3) var(--e)}
.panel.closed .pbody{grid-template-rows:0fr}
/* gleicher Abstand ueber und unter dem Inhalt: die Kopfzeile gibt ihre untere
   Polsterung ab, sobald die Karte offen ist. */
.pbin{overflow:hidden;min-height:0;padding:14px var(--pad);opacity:1;
  transition:opacity var(--t2) var(--e) 80ms,padding var(--t3) var(--e)}
/* Zugeklappt muss auch die Polsterung weg — sonst bleibt ein leerer Streifen stehen. */
.panel.closed .pbin{padding-top:0;padding-bottom:0;opacity:0;transition:opacity 110ms var(--e),padding var(--t3) var(--e)}
.panel:not(.closed)>.phead{padding-bottom:0}

.step{display:flex;gap:14px;padding:14px 0;border-top:1px solid var(--sur3)}
.step:first-child{border-top:none;padding-top:2px}
.step:last-child{padding-bottom:2px}
.step>div:last-child{min-width:0;flex:1}
.sn{width:24px;height:24px;flex:0 0 24px;border-radius:50%;background:var(--sur2);color:var(--opblue);
  display:grid;place-items:center;font-size:11px;font-weight:700;margin-top:2px}
.st{font-size:10.5px;font-weight:700;color:var(--mut2);letter-spacing:.1em;text-transform:uppercase;margin-bottom:7px}
.sh{font-family:var(--math);font-size:15.5px;color:var(--mathtxt);line-height:1.75;font-weight:400}
.sh b{color:var(--on)}
canvas{width:100%;height:250px;display:block;border-radius:var(--r);background:var(--bg);cursor:grab;touch-action:none}
canvas.drag{cursor:grabbing}
.leg{display:flex;gap:13px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin-top:9px;font-weight:600}
.leg i{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;font-style:normal}
.zrow{display:flex;align-items:center;gap:11px;margin-top:11px;font-size:11.5px;color:var(--mut);font-weight:600}
.zrow .ztrack{width:150px;flex:0 0 150px}
.zrow .ztrack .fill,.zrow .ztrack .knob{background:var(--blue)}
@media (hover:hover){.zrow .ztrack:hover .knob{box-shadow:0 0 0 5px rgba(43,134,240,.22)}}
.zhint{margin-left:auto}
@media (max-width:520px){ .zhint{display:none} .zrow .ztrack{flex:1 1 auto;width:auto} }
.fml{padding:10px 0;border-bottom:1px solid var(--sur3);animation:fadeUp var(--t2) var(--e) both}
.fml:last-child{border-bottom:none;padding-bottom:0}
.fml .t{font-size:10.5px;color:var(--mut2);text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px;font-weight:700}
.fml .h{font-family:var(--math);font-size:14.5px;color:var(--mathtxt);line-height:1.9;font-weight:400}

/* Info-Karte */
.info{padding:var(--pad)}
.info-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.tile{width:56px;height:56px;flex:0 0 56px;border-radius:var(--rp);background:var(--sur2);
  display:grid;place-items:center;font-family:var(--math);font-size:22px;color:var(--on)}
.info-t{min-width:0}
.info-t b{display:block;font-size:16px;font-weight:800;letter-spacing:-.01em}
.info-t span{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mut);margin-top:3px;font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;background:var(--blue);flex:0 0 7px}
.info-head .btn{margin-left:auto;flex:0 0 auto}
@media (max-width:520px){ .info-head .btn{margin-left:0;width:100%;text-align:center} }
.tab{padding:8px 15px;border-radius:20px;font-size:12.5px;font-weight:700;color:var(--mut);
  white-space:nowrap;background:transparent;flex:0 0 auto;position:relative;z-index:1;
  transition:color var(--t2) var(--e),transform var(--t1) var(--e)}
@media (hover:hover){.tab:hover{background:var(--sur2);color:var(--on)}}
.tab:active{transform:scale(.95)}
@media (hover:hover){.tab.on,.tab.on:hover{background:transparent;color:#fff}}   /* sitzt auf der blauen Pille */
.tab.rnd:not(.on){color:var(--mut)}
@media (hover:hover){.tab.rnd:not(.on):hover{background:var(--sur2);color:var(--on)}}
/* Die blaue Markierung ist ein eigenes Element und gleitet zwischen den Reitern */
.tabind{position:absolute;top:0;height:100%;border-radius:20px;background:var(--blue);
  z-index:0;pointer-events:none;opacity:0;
  transition:left var(--t3) var(--e),width var(--t3) var(--e),opacity var(--t2) var(--e)}
.tabind.show{opacity:1}
.tabind.jump{transition:none}
.pillbar.grabbing .tab{transition:none}
.pillbar.grabbing .tabind{transition:left .06s linear,width .06s linear,opacity .2s var(--e)}
.tab .dice{margin-right:6px;width:13px;height:13px;vertical-align:-2px;display:inline-block}
.hint{margin-top:10px;font-size:12px;color:var(--mut);font-weight:600}

/* Statistik */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{background:var(--panel);border-radius:var(--rp);padding:16px var(--pad)}
/* Diagramme in der Statistik und im Aufgaben-Popup */
.chartbox{position:relative;height:190px}
.chartbox.barbox{height:auto;min-height:70px}
.chartbox canvas{width:100%;height:100%;display:block}
/* Formelseite */
.fmlgrp{margin-bottom:14px}
.fmlgrp>h3{margin:0 0 8px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut2);font-weight:700}
.fmlcard{background:var(--panel);border-radius:var(--rp);padding:var(--pad);margin-bottom:14px}
.fmlcard>.ft{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;margin-bottom:12px}
.fmlcard>.ft .ic{width:20px;height:20px;display:grid;place-items:center;color:var(--blue)}
.fmlcard>.ft .ic svg{width:19px;height:19px}
.fmlcols{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
/* Schreibweisen-Hilfe: getippte Form links, gesetzte Form rechts */
.syn{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;
  background:var(--inset);border:1px solid var(--sur3);border-radius:var(--r);padding:2px 7px;color:var(--chiptxt)}
.synto{margin:0 10px;color:var(--mut2)}
/* Popup */
@keyframes popOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-6px) scale(.985)}}
.pop{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;
  background:var(--scrim);padding:20px}
.pop.show{display:flex;animation:popIn var(--t2) var(--e)}
.pop.closing{display:flex;animation:popOut var(--t2) var(--e) forwards;pointer-events:none}
.popbox{background:var(--bg);border:1px solid var(--sur3);border-radius:var(--rp);
  width:100%;max-width:620px;padding:var(--pad);box-shadow:var(--shb)}
.pophead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.pophead .rowbtn{margin-left:auto}
.tiles.pt{grid-template-columns:repeat(3,1fr);margin-bottom:14px}
.popfoot{margin-top:12px;font-size:12px;color:var(--mut2);font-weight:600}
.stat b{display:block;font-size:26px;font-weight:800;line-height:1.15}
.stat span{font-size:10.5px;color:var(--mut2);text-transform:uppercase;letter-spacing:.1em;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--mut2);padding:0 10px 9px 0}
td{padding:9px 10px 9px 0;border-top:1px solid var(--sur3);font-weight:600}
td.name{color:var(--on);white-space:nowrap}
td.name .ico{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:var(--r);
  background:var(--sur2);font-family:var(--math);font-size:12px;vertical-align:-7px;margin-right:9px}
.qbar{height:4px;border-radius:2px;background:var(--sur3);overflow:hidden;min-width:70px;margin-top:5px}
.qbar>i{display:block;height:100%;background:var(--green);border-radius:2px}
.rowbtn{padding:5px 11px;border-radius:20px;border:1px solid var(--sur3);color:var(--mut);
  font-size:11.5px;font-weight:700;
  transition:background var(--t1) var(--e),color var(--t1) var(--e),border-color var(--t1) var(--e)}
@media (hover:hover){.rowbtn:hover{background:var(--sur2);color:var(--on);border-color:var(--mut2)}}
@media (hover:hover){#btnResetStats:hover{background:var(--reds);color:var(--badtxt);border-color:rgba(255,84,112,.45)}}
.empty{color:var(--mut2);font-size:13px;padding:22px 0;text-align:center;font-weight:600}
.run{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--sur3);font-size:13px;font-weight:600}
.run:first-child{border-top:none}
.run .score{font-weight:800;min-width:52px}
.run .meta{color:var(--mut2);font-size:12px;margin-left:auto}

.scrim{display:none;position:fixed;inset:0;background:var(--scrim2);z-index:45}
.scrim.show{display:block}

@media (max-width:1080px){ .tiles{grid-template-columns:repeat(2,1fr)} }
@media (max-width:900px){
  .stage{min-height:170px;padding:22px 12px}
  .big{font-size:30px}
  .stage.mid .big{font-size:22px}
  .stage.wordy .big{font-size:17px}

}
@media (max-width:760px){
  /* Die schmale Leiste bleibt immer sichtbar; aufgeklappt legt sie sich ueber den
     Inhalt, statt ihn zur Seite zu schieben. */
  :root{--rail:52px;--tb:66px;--pad:14px}
  .rail{z-index:55}
  .rail.open{box-shadow:var(--shb)}
  .page,.page.wide{left:var(--rail)}
  .typebar,.typebar.wide{left:var(--rail);padding:0 12px}
  .typehint{display:none}
  .page{padding:0 12px 60px}
  .hdr-in{padding:0 12px}
  .hdr.wide .hdr-in{margin-left:0}
  .wordmark{font-size:22px;gap:2px}
  .wordmark .sig{width:33px;height:33px;flex:0 0 33px}
  .wordmark .sig svg{width:33px;height:33px}
  .hdr-r .btn{padding:9px 11px;font-size:12.5px}
  .pfoot .mid small{display:none}
  .metastrip{flex-wrap:wrap}
  .mcell{flex:1 1 45%}
  th:nth-child(3),td:nth-child(3){display:none}
}
</style>

/* ============================================================

/* Ein Komma ist in Deutschland ein Dezimaltrenner — ausser in Funktionen mit

      const inCall = stack.length && stack[stack.length - 1];

}

    .replace(/\s+/g, '')
    .replace(/−|–|—/g, '-')
    .replace(/·|×|\*/g, '*')
    .replace(/²/g, '^2').replace(/³/g, '^3')
    .replace(/√/g, 'sqrt')
    .replace(/π/g, 'pi')
    .replace(/\{|\[/g, '(').replace(/\}|\]/g, ')');
  s = fixCommas(s);

  while (i < s.length) {
    const c = s[i];

      if (m) j += m[0].length;

    }
    else if (/[a-zA-Z]/.test(c)) { let j = i; while (j < s.length && /[a-zA-Z0-9_]/.test(s[j])) j++; t.push({ t: 'id', v: s.slice(i, j).toLowerCase() }); i = j; }
    else if ('+-*/^(),|'.indexOf(c) >= 0) { t.push({ t: c }); i++; }

  }

}


/* ============================================================
   LaTeX als Eingabesprache

   ============================================================ */
function texGroup(s, i) {           /* s[i] === '{' */
  let depth = 0, j = i;
  for (; j < s.length; j++) {
    if (s[j] === '{') depth++;

  }

function texExpand(s) {

      const x = lo + (hi - lo) * (i + 0.5) / 6 + (Math.random() - 0.5) * 0.01;

  if (op === '+') { res = a.add(b); sHTML = 'Hauptnenner ' + (a.d * b.d) + ' bilden, dann Zähler addieren.'; }

}

function kopfPotenz(d) {

function kopfTerm(d) {

function genDef(d, v) {

  if (v === 'kombi') {
    const a = rnz(-6, 6);
    const b = d <= 6 ? new F(a * rnz(-6, 6) * -1, 1) : new F(rnz(-18, 18), 1);
    const r = b.div(-a);
    const op = a > 0 ? '>' : '<';
    const sol = [{ op: op, b: r.v }];
    return {
      promptHTML: '<span class="big">f(' + V() + ') = ' + fracHTML('1', sqrtHTML(polyHTML([a, b.v]))) + '</span>',
      subPrompt: 'Definitionsmenge?',
      fields: [Fcond(1, 'UND')], check: checkCond(sol),
      solHTML: 'D = { ' + V() + ' ∈ ℝ | ' + condText(sol) + ' }',
      plot: {
        fns: [{ f: x => 1 / Math.sqrt(a * x + b.v), label: 'f' }],

  }
  /* Bruch */
  if (d <= 4) {
    const A = ri(1, 4) * sgnPick();
    const R = new F(rnz(-9, 9), 1);
    const B = R.mul(-A);
    const sol = [R.v];
    return {
      promptHTML: '<span class="big">f(' + V() + ') = ' + fracHTML(polyHTML([ri(1, 5), rnz(-9, 9)]), polyHTML([A, B.v])) + '</span>',

    },

  };
}

topic({
  id: 'linear', group: 'Gleichungen', name: 'Lineare Gleichungen', icon: '⁄',
  sub: 'Äquivalenzumformungen: alles mit x auf eine Seite, Zahlen auf die andere.',
  variants: [
    { id: 'grund', name: 'Grundform', desc: 'a·x + b = c — zuerst b wegschaffen, dann durch a teilen.' },
    { id: 'beidseitig', name: 'x auf beiden Seiten', desc: 'x-Terme auf eine Seite sortieren, Zahlen auf die andere.' },
    { id: 'klammer', name: 'Mit Klammern', desc: 'Erst ausmultiplizieren bzw. Distributivgesetz, dann sortieren.' },
    { id: 'bruch', name: 'Mit Brüchen', desc: 'Mit dem Hauptnenner multiplizieren — dann sind alle Brüche weg.' },
  ],
  formulas: [
    st('Grundidee', 'Auf beiden Seiten dasselbe tun: <i>+</i>, <i>−</i>, <i>·</i>, <i>:</i> (nie durch 0!).'),
    st('Lösungsfälle', 'a·x = b hat: genau eine Lösung (a ≠ 0), keine Lösung (a = 0, b ≠ 0) oder unendlich viele (a = 0, b = 0).'),
    st('Probe', 'Lösung einsetzen — linke Seite muss gleich rechte Seite sein.'),
  ],
  gen: function (d, v) { return genLinear(d, v); }
});

function linSolution(d) {
  const q = d <= 4 ? 1 : (d <= 7 ? ri(1, 3) : ri(1, 6));
  const p = rnz(-(d <= 3 ? 9 : (d <= 6 ? 15 : 30)), d <= 3 ? 9 : (d <= 6 ? 15 : 30));
  return new F(p, q);
}

function genLinear(d, v) {
  if (v === 'klammer') return genLinearKlammer(d);
  const s = linSolution(d);
  const q = s.d;
  if (v === 'beidseitig') {
    const m = rnz(-3, 3);
    const A = rnz(-(d <= 4 ? 6 : 12), d <= 4 ? 6 : 12);
    const C = A + q * m;
    if (A === C) return genLinear(d, 'grund');
    const D = rnz(-(d <= 4 ? 12 : 40), d <= 4 ? 12 : 40);
    const B = Math.round((C - A) * s.v + D);
    return {
      promptHTML: '<span class="big">' + polyHTML([A, B]) + ' <span class="rel">=</span> ' + polyHTML([C, D]) + '</span>',
      fields: [Fnum()], check: checkNum(s.v), solHTML: V() + ' = ' + s.html(),
      plot: {
        fns: [{ f: x => A * x + B, label: 'linke Seite' }, { f: x => C * x + D, label: 'rechte Seite', color: 2 }],
        points: [{ x: s.v, y: A * s.v + B }]
      },
      steps: [
        st('x-Terme sortieren', 'Beide Seiten ' + (C >= 0 ? '− ' + polyHTML([C, 0]) : '+ ' + polyHTML([-C, 0])) + ':&nbsp; ' + polyHTML([A - C, B]) + ' = ' + num(D)),
        st('Zahl wegschaffen', 'Beide Seiten ' + (B >= 0 ? '− ' + B : '+ ' + (-B)) + ':&nbsp; ' + polyHTML([A - C, 0]) + ' = ' + num(D - B)),
        st('Durch Koeffizient teilen', ': (' + num(A - C) + ') → ' + V() + ' = ' + fracHTML(num(D - B), num(A - C)) + ' = <b>' + s.html() + '</b>')
      ]
    };
  }
  if (v === 'bruch') {
    const n1 = ri(2, d <= 5 ? 5 : 9), n2 = ri(2, d <= 5 ? 5 : 9);
    const A1 = rnz(-6, 6), A2 = rnz(-6, 6);
    const B1 = rnz(-9, 9);
    /* (A1 x + B1)/n1 = A2 x /n2 + C  → C so wählen, dass s Lösung ist */
    const C = (A1 * s.v + B1) / n1 - (A2 * s.v) / n2;
    const Cf = F.of(A1).mul(s).add(B1).div(n1).sub(F.of(A2).mul(s).div(n2));
    const L = fracHTML(polyHTML([A1, B1]), n1);
    const R = fracHTML(polyHTML([A2, 0]), n2) + coefHTML(Cf, '', false);
    const HN = n1 * n2 / gcd(n1, n2);
    return {
      promptHTML: '<span class="big">' + L + ' <span class="rel">=</span> ' + R + '</span>',
      fields: [Fnum()], check: checkNum(s.v), solHTML: V() + ' = ' + s.html(),
      plot: {
        fns: [{ f: x => (A1 * x + B1) / n1, label: 'linke Seite' }, { f: x => (A2 * x) / n2 + C, label: 'rechte Seite', color: 2 }],
        points: [{ x: s.v, y: (A1 * s.v + B1) / n1 }]
      },
      steps: [
        st('Hauptnenner', 'Hauptnenner ist ' + HN + '. Beide Seiten mit ' + HN + ' multiplizieren.'),
        st('Brüche verschwinden', polyHTML([A1 * HN / n1, B1 * HN / n1]) + ' = ' + polyHTML([A2 * HN / n2, 0]) + addHTML(Cf.mul(HN))),
        st('Sortieren & teilen', 'x-Terme auf eine Seite, Zahlen auf die andere → ' + V() + ' = <b>' + s.html() + '</b>')
      ]
    };
  }
  /* Grundform */
  const A = rnz(-(d <= 3 ? 9 : (d <= 6 ? 15 : 40)), d <= 3 ? 9 : (d <= 6 ? 15 : 40)) * (q > 1 ? q : 1);
  const Bv = rnz(-(d <= 3 ? 12 : 60), d <= 3 ? 12 : 60);
  const C = F.of(A).mul(s).add(Bv);
  return {
    promptHTML: '<span class="big">' + polyHTML([A, Bv]) + ' <span class="rel">=</span> ' + C.html() + '</span>',
    fields: [Fnum()], check: checkNum(s.v), solHTML: V() + ' = ' + s.html(),
    plot: {
      fns: [{ f: x => A * x + Bv, label: 'linke Seite' }, { f: x => C.v, label: 'rechte Seite', color: 2 }],
      points: [{ x: s.v, y: C.v }]
    },
    steps: [
      st('Zahl wegschaffen', 'Beide Seiten ' + (Bv >= 0 ? '− ' + Bv : '+ ' + (-Bv)) + ':&nbsp; ' + polyHTML([A, 0]) + ' = ' + C.sub(Bv).html()),
      st('Durch ' + num(A) + ' teilen', V() + ' = ' + C.sub(Bv).div(A).html()),
      st('Probe', num(A) + '·(' + s.html() + ')' + (Bv >= 0 ? ' + ' + Bv : ' − ' + (-Bv)) + ' = ' + C.html() + ' ✓')
    ]
  };
}

function genLinearKlammer(d) {
  const s = linSolution(d);
  const q = s.d;
  const k = ri(2, d <= 5 ? 4 : 7) * sgnPick();
  const a = rnz(-5, 5) * (q > 1 ? q : 1);
  const b = rnz(-9, 9);
  const c = rnz(-6, 6);
  /* k·(a x + b) + c = R */
  const R = F.of(k).mul(F.of(a).mul(s).add(b)).add(c);
  return {
    promptHTML: '<span class="big">' + num(k) + '·(' + polyHTML([a, b]) + ')' + coefHTML(c, '', false) + ' <span class="rel">=</span> ' + R.html() + '</span>',
    fields: [Fnum()], check: checkNum(s.v), solHTML: V() + ' = ' + s.html(),
    plot: {
      fns: [{ f: x => k * (a * x + b) + c, label: 'linke Seite' }, { f: x => R.v, label: 'rechte Seite', color: 2 }],
      points: [{ x: s.v, y: R.v }]
    },
    steps: [
      st('Ausmultiplizieren', polyHTML([k * a, k * b + c]) + ' = ' + R.html()),
      st('Zahl wegschaffen', polyHTML([k * a, 0]) + ' = ' + R.sub(k * b + c).html()),
      st('Teilen', V() + ' = ' + R.sub(k * b + c).div(k * a).html() + ' = <b>' + s.html() + '</b>')
    ]
  };
}

    st('Satz von Vieta', 'x<sub>1</sub> + x<sub>2</sub> = −p &nbsp;·&nbsp; x<sub>1</sub> · x<sub>2</sub> = q'),
    st('Nullprodukt', 'a · b = 0 ⟺ a = 0 oder b = 0'),
  ],
  gen: function (d, v) { return genQuad(d, v); }
});

function genQuad(d, v) {
  if (v === 'rein') {
    const a = d <= 4 ? 1 : ri(2, 5) * sgnPick();
    const noSol = d >= 6 && coin(0.25);
    const x0 = d <= 5 ? ri(1, 9) : ri(1, 15);
    let c, sol;
    if (noSol) { c = Math.abs(a) * ri(1, 20) * (a > 0 ? 1 : -1); sol = []; }
    else { c = -a * x0 * x0; sol = [-x0, x0]; }
    const plot = { fns: [{ f: x => a * x * x + c, label: 'f(x)' }], hlines: [{ y: 0 }], points: sol.map(x => ({ x: x, y: 0 })) };
    return {
      promptHTML: '<span class="big">' + polyHTML([a, 0, c]) + ' <span class="rel">=</span> 0</span>',
      fields: [Fset(2)], flags: FLAG_EMPTY, check: checkNums(sol), solHTML: setHTML(sol), plot: plot,
      steps: sol.length ? [
        st('Nach x² auflösen', polyHTML([a, 0]).replace('</i>', '</i>²') + ' = ' + num(-c) + ' &nbsp;|&nbsp; : ' + num(a)),
        st('Wurzel ziehen', V() + '² = ' + fmt(-c / a) + ' → ' + V() + ' = ± ' + sqrtHTML(fmt(-c / a))),
        st('Ergebnis', setHTML(sol) + ' — das ± nicht vergessen!')
      ] : [
        st('Nach x² auflösen', V() + '² = ' + fmt(-c / a)),
        st('Widerspruch', 'Ein Quadrat ist nie negativ → keine reelle Lösung.'),
        st('Ergebnis', '𝕃 = { }')
      ]
    };
  }
  if (v === 'faktor') {
    const a = d <= 4 ? 1 : ri(2, 6) * sgnPick();
    const r = rnz(-(d <= 5 ? 9 : 20), d <= 5 ? 9 : 20);
    const b = -a * r;
    const sol = uniqSorted([0, r]);
    return {
      promptHTML: '<span class="big">' + polyHTML([a, b, 0]) + ' <span class="rel">=</span> 0</span>',
      fields: [Fset(2)], flags: FLAG_EMPTY, check: checkNums(sol), solHTML: setHTML(sol),
      plot: { fns: [{ f: x => a * x * x + b * x }], hlines: [{ y: 0 }], points: sol.map(x => ({ x: x, y: 0 })) },
      steps: [
        st('x ausklammern', V() + ' · (' + polyHTML([a, b]) + ') = 0'),
        st('Nullprodukt', 'Ein Produkt ist 0, wenn ein Faktor 0 ist: ' + V() + ' = 0 &nbsp;oder&nbsp; ' + polyHTML([a, b]) + ' = 0'),
        st('Ergebnis', V() + '<sub>1</sub> = 0, ' + V() + '<sub>2</sub> = ' + valHTML(r) + ' → ' + setHTML(sol) + '<br><span class="muted">Nie durch x teilen — sonst geht die Lösung x = 0 verloren!</span>')
      ]
    };
  }
  if (v === 'bi') {
    const u1 = ri(1, d <= 6 ? 5 : 9), u2 = ri(1, d <= 6 ? 5 : 9);
    const neg = d >= 7 && coin(0.4);
    const U = neg ? [u1 * u1, -u2 * u2] : [u1 * u1, u2 * u2];
    const p = -(U[0] + U[1]), q = U[0] * U[1];
    let sol = [];
    U.forEach(u => { if (u > 0) { sol.push(Math.sqrt(u)); sol.push(-Math.sqrt(u)); } else if (u === 0) sol.push(0); });
    sol = uniqSorted(sol);
    return {
      promptHTML: '<span class="big">' + polyHTML([1, 0, p, 0, q]) + ' <span class="rel">=</span> 0</span>',
      fields: [Fset(4)], flags: FLAG_EMPTY, check: checkNums(sol), solHTML: setHTML(sol),
      steps: [
        st('Substitution', 'Setze u = ' + V() + '² → u² ' + (p >= 0 ? '+ ' + p : '− ' + (-p)) + 'u ' + (q >= 0 ? '+ ' + q : '− ' + (-q)) + ' = 0'),
        st('pq-Formel', 'u<sub>1,2</sub> = ' + fmt(-p / 2) + ' ± ' + sqrtHTML(fmt(p * p / 4 - q)) + ' → u<sub>1</sub> = ' + fmt(U[0]) + ', u<sub>2</sub> = ' + fmt(U[1])),
        st('Rücksubstitution', 'x² = u. Negative u liefern keine reelle Lösung.'),
        st('Ergebnis', setHTML(sol))
      ]
    };
  }
  if (v === 'abc') {
    const a = ri(2, d <= 5 ? 4 : 9) * (d >= 7 && coin(0.3) ? -1 : 1);
    const r1 = new F(rnz(-9, 9), d <= 6 ? 1 : pick([1, 1, 2, a]));
    const r2 = new F(rnz(-9, 9), d <= 6 ? 1 : pick([1, 1, 2, a]));
    const bF = r1.add(r2).mul(-a), cF = r1.mul(r2).mul(a);
    if (!bF.isInt() || !cF.isInt()) return genQuad(d, 'pq');
    const b = bF.n, c = cF.n;
    const sol = uniqSorted([r1.v, r2.v]);
    const D = b * b - 4 * a * c;
    return {
      promptHTML: '<span class="big">' + polyHTML([a, b, c]) + ' <span class="rel">=</span> 0</span>',
      fields: [Fset(2)], flags: FLAG_EMPTY, check: checkNums(sol), solHTML: setHTML(sol),
      plot: { fns: [{ f: x => a * x * x + b * x + c }], hlines: [{ y: 0 }], points: sol.map(x => ({ x: x, y: 0 })) },
      steps: [
        st('Koeffizienten', 'a = ' + num(a) + ', b = ' + num(b) + ', c = ' + num(c)),
        st('Diskriminante', 'D = b² − 4ac = ' + (b * b) + ' − 4·' + paren(a) + '·' + paren(c) + ' = ' + num(D)),
        st('Mitternachtsformel', V() + '<sub>1,2</sub> = ' + fracHTML(num(-b) + ' ± ' + sqrtHTML(num(D)), '2·' + paren(a)) + ' = ' + fracHTML(num(-b) + ' ± ' + fmt(Math.sqrt(Math.max(D, 0))), num(2 * a))),
        st('Ergebnis', setHTML(sol))
      ]
    };
  }
  /* pq */
  const exact = d <= 6 || coin(0.5);
  let p, q, sol;
  if (exact) {
    const r1 = rnz(-(d <= 4 ? 6 : 12), d <= 4 ? 6 : 12), r2 = rnz(-(d <= 4 ? 6 : 12), d <= 4 ? 6 : 12);
    p = -(r1 + r2); q = r1 * r2; sol = uniqSorted([r1, r2]);
  } else {
    p = rnz(-12, 12); q = ri(-30, 30);
    sol = solveQuad(1, p, q);
    if (d < 8 && !sol.length) { q = -Math.abs(q); sol = solveQuad(1, p, q); }
  }
  const D = p * p / 4 - q;
  return {
    promptHTML: '<span class="big">' + polyHTML([1, p, q]) + ' <span class="rel">=</span> 0</span>',
    fields: [Fset(2)], flags: FLAG_EMPTY, check: checkNums(sol), solHTML: setHTML(sol),
    plot: { fns: [{ f: x => x * x + p * x + q }], hlines: [{ y: 0 }], points: sol.map(x => ({ x: x, y: 0 })) },
    steps: [
      st('p und q ablesen', 'p = ' + num(p) + ', q = ' + num(q)),
      st('pq-Formel', V() + '<sub>1,2</sub> = ' + valHTML(-p / 2) + ' ± ' + sqrtHTML('(' + valHTML(p / 2) + ')² − (' + num(q) + ')')),
      st('Diskriminante', 'unter der Wurzel: ' + fmt(D) + (D < 0 ? ' &lt; 0 → keine reelle Lösung' : (D === 0 ? ' = 0 → eine (doppelte) Lösung' : ' &gt; 0 → zwei Lösungen'))),
      st('Ergebnis', setHTML(sol) + (exact && sol.length === 2 ? '<br><span class="muted">Kontrolle mit Vieta: Summe = ' + num(-p) + ', Produkt = ' + num(q) + '</span>' : ''))
    ]
  };
}

function genBruchGl(d, v) {

    },
    steps: [
      st('Definitionsmenge', V() + ' ≠ ' + num(-p) + ', also D = ℝ \\ { ' + num(-p) + ' }'),
      st('Mit dem Nenner multiplizieren', num(a) + ' = ' + num(c) + '·(' + polyHTML([1, p]) + ')'),
      st('Auflösen', V() + addHTML(p) + ' = ' + new F(a, c).html() + ' → ' + V() + ' = <b>' + s.html() + '</b>'),
      st('Probe', 'Der Wert liegt in D ✓')
    ]
  };
}
