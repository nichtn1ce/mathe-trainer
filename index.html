    bg: '#eef2f6', green: '#12a150', red: '#d92d4e', blue: '#1475e1', yellow: '#d99b00',
    pink: '#d4526e', area: 'rgba(18,161,80,.12)', areaEdge: 'rgba(18,161,80,.38)',
    fill0: 'rgba(20,117,225,.22)', fill1: 'rgba(20,117,225,0)', legendGreen: 'rgba(18,161,80,.75)'
  }
};
let CC = CANVAS_COLORS.dark;

/* Laufende Trefferquote ueber die letzten Antworten */
function drawCurve(cv, hist, label) {
  const g = fitCanvas(cv); if (!g) return;
  const c = g.c, PL = 34, PR = 10, PT = 12, PB = 22;
  if (!hist || hist.length < 2) { emptyChart(g, label || 'Noch keine Antworten aufgezeichnet.'); return; }
  const W = g.w - PL - PR, H = g.h - PT - PB;
  /* gleitende Quote ueber ein Fenster von hoechstens 10 Antworten */
  const pts = hist.map((_, i) => {
    const a = Math.max(0, i - 9), win = hist.slice(a, i + 1);
    return win.reduce((x, y) => x + y, 0) / win.length * 100;
  });
  c.strokeStyle = CC.grid; c.lineWidth = 1;
  c.fillStyle = CC.lbl; c.font = '600 10px ' + FONT_UI;
  c.textAlign = 'right'; c.textBaseline = 'middle';
  [0, 25, 50, 75, 100].forEach(v => {
    const y = PT + H - v / 100 * H;
    c.beginPath(); c.moveTo(PL, y + .5); c.lineTo(PL + W, y + .5); c.stroke();
    c.fillText(v + '%', PL - 7, y);
  });
  const X = i => PL + (pts.length === 1 ? W / 2 : i / (pts.length - 1) * W);
  const Y = v => PT + H - v / 100 * H;
  const grd = c.createLinearGradient(0, PT, 0, PT + H);
  grd.addColorStop(0, CC.fill0); grd.addColorStop(1, CC.fill1);
  c.beginPath(); c.moveTo(X(0), Y(pts[0]));
  pts.forEach((v, i) => c.lineTo(X(i), Y(v)));
  c.lineTo(X(pts.length - 1), PT + H); c.lineTo(X(0), PT + H); c.closePath();
  c.fillStyle = grd; c.fill();
  c.beginPath(); c.moveTo(X(0), Y(pts[0]));
  pts.forEach((v, i) => c.lineTo(X(i), Y(v)));
  c.strokeStyle = CC.blue; c.lineWidth = 2.2; c.lineJoin = 'round'; c.stroke();
  /* einzelne Antworten als Punkte */
  hist.forEach((okv, i) => {
    c.beginPath(); c.arc(X(i), Y(pts[i]), 2.6, 0, 6.284);
    c.fillStyle = okv ? CC.green : CC.red; c.fill();
  });
  c.fillStyle = CC.lbl; c.font = '600 10px ' + FONT_UI;
  c.textAlign = 'left'; c.textBaseline = 'top';
  c.fillText('erste', PL, PT + H + 6);
  c.textAlign = 'right';
  c.fillText('letzte (' + hist.length + ')', PL + W, PT + H + 6);
}

/* Trefferquote je Thema als liegende Balken */
function drawBars(cv) {
  const rows = TOPICS.filter(t => S(t.id).n > 0).sort((a, b) => {
    const x = S(a.id), y = S(b.id);
    return (y.ok / y.n) - (x.ok / x.n);
  });
  /* Die Flaeche waechst mit der Zahl der Themen, statt leeren Raum zu lassen. */
  cv.parentNode.style.height = Math.max(70, rows.length * 30 + 12) + 'px';
  const g = fitCanvas(cv); if (!g) return;
  const c = g.c;
  if (!rows.length) { emptyChart(g, 'Noch keine Aufgaben gerechnet.'); return; }
  const PL = Math.min(170, Math.max(110, g.w * 0.22)), PR = 74, PT = 6, PB = 6;
  const W = g.w - PL - PR;
  const step = Math.min(30, (g.h - PT - PB) / rows.length);
  const bh = Math.min(14, step - 8);
  c.font = '700 11.5px ' + FONT_UI; c.textBaseline = 'middle';
  rows.forEach((t, i) => {
    const st = S(t.id), q = st.ok / st.n;
    const y = PT + i * step + step / 2;
    c.textAlign = 'right'; c.fillStyle = CC.lbl2;
    let nm = t.name;
    while (c.measureText(nm).width > PL - 12 && nm.length > 4) nm = nm.slice(0, -2) + '…';
    c.fillText(nm, PL - 10, y);
    c.fillStyle = CC.bar;
    rrect(c, PL, y - bh / 2, W, bh, bh / 2); c.fill();
    c.fillStyle = q >= .7 ? CC.green : (q >= .4 ? CC.yellow : CC.red);
    rrect(c, PL, y - bh / 2, Math.max(bh, W * q), bh, bh / 2); c.fill();
    c.textAlign = 'left'; c.fillStyle = CC.lbl2;
    c.fillText(Math.round(q * 100) + ' %', PL + W + 9, y);
    c.fillStyle = CC.lbl;
    c.fillText('· ' + st.n, PL + W + 48, y);
  });
}

/* ============================================================
   GRAPH
   ============================================================ */
const CV = $('cv'), CTX = CV.getContext('2d');
const COLOR_SETS = {
  dark: ['#1475e1', '#ffbf3f', '#c17aff', '#00e701'],
  light: ['#1475e1', '#d99b00', '#8a4fd6', '#12a150']
};
let COLORS = COLOR_SETS.dark;

function setupPlot() {
  const p = state.task.plot;
  $('vizCard').style.display = p ? '' : 'none';
  $('ficGraph').style.display = p ? '' : 'none';
  if (!p) return;
  if (p.kind === 'contour') {
    /* Ausschnitt so waehlen, dass alle wichtigen Punkte sichtbar sind. */
    let bx;
    if (p.box) bx = p.box.slice();
    else {
      const xs = [], ys = [];
      if (p.point) { xs.push(p.point.x); ys.push(p.point.y); }
      if (p.grad) { xs.push(p.grad.x); ys.push(p.grad.y); }
      if (p.line && Math.abs(p.line.a) > 1e-9) { xs.push(0); xs.push(p.line.c / p.line.a); }
      if (p.line && Math.abs(p.line.b) > 1e-9) { ys.push(0); ys.push(p.line.c / p.line.b); }
      const sp = p.span || 3;
      if (!xs.length) { xs.push(-sp, sp); } if (!ys.length) { ys.push(-sp, sp); }
      let xlo = Math.min.apply(null, xs), xhi = Math.max.apply(null, xs);
      let ylo = Math.min.apply(null, ys), yhi = Math.max.apply(null, ys);
      if (xhi - xlo < sp) { const m = (xhi + xlo) / 2; xlo = m - sp / 2; xhi = m + sp / 2; }
      if (yhi - ylo < sp) { const m = (yhi + ylo) / 2; ylo = m - sp / 2; yhi = m + sp / 2; }
      const px2 = (xhi - xlo) * 0.28, py2 = (yhi - ylo) * 0.28;
      bx = [xlo - px2, xhi + px2, ylo - py2, yhi + py2];
    }
    if (p.iso && !p.box) {
      const c = p.cxy || (p.point ? [p.point.x, p.point.y] : (p.grad ? [p.grad.x, p.grad.y] : [0, 0]));
      bx = [c[0] - 1, c[0] + 1, c[1] - 1, c[1] + 1];
    }
    state.view2 = { cx: (bx[0] + bx[1]) / 2, cy: (bx[2] + bx[3]) / 2, w: bx[1] - bx[0], h: bx[3] - bx[2], zoom: 1 };
    $('zoom').value = 0; paintZoom();
    setTimeout(drawPlot, 0);
    return;
  }
  const xs = [];
  (p.points || []).forEach(q => xs.push(q.x));
  (p.regions || []).forEach(r => { if (isFinite(r.from) && Math.abs(r.from) < 1e5) xs.push(r.from); if (isFinite(r.to) && Math.abs(r.to) < 1e5) xs.push(r.to); });
  let lo = -5, hi = 5;
  if (xs.length) {
    lo = Math.min.apply(null, xs); hi = Math.max.apply(null, xs);
    /* Bei grossen Loesungen muss der Ausschnitt mitwachsen, sonst steht der Punkt
       in einem 4 Einheiten breiten Fenster und die Kurven wirken flach. */
    const mag = Math.max(Math.abs(lo), Math.abs(hi));
    const pad = Math.max(1.5, (hi - lo) * 0.35, mag * 0.6);
    lo -= pad; hi += pad;
  }
  if (hi - lo < 4) { const m = (hi + lo) / 2; lo = m - 2; hi = m + 2; }
  const ys = [];
  (p.fns || []).forEach(fn => { for (let i = 0; i <= 80; i++) { const y = fn.f(lo + (hi - lo) * i / 80); if (isFinite(y)) ys.push(y); } });
  const must = [];
  (p.hlines || []).forEach(h => must.push(h.y));
  (p.points || []).forEach(q => { if (isFinite(q.y)) must.push(q.y); });
  if ((p.hlines || []).length || (p.regions || []).length || (p.points || []).length) must.push(0);
  ys.sort((a, b) => a - b);
  let ylo = -5, yhi = 5;
  if (ys.length > 3) { ylo = ys[Math.floor(ys.length * 0.10)]; yhi = ys[Math.floor(ys.length * 0.90)]; }
  must.forEach(y => { ylo = Math.min(ylo, y); yhi = Math.max(yhi, y); });
  if (yhi - ylo < 2) { const m = (yhi + ylo) / 2; ylo = m - 2; yhi = m + 2; }
  const padY = (yhi - ylo) * 0.25; ylo -= padY; yhi += padY;
  state.view2 = { cx: (lo + hi) / 2, cy: (ylo + yhi) / 2, w: hi - lo, h: yhi - ylo, zoom: 1 };
  $('zoom').value = 0; paintZoom();
  drawPlot();
}
function niceStep(raw) {
  const p = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / p;
  return (n < 1.5 ? 1 : n < 3.5 ? 2 : n < 7.5 ? 5 : 10) * p;
}
function drawPlot() {
  const p = state.task && state.task.plot; if (!p || !state.view2) return;
  const W = CV.clientWidth, H = (p.kind === 'contour' ? 340 : 250);
  if (!W) return;
  const dpr = window.devicePixelRatio || 1;
  CV.style.height = H + 'px';
  CV.width = W * dpr; CV.height = H * dpr;
  CTX.setTransform(dpr, 0, 0, dpr, 0, 0);
  CTX.clearRect(0, 0, W, H);
  const v = state.view2;
  /* Bei Hoehenlinien sollen Kreise auch wie Kreise aussehen: Ausschnitt an die
     Leinwand angleichen, statt ihn zu verzerren. */
  if (p.kind === 'contour' && p.iso) { v.h = 2 * (p.r || 3); v.w = v.h * W / H; }
  const wx = v.w * v.zoom, wy = v.h * v.zoom;
  const x0 = v.cx - wx / 2, x1 = v.cx + wx / 2, y0 = v.cy - wy / 2, y1 = v.cy + wy / 2;
  const SX = x => (x - x0) / wx * W, SY = y => H - (y - y0) / wy * H;
  const stepX = niceStep(wx / 8), stepY = niceStep(wy / 5);
  CTX.lineWidth = 1; CTX.font = '10px ' + getComputedStyle(document.body).fontFamily;
  for (let x = Math.ceil(x0 / stepX) * stepX; x <= x1; x += stepX) {
    const sx = SX(x);
    CTX.strokeStyle = Math.abs(x) < 1e-9 ? CC.grid : CC.minor;
    CTX.beginPath(); CTX.moveTo(sx, 0); CTX.lineTo(sx, H); CTX.stroke();
    if (Math.abs(x) > 1e-9) { CTX.fillStyle = CC.lbl; CTX.fillText(fmt(x, 2), sx + 3, Math.min(H - 4, Math.max(11, SY(0) + 12))); }
  }
  for (let y = Math.ceil(y0 / stepY) * stepY; y <= y1; y += stepY) {
    const sy = SY(y);
    CTX.strokeStyle = Math.abs(y) < 1e-9 ? CC.grid : CC.minor;
    CTX.beginPath(); CTX.moveTo(0, sy); CTX.lineTo(W, sy); CTX.stroke();
    if (Math.abs(y) > 1e-9) { CTX.fillStyle = CC.lbl; CTX.fillText(fmt(y, 2), Math.min(W - 30, Math.max(4, SX(0) + 5)), sy - 4); }
  }
  if (p.kind === 'contour') { drawContour(p, W, H, x0, x1, y0, y1, SX, SY); return; }
  (p.regions || []).forEach(r => {
    const a = SX(Math.max(r.from, x0 - 1)), b = SX(Math.min(r.to, x1 + 1));
    CTX.fillStyle = CC.area; CTX.fillRect(a, 0, b - a, H);
    CTX.strokeStyle = CC.areaEdge;
    [a, b].forEach(sx => { if (sx > 0 && sx < W) { CTX.beginPath(); CTX.moveTo(sx, 0); CTX.lineTo(sx, H); CTX.stroke(); } });
  });
  CTX.setLineDash([5, 4]); CTX.lineWidth = 1.4;
  (p.hlines || []).forEach(h => {
    if (Math.abs(h.y) < 1e-12) return;
    CTX.strokeStyle = CC.red;
    CTX.beginPath(); CTX.moveTo(0, SY(h.y)); CTX.lineTo(W, SY(h.y)); CTX.stroke();
  });
  CTX.setLineDash([]);
  (p.fns || []).forEach((fn, i) => {
    CTX.strokeStyle = COLORS[(fn.color || (i + 1)) - 1] || COLORS[i % 4];
    CTX.lineWidth = 2; CTX.lineJoin = 'round'; CTX.beginPath();
    let pen = false, prev = null;
    for (let px = 0; px <= W; px++) {
      const y = fn.f(x0 + wx * px / W);
      if (!isFinite(y)) { pen = false; prev = null; continue; }
      const sy = SY(y);
      if (sy < -4 * H || sy > 5 * H) { pen = false; prev = null; continue; }
      if (prev !== null && Math.abs(sy - prev) > H * 1.6) pen = false;
      if (!pen) { CTX.moveTo(px, sy); pen = true; } else CTX.lineTo(px, sy);
      prev = sy;
    }
    CTX.stroke();
  });
  (p.points || []).forEach(q => {
    const sx = SX(q.x), sy = SY(q.y);
    if (sx < -20 || sx > W + 20 || sy < -20 || sy > H + 20) return;
    CTX.fillStyle = CC.green; CTX.strokeStyle = CC.bg; CTX.lineWidth = 2.5;
    CTX.beginPath(); CTX.arc(sx, sy, 4.5, 0, 7); CTX.fill(); CTX.stroke();
  });
  const lg = [];
  (p.fns || []).forEach((fn, i) => lg.push([COLORS[(fn.color || (i + 1)) - 1] || COLORS[i % 4],
    fn.label || ['f(x)', 'g(x)', 'h(x)'][i] || 'f(x)']));
  if ((p.hlines || []).some(h => Math.abs(h.y) > 1e-12)) lg.push([CC.red, 'Schwelle']);
  if ((p.regions || []).length) lg.push([CC.legendGreen, 'Lösungsbereich']);
  if ((p.points || []).length) lg.push([CC.green, 'Lösung(en)']);
  $('legend').innerHTML = lg.map(l => '<span><i style="background:' + l[0] + '"></i>' + l[1] + '</span>').join('');
}

/* ============================================================
   HÖHENLINIEN — Draufsicht auf f(x, y)
   ============================================================ */
const CLEVELS = ['#1f5fa8', '#2a7fd0', '#3ea0e0', '#63bfd6', '#9ac9a0', '#c9c25e', '#e0a13a', '#e26f45', '#ed4163'];
/* Marching Squares: Segmente einer Höhenlinie im Gitter */
function isoSegments(G, nx, ny, lev, px, py) {
  const seg = [];
  const ip = (a, b, va, vb) => a + (b - a) * ((lev - va) / (vb - va));
  for (let j = 0; j < ny; j++) {
    for (let i = 0; i < nx; i++) {
      const v0 = G[j][i], v1 = G[j][i + 1], v2 = G[j + 1][i + 1], v3 = G[j + 1][i];
      if (!isFinite(v0) || !isFinite(v1) || !isFinite(v2) || !isFinite(v3)) continue;
      let idx = 0;
      if (v0 > lev) idx |= 1; if (v1 > lev) idx |= 2; if (v2 > lev) idx |= 4; if (v3 > lev) idx |= 8;
      if (idx === 0 || idx === 15) continue;
      const x0 = px(i), x1 = px(i + 1), y0 = py(j), y1 = py(j + 1);
      const A = () => [ip(x0, x1, v0, v1), y0];
      const B = () => [x1, ip(y0, y1, v1, v2)];
      const C = () => [ip(x0, x1, v3, v2), y1];
      const D = () => [x0, ip(y0, y1, v0, v3)];
      const push = (p1, p2) => seg.push([p1[0], p1[1], p2[0], p2[1]]);
      switch (idx) {
        case 1: case 14: push(D(), A()); break;
        case 2: case 13: push(A(), B()); break;
        case 3: case 12: push(D(), B()); break;
        case 4: case 11: push(B(), C()); break;
        case 5: push(D(), C()); push(A(), B()); break;
        case 6: case 9: push(A(), C()); break;
        case 7: case 8: push(D(), C()); break;
        case 10: push(D(), A()); push(B(), C()); break;
      }
    }
  }
  return seg;
}
function drawContour(p, W, H, x0, x1, y0, y1, SX, SY) {
  const f = p.f;
  const nx = 108, ny = 68;
  const gx = i => x0 + (x1 - x0) * i / nx, gy = j => y0 + (y1 - y0) * j / ny;
  const G = [], vals = [];
  for (let j = 0; j <= ny; j++) {
    const row = [];
    for (let i = 0; i <= nx; i++) { const z = f(gx(i), gy(j)); row.push(z); if (isFinite(z)) vals.push(z); }
    G.push(row);
  }
  if (vals.length < 20) { $('legend').innerHTML = ''; return; }
  /* Die Höhen werden einmal je Aufgabe bestimmt. Sonst würden sich beim Verschieben
     ständig neue Niveaus ergeben und die Linien scheinbar wandern. */
  let levels = p.levels ? p.levels.slice() : p.__lv;
  if (!levels) {
    vals.sort((a, b) => a - b);
    const q = t => vals[Math.min(vals.length - 1, Math.max(0, Math.round(t * (vals.length - 1))))];
    const lo = q(0.04), hi = q(0.96);
    levels = [];
    const n = 9; for (let k = 0; k < n; k++) levels.push(lo + (hi - lo) * (k + 0.5) / n);
    p.__lv = levels;
  }
  const px = i => SX(gx(i)), py = j => SY(gy(j));
  CTX.lineWidth = 1.7; CTX.lineCap = 'round';
  levels.forEach((lev, k) => {
    CTX.strokeStyle = CLEVELS[Math.round(k / Math.max(1, levels.length - 1) * (CLEVELS.length - 1))];
    CTX.globalAlpha = .95;
    CTX.beginPath();
    isoSegments(G, nx, ny, lev, px, py).forEach(sg => { CTX.moveTo(sg[0], sg[1]); CTX.lineTo(sg[2], sg[3]); });
    CTX.stroke();
  });
  CTX.globalAlpha = 1;

  /* Höhenlinie durch den optimalen Punkt hervorheben */
  if (p.point && p.highlight !== false) {
    const lev = f(p.point.x, p.point.y);
    if (isFinite(lev)) {
      CTX.strokeStyle = CC.yellow; CTX.lineWidth = 2.6;
      CTX.beginPath();
      isoSegments(G, nx, ny, lev, px, py).forEach(sg => { CTX.moveTo(sg[0], sg[1]); CTX.lineTo(sg[2], sg[3]); });
      CTX.stroke();
    }
  }
  /* Nebenbedingung als Gerade a·x + b·y = c */
  if (p.line) {
    const L = p.line;
    const pts = [];
    if (Math.abs(L.b) > 1e-9) { pts.push([x0, (L.c - L.a * x0) / L.b]); pts.push([x1, (L.c - L.a * x1) / L.b]); }
    else { pts.push([L.c / L.a, y0]); pts.push([L.c / L.a, y1]); }
    CTX.strokeStyle = CC.green; CTX.lineWidth = 2.4; CTX.setLineDash([]);
    CTX.beginPath(); CTX.moveTo(SX(pts[0][0]), SY(pts[0][1])); CTX.lineTo(SX(pts[1][0]), SY(pts[1][1])); CTX.stroke();
  }
  /* Gradientpfeil */
  if (p.grad) {
    const gxp = p.grad.x, gyp = p.grad.y;
    const h = 1e-4;
    const dx = (f(gxp + h, gyp) - f(gxp - h, gyp)) / (2 * h);
    const dy = (f(gxp, gyp + h) - f(gxp, gyp - h)) / (2 * h);
    const n = Math.hypot(dx, dy);
    if (isFinite(n) && n > 1e-9) {
      const len = Math.min(W, H) * 0.16;
      const sx = SX(gxp), sy = SY(gyp);
      const ex = sx + dx / n * len, ey = sy - dy / n * len;
      CTX.strokeStyle = CC.pink; CTX.fillStyle = CC.pink; CTX.lineWidth = 2.4;
      CTX.beginPath(); CTX.moveTo(sx, sy); CTX.lineTo(ex, ey); CTX.stroke();
      const ang = Math.atan2(ey - sy, ex - sx);
      CTX.beginPath();
      CTX.moveTo(ex, ey);
      CTX.lineTo(ex - 9 * Math.cos(ang - 0.42), ey - 9 * Math.sin(ang - 0.42));
      CTX.lineTo(ex - 9 * Math.cos(ang + 0.42), ey - 9 * Math.sin(ang + 0.42));
      CTX.closePath(); CTX.fill();
      CTX.fillStyle = CC.bg; CTX.strokeStyle = CC.pink; CTX.lineWidth = 2;
      CTX.beginPath(); CTX.arc(sx, sy, 3.4, 0, 7); CTX.fill(); CTX.stroke();
    }
  }
  /* Markierter Punkt */
  if (p.point) {
    const sx = SX(p.point.x), sy = SY(p.point.y);
    CTX.fillStyle = CC.green; CTX.strokeStyle = CC.bg; CTX.lineWidth = 2.5;
    CTX.beginPath(); CTX.arc(sx, sy, 5, 0, 7); CTX.fill(); CTX.stroke();
  }
  const lg = [['#3ea0e0', 'niedrig'], ['#e0a13a', 'hoch']];
  if (p.point && p.highlight !== false) lg.push([CC.yellow, p.levelLabel || 'Höhenlinie durch P']);
  if (p.line) lg.push([CC.green, p.lineLabel || 'Nebenbedingung']);
  if (p.grad) lg.push([CC.pink, '∇f (steilster Anstieg)']);
  if (p.point) lg.push([CC.green, p.pointLabel || 'gesuchte Stelle']);
  $('legend').innerHTML = lg.map(l => '<span><i style="background:' + l[0] + '"></i>' + l[1] + '</span>').join('');
}

  state.view2.zoom = Math.min(zmax, Math.max(zmin, state.view2.zoom * (e.deltaY > 0 ? 1.12 : 1 / 1.12)));
  $('zoom').value = Math.round(Math.log(state.view2.zoom) / Math.log(1.12));
  paintZoom();

}, { passive: false });

/* ---------- Typenleiste: mit der Maus ziehen statt klicken ---------- */
function makeDraggable(row) {
  let down = false, moved = 0, startX = 0, startL = 0, id = null;
  row.addEventListener('pointerdown', e => {
    if (e.button !== undefined && e.button !== 0) return;
    down = true; moved = 0; startX = e.clientX; startL = row.scrollLeft; id = e.pointerId;
    row.classList.add('grabbing');
  });
  row.addEventListener('pointermove', e => {
    if (!down) return;
    const dx = e.clientX - startX;
    if (Math.abs(dx) > 2) {
      if (!row.hasPointerCapture(id)) { try { row.setPointerCapture(id); } catch (err) { } }
      moved = Math.max(moved, Math.abs(dx));
      row.scrollLeft = startL - dx;
      e.preventDefault();
    }
  });
  const up = () => {
    if (!down) return;
    down = false; row.classList.remove('grabbing');
    if (id !== null && row.hasPointerCapture(id)) { try { row.releasePointerCapture(id); } catch (err) { } }
    if (moved > 4) { row.dataset.drag = '1'; setTimeout(() => { delete row.dataset.drag; }, 0); }
  };
  row.addEventListener('pointerup', up);
  row.addEventListener('pointercancel', up);
  row.addEventListener('pointerleave', up);
  /* ein Klick am Ende einer Ziehbewegung darf keinen Tab umschalten */
  row.addEventListener('click', e => { if (row.dataset.drag) { e.stopPropagation(); e.preventDefault(); } }, true);
  /* Mausrad: senkrechtes Scrollen bewegt die Leiste waagerecht */
  row.addEventListener('wheel', e => {
    if (row.scrollWidth <= row.clientWidth) return;
    const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    if (!d) return;
    row.scrollLeft += d; e.preventDefault();
  }, { passive: false });
  /* Schatten links/rechts zeigen, dass es weitergeht */
  const upd = () => {
    const max = row.scrollWidth - row.clientWidth;
    row.classList.toggle('fadeL', row.scrollLeft > 4);
    row.classList.toggle('fadeR', row.scrollLeft < max - 4);
  };
  row.addEventListener('scroll', upd);
  window.addEventListener('resize', upd);
  setTimeout(upd, 60);
  row.__upd = upd;
}

/* ============================================================
   TON
   ============================================================
   Alle Klaenge entstehen im Browser — so bleibt die Datei eigenstaendig.
   Drei Faelle: auf Anhieb richtig, nach Fehlversuchen richtig, und daneben. */
let AC = null;
function audioCtx() {
  try {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return null;
    AC = AC || new C();
    if (AC.state === 'suspended') AC.resume();
    return AC;
  } catch (e) { return null; }
}
/* Weiche Huellkurve — hartes Ein- und Ausschalten wuerde knacken. */
function tone(ctx, freq, at, dur, peak, type, glide) {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, at);
  if (glide) o.frequency.exponentialRampToValueAtTime(glide, at + dur * 0.9);
  g.gain.setValueAtTime(0.0001, at);
  g.gain.exponentialRampToValueAtTime(peak, at + 0.016);
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g); g.connect(ctx.destination);
  o.start(at); o.stop(at + dur + 0.03);
}
/* Auf Anhieb richtig: heller Dur-Dreiklang aufwaerts. */
function playGood(streak) {
  const ctx = audioCtx(); if (!ctx) return;
  const t = ctx.currentTime + 0.01;
  const notes = [1046.50, 1318.51, 1567.98];               /* C6 · E6 · G6 */
  if (streak >= 3) notes.push(2093.00);
  notes.forEach((f, i) => {
    tone(ctx, f, t + i * 0.072, 0.30, 0.10, 'sine');
    tone(ctx, f * 2, t + i * 0.072, 0.14, 0.018, 'triangle');
  });
}
/* Nach Fehlversuchen richtig: waermer und tiefer — es loest sich auf,
   statt zu jubeln. */
function playRecover() {
  const ctx = audioCtx(); if (!ctx) return;
  const t = ctx.currentTime + 0.01;
  [[783.99, 0], [1046.50, 0.10]].forEach(([f, d]) => {
    tone(ctx, f, t + d, 0.36, 0.085, 'sine');
    tone(ctx, f * 2, t + d, 0.18, 0.014, 'triangle');
  });
}
/* Daneben: ein kurzer, tiefer Doppelton. Leise gehalten — er soll auf den
   Fehler zeigen, nicht bestrafen. Ab dem dritten Versuch noch dezenter. */
function playBad(tries) {
  const ctx = audioCtx(); if (!ctx) return;
  const t = ctx.currentTime + 0.01;
  const v = tries >= 3 ? 0.038 : 0.055;
  tone(ctx, 311.13, t, 0.15, v, 'triangle');               /* Es4 */
  tone(ctx, 233.08, t + 0.09, 0.22, v, 'triangle');        /* B3 */
}
function playDone() {
  const ctx = audioCtx(); if (!ctx) return;
  const t = ctx.currentTime + 0.01;
  [783.99, 1046.50, 1318.51, 1567.98, 2093.00].forEach((f, i) =>
    tone(ctx, f, t + i * 0.082, 0.40, 0.09, 'sine'));
}

/* ============================================================
   FARBMODUS & SPEICHERUNG
   ============================================================ */
const LS_KEY = 'mathe-trainer-v1';

/* Der Browserspeicher kann gesperrt sein (privates Fenster, strenge
   Einstellungen) — dann laeuft alles wie bisher, nur ohne Gedaechtnis. */
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { } }

/* Ohne eigene Wahl richtet sich die Anzeige nach der Einstellung des Geraets. */
function systemLight() {
  return !!(window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches);
}
function applyTheme(light, quiet) {
  state.light = !!light;
  document.documentElement.classList.toggle('light', state.light);
  CC = state.light ? CANVAS_COLORS.light : CANVAS_COLORS.dark;
  COLORS = state.light ? COLOR_SETS.light : COLOR_SETS.dark;
  LVL_COLOR = state.light ? LVL_COLORS.light : LVL_COLORS.dark;
  const u = document.querySelector('#btnTheme use');
  if (u) u.setAttribute('href', state.light ? '#i-sun' : '#i-moon');
  /* Adressleiste auf dem Handy mitfaerben — beide Angaben gleich setzen,
     damit die Systemeinstellung sie nicht wieder auseinanderzieht. */
  Array.prototype.forEach.call(document.querySelectorAll('meta[name=theme-color]'),
    m => m.setAttribute('content', state.light ? '#ffffff' : '#12232f'));
  if (!quiet) { setLvlColor(state.diff); redraw(); }
}

/* Was gespeichert wird: Statistik, Laeufe, Farbmodus und die zuletzt
   eingestellte Stufe — nicht die laufende Aufgabe. */
function saveAll() {
  /* Der Farbmodus wird nur festgehalten, wenn er von Hand gewaehlt wurde —
     sonst soll die Seite weiter der Geraeteeinstellung folgen. */
  lsSet(LS_KEY, JSON.stringify({
    v: 1, stats: state.stats, runs: state.runs, diff: state.diff,
    light: state.chosen ? !!state.light : null
  }));
}
function loadAll() {
  let d = null;
  try { d = JSON.parse(lsGet(LS_KEY) || 'null'); } catch (e) { d = null; }
  if (!d || typeof d !== 'object') return null;
  if (d.stats && typeof d.stats === 'object') {
    for (const k in d.stats) {
      const o = d.stats[k]; if (!o || typeof o !== 'object') continue;
      state.stats[k] = {
        n: +o.n || 0, ok: +o.ok || 0, streak: +o.streak || 0, best: +o.best || 0,
        hist: Array.isArray(o.hist) ? o.hist.slice(-120) : [],
        lvl: Array.isArray(o.lvl) ? o.lvl.slice(-120) : []
      };
    }
  }
  if (Array.isArray(d.runs)) state.runs = d.runs.slice(0, 12);
  return d;
}

/* Der Wechsel zieht den neuen Modus als Kreis aus dem Knopf heraus.
   Wo der Browser das nicht kann, blenden die Farben stattdessen weich um. */
function switchTheme() {
  const btn = $('btnTheme');
  const r = btn.getBoundingClientRect();
  const x = r.left + r.width / 2, y = r.top + r.height / 2;
  const rad = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion:reduce)').matches;
  /* Das Symbol dreht sich erst, wenn der Kreis durch ist — waehrend des
     Uebergangs zeigt der Browser ein Standbild, dort waere sie unsichtbar. */
  const spin = () => {
    btn.classList.remove('spin'); void btn.offsetWidth; btn.classList.add('spin');
    setTimeout(() => btn.classList.remove('spin'), 620);
  };

  if (!document.startViewTransition || reduce) {
    const root = document.documentElement;
    root.classList.add('theming');
    state.chosen = true;
    applyTheme(!state.light);
    setTimeout(() => root.classList.remove('theming'), 440);
    saveAll(); spin(); return;
  }
  /* Speichern erst im Rueckruf: der laeuft ein Bild spaeter, vorher steht der
     alte Modus noch. */
  const vt = document.startViewTransition(() => { state.chosen = true; applyTheme(!state.light); saveAll(); });
  vt.ready.then(() => {
    document.documentElement.animate(
      { clipPath: ['circle(0px at ' + x + 'px ' + y + 'px)', 'circle(' + rad + 'px at ' + x + 'px ' + y + 'px)'] },
      { duration: 620, easing: 'cubic-bezier(.3,.7,.2,1)', pseudoElement: '::view-transition-new(root)' }
    );
  }).catch(() => { });
  vt.finished.then(spin).catch(() => { });
}
$('btnTheme').onclick = switchTheme;

/* Start */
const saved = loadAll();
state.chosen = !!(saved && typeof saved.light === 'boolean');
applyTheme(state.chosen ? saved.light : systemLight(), true);
if (!state.chosen && window.matchMedia) {
  const mq = matchMedia('(prefers-color-scheme: light)');
  const onSys = e => { if (!state.chosen) applyTheme(e.matches); };
  mq.addEventListener ? mq.addEventListener('change', onSys) : mq.addListener(onSys);
}
if (saved && saved.diff >= 1 && saved.diff <= 10) state.diff = saved.diff;
renderModeMenu();
modeLabel();
selectTopic(TOPICS[0].id);
setView('train');
setLvlColor(state.diff);
