function intPrompt(inner, a, b) {
  if (a === undefined) return '<span class="big"><span class="intg">∫</span> ' + inner + ' d' + V() + '</span>';
  return '<span class="big"><span class="intg lim2"><span class="up">' + num(b) + '</span>∫<span class="lo">' + num(a) + '</span></span> ' + inner + ' d' + V() + '</span>';
}

function genInt(d, v) {
  if (v === 'bestimmt') {
    const n = d <= 4 ? 1 : (d <= 7 ? 2 : 3);
    const co = Array.from({ length: n + 1 }, () => rnz(-(d <= 5 ? 4 : 9), d <= 5 ? 4 : 9));
    const A = rnz(-4, 2), B = A + ri(1, d <= 5 ? 3 : 5);
    const Fco = co.map((c, i) => new F(c, n + 1 - i));
    const Fx = x => Fco.reduce((s, c, i) => s + c.v * Math.pow(x, n + 1 - i), 0);
    const res = Fx(B) - Fx(A);
    const FHTML = termsHTML(Fco.map((c, i) => ({ c: c, b: xpow(n + 1 - i) })));
    return {
      promptHTML: intPrompt(polyHTML(co), A, B),
      fields: [Fnum('=', 'Zahl oder Bruch')], check: checkNum(res, 1e-6), solHTML: valHTML(res),
      plot: { fns: [{ f: polyF(co) }], hlines: [{ y: 0 }], regions: [{ from: A, to: B }] },
      steps: [
        st('Stammfunktion', 'F(' + V() + ') = ' + FHTML),
        st('Grenzen einsetzen', 'F(' + num(B) + ') = ' + fmt(Fx(B)) + ', F(' + num(A) + ') = ' + fmt(Fx(A))),
        st('Hauptsatz', 'F(' + num(B) + ') − F(' + num(A) + ') = ' + fmt(Fx(B)) + ' − (' + fmt(Fx(A)) + ') = <b>' + valHTML(res) + '</b>')
      ]
    };
  }
  if (v === 'flaeche') {
    const r1 = rnz(-5, 3); const r2 = r1 + ri(1, d <= 5 ? 3 : 6);
    const a = d <= 5 ? -1 : (coin() ? -1 : -ri(1, 3));
    const co = [a, -a * (r1 + r2), a * r1 * r2];
    const area = Math.abs(a) * Math.pow(r2 - r1, 3) / 6;
    return {
      promptHTML: '<span class="big">f(' + V() + ') = ' + polyHTML(co) + '</span>',
      subPrompt: 'Berechne die Fläche zwischen dem Graphen und der x-Achse.',
      fields: [Fnum('A =', 'Flächeninhalt')], check: checkNum(area, 1e-5), solHTML: 'A = ' + valHTML(area),
      plot: { fns: [{ f: polyF(co) }], hlines: [{ y: 0 }], regions: [{ from: r1, to: r2 }], points: [{ x: r1, y: 0 }, { x: r2, y: 0 }] },
      steps: [
        st('Nullstellen', polyHTML(co) + ' = 0 → ' + V() + '<sub>1</sub> = ' + num(r1) + ', ' + V() + '<sub>2</sub> = ' + num(r2)),
        st('Integrationsgrenzen', 'Die Fläche liegt zwischen ' + num(r1) + ' und ' + num(r2) + '.'),
        st('Integrieren', 'A = |∫<sub>' + num(r1) + '</sub><sup>' + num(r2) + '</sup> f(x) dx|'),
        st('Ergebnis', 'A = <b>' + valHTML(area) + '</b>' + (Math.abs(a) === 1 ? '<br><span class="muted">Merkformel für Parabeln: A = ' + fracHTML('|a|·(x₂ − x₁)³', '6') + '</span>' : ''))
      ]
    };
  }
  if (v === 'subst') {
    const kind = pick(d <= 5 ? ['pot', 'exp'] : ['pot', 'exp', 'sin', 'bruch']);
    const a = rnz(-4, 4), b = rnz(-6, 6);
    if (kind === 'pot') {
      const n = ri(2, d <= 5 ? 3 : 5);
      const ref = x => Math.pow(a * x + b, n + 1) / (a * (n + 1));
      return {
        promptHTML: intPrompt('(' + polyHTML([a, b]) + ')<sup>' + n + '</sup>'),
        subPrompt: 'Gib eine Stammfunktion an (+C darf entfallen).',
        fields: [Fexpr('F(<i>x</i>) =', 'z. B. (2x+1)^4/8')], check: checkAnti(ref, 0.2, 1.9),
        solHTML: 'F(' + V() + ') = ' + fracHTML('(' + polyHTML([a, b]) + ')<sup>' + (n + 1) + '</sup>', num(a * (n + 1))) + ' + C',
        steps: [
          st('Innere Funktion', 'g(x) = ' + polyHTML([a, b]) + ', g′(x) = ' + num(a)),
          st('Potenzregel rückwärts', '∫u<sup>' + n + '</sup>du = ' + fracHTML('u<sup>' + (n + 1) + '</sup>', n + 1)),
          st('Korrekturfaktor', 'Wegen der inneren Ableitung noch mit ' + fracHTML('1', num(a)) + ' multiplizieren.'),
          st('Ergebnis', 'F(' + V() + ') = <b>' + fracHTML('(' + polyHTML([a, b]) + ')<sup>' + (n + 1) + '</sup>', num(a * (n + 1))) + '</b> + C')
        ]
      };
    }
    if (kind === 'exp') {
      const ref = x => Math.exp(a * x + b) / a;
      return {
        promptHTML: intPrompt('e<sup>' + polyHTML([a, b]) + '</sup>'),
        subPrompt: 'Gib eine Stammfunktion an.',
        fields: [Fexpr('F(<i>x</i>) =', 'z. B. e^(2x+1)/2')], check: checkAnti(ref, -0.9, 1.1),
        solHTML: 'F(' + V() + ') = ' + fracHTML('1', num(a)) + '·e<sup>' + polyHTML([a, b]) + '</sup> + C',
        steps: [st('Stammfunktion von e^u', '∫e<sup>u</sup>du = e<sup>u</sup>'),
        st('Korrekturfaktor', 'innere Ableitung ' + num(a) + ' → Faktor ' + fracHTML('1', num(a))),
        st('Ergebnis', 'F(' + V() + ') = <b>' + fracHTML('e<sup>' + polyHTML([a, b]) + '</sup>', num(a)) + '</b> + C')]
      };
    }
    if (kind === 'sin') {
      const ref = x => -Math.cos(a * x + b) / a;
      return {
        promptHTML: intPrompt('sin(' + polyHTML([a, b]) + ')'),
        subPrompt: 'Gib eine Stammfunktion an.',
        fields: [Fexpr('F(<i>x</i>) =')], check: checkAnti(ref, -1.4, 1.6),
        solHTML: 'F(' + V() + ') = ' + MINUS + fracHTML('cos(' + polyHTML([a, b]) + ')', num(a)) + ' + C',
        steps: [st('Grundintegral', '∫sin(u) du = −cos(u)'),
        st('Korrekturfaktor', fracHTML('1', num(a))),
        st('Ergebnis', 'F(' + V() + ') = <b>' + MINUS + fracHTML('cos(' + polyHTML([a, b]) + ')', num(a)) + '</b> + C')]
      };
    }
    const aa = Math.abs(a) || 2;
    const ref = x => Math.log(Math.abs(aa * x + b)) / aa;
    return {
      promptHTML: intPrompt(fracHTML('1', polyHTML([aa, b]))),
      subPrompt: 'Gib eine Stammfunktion an (für positive Nenner).',
      fields: [Fexpr('F(<i>x</i>) =', 'z. B. ln(2x+3)/2')], check: checkAnti(ref, Math.max(0.3, -b / aa + 0.6), -b / aa + 2.6),
      solHTML: 'F(' + V() + ') = ' + fracHTML('1', num(aa)) + '·ln|' + polyHTML([aa, b]) + '| + C',
      steps: [st('Grundintegral', '∫' + fracHTML('1', 'u') + ' du = ln|u|'),
      st('Korrekturfaktor', fracHTML('1', num(aa))),
      st('Ergebnis', 'F(' + V() + ') = <b>' + fracHTML('ln|' + polyHTML([aa, b]) + '|', num(aa)) + '</b> + C')]
    };
  }
  /* unbestimmt */
  const n = d <= 3 ? 2 : (d <= 6 ? 3 : 4);
  let ts = [];
  for (let e = n; e >= 0; e--) if (e === n || coin(0.7)) ts.push({ c: rnz(-(d <= 4 ? 5 : 12), d <= 4 ? 5 : 12), e: e });
  if (d >= 8 && coin()) ts.push({ c: rnz(-5, 5), e: -2 });
  const Fts = ts.map(t => ({ c: F.of(t.c).div(t.e + 1), e: t.e + 1 }));
  const ref = powF(Fts);
  const special = ts.some(t => t.e < 0);
  return {
    promptHTML: intPrompt(powTermsHTML(ts)),
    subPrompt: 'Gib eine Stammfunktion an (+C darf entfallen).',
    fields: [Fexpr('F(<i>x</i>) =', 'z. B. x^3 - 2x^2 + x')], check: checkAnti(ref, special ? 0.6 : 0.3, special ? 2.6 : 2.4),
    solHTML: 'F(' + V() + ') = ' + powTermsHTML(Fts) + ' + C',
    steps: [
      st('Regel', '∫x<sup>n</sup> dx = ' + fracHTML('x<sup>n+1</sup>', 'n+1') + ' — Exponent um 1 erhöhen, dann durch den neuen Exponenten teilen.'),
      st('Term für Term', ts.map(t => '∫' + coefHTML(t.c, xpow(t.e), true) + ' d' + V() + ' = ' + coefHTML(F.of(t.c).div(t.e + 1), xpow(t.e + 1), true)).join('<br>')),
      st('Ergebnis', 'F(' + V() + ') = <b>' + powTermsHTML(Fts) + '</b> + C'),
      st('Kontrolle', 'Ableiten von F muss wieder den Integranden ergeben.')
    ]
  };
}

/* ---------- Kombinierte Ableitungen: zwei Regeln in einer Aufgabe ---------- */
function ablKombi(d) {
  const pool = d <= 5 ? ['pk', 'kk', 'wp'] : (d <= 7 ? ['pk', 'kk', 'wp', 'pl', 'lk'] : ['pk', 'kk', 'wp', 'pl', 'lk', 'qk', 'qk2']);
  const kind = pick(pool);
  const a = rnz(-4, 4), b = rnz(-6, 6);

  if (kind === 'pk') {                      /* Produktregel mit Kettenregel */
    const n = ri(2, d <= 6 ? 3 : 4), k = d <= 5 ? 1 : rnz(-2, 2);
    const f = x => Math.pow(a * x + b, n) * Math.exp(k * x);
    const df = x => n * a * Math.pow(a * x + b, n - 1) * Math.exp(k * x) + k * Math.pow(a * x + b, n) * Math.exp(k * x);
    return {
      promptHTML: '<span class="big">f(' + V() + ') = (' + polyHTML([a, b]) + ')<sup>' + n + '</sup> · e<sup>' + (k === 1 ? V() : num(k) + V()) + '</sup></span>',
      subPrompt: 'Bestimme f′(x).',
      fields: [Fexpr('f′(<i>x</i>) =')], check: checkExpr(df, { lo: -1.3, hi: 1.3 }), _f: f,
      solHTML: 'f′(' + V() + ') = ' + pw('(' + polyHTML([a, b]) + ')', n - 1) + '·e<sup>' + num(k) + V() + '</sup>·(' + num(n * a) + addHTML(num(k) + '(' + polyHTML([a, b]) + ')') + ')',
      steps: [
        st('Aufteilen', 'u = ' + pw('(' + polyHTML([a, b]) + ')', n) + ', v = e<sup>' + num(k) + V() + '</sup>'),
        st('u ableiten (Kettenregel)', 'u′ = ' + n + '·' + pw('(' + polyHTML([a, b]) + ')', n - 1) + ' · ' + paren(a) + ' = ' + num(n * a) + '·' + pw('(' + polyHTML([a, b]) + ')', n - 1)),
        st('v ableiten (Kettenregel)', 'v′ = ' + num(k) + '·e<sup>' + num(k) + V() + '</sup>'),
        st('Produktregel', 'f′ = u′v + uv′ = ' + num(n * a) + pw('(' + polyHTML([a, b]) + ')', n - 1) + 'e<sup>' + num(k) + V() + '</sup>' + addHTML(num(k) + pw('(' + polyHTML([a, b]) + ')', n) + 'e<sup>' + num(k) + V() + '</sup>')),
        st('Ausklammern', '<b>' + pw('(' + polyHTML([a, b]) + ')', n - 1) + '·e<sup>' + num(k) + V() + '</sup>·(' + num(n * a) + addHTML(num(k) + '(' + polyHTML([a, b]) + ')') + ')</b>')
      ]
    };
  }

  if (kind === 'kk') {                      /* Kettenregel in Kettenregel */
    const k = ri(1, d <= 6 ? 2 : 3);
    const f = x => Math.exp(Math.sin(k * x));
    const df = x => k * Math.cos(k * x) * Math.exp(Math.sin(k * x));
    return {
      promptHTML: '<span class="big">f(' + V() + ') = e<sup>sin(' + (k === 1 ? V() : k + V()) + ')</sup></span>',
      subPrompt: 'Bestimme f′(x).',
      fields: [Fexpr('f′(<i>x</i>) =')], check: checkExpr(df, { lo: -2.4, hi: 2.4 }), _f: f,
      solHTML: 'f′(' + V() + ') = ' + (k === 1 ? '' : k + '·') + 'cos(' + (k === 1 ? V() : k + V()) + ')·e<sup>sin(' + (k === 1 ? V() : k + V()) + ')</sup>',
      steps: [
        st('Schalen erkennen', 'außen e<sup>u</sup>, in der Mitte sin(w), innen ' + (k === 1 ? V() : k + V())),
        st('Äußere Ableitung', '(e<sup>u</sup>)′ = e<sup>u</sup> → e<sup>sin(' + (k === 1 ? V() : k + V()) + ')</sup>'),
        st('Mittlere Ableitung', '(sin w)′ = cos w → cos(' + (k === 1 ? V() : k + V()) + ')'),
        st('Innere Ableitung', '(' + (k === 1 ? V() : k + V()) + ')′ = ' + k),
        st('Alles multiplizieren', '<b>' + (k === 1 ? '' : k + '·') + 'cos(' + (k === 1 ? V() : k + V()) + ')·e<sup>sin(' + (k === 1 ? V() : k + V()) + ')</sup></b>')
      ]
    };
  }

  if (kind === 'wp') {                      /* Wurzel (Kette) mal x (Produkt) */
    const aa = ri(1, d <= 6 ? 3 : 5), bb = ri(1, 9);
    const f = x => x * Math.sqrt(aa * x * x + bb);
    const df = x => Math.sqrt(aa * x * x + bb) + aa * x * x / Math.sqrt(aa * x * x + bb);
    const rad = polyHTML([aa, 0, bb]);
    return {
      promptHTML: '<span class="big">f(' + V() + ') = ' + V() + ' · ' + sqrtHTML(rad) + '</span>',
      subPrompt: 'Bestimme f′(x).',
      fields: [Fexpr('f′(<i>x</i>) =')], check: checkExpr(df, { lo: -2, hi: 2.4 }), _f: f,
      solHTML: 'f′(' + V() + ') = ' + sqrtHTML(rad) + ' + ' + fracHTML(num(aa) + V() + '²', sqrtHTML(rad)),
      steps: [
        st('Aufteilen', 'u = ' + V() + ', v = ' + sqrtHTML(rad)),
        st('v ableiten (Kettenregel)', 'v′ = ' + fracHTML(num(2 * aa) + V(), '2' + sqrtHTML(rad)) + ' = ' + fracHTML(num(aa) + V(), sqrtHTML(rad))),
        st('Produktregel', 'f′ = 1·' + sqrtHTML(rad) + ' + ' + V() + '·' + fracHTML(num(aa) + V(), sqrtHTML(rad))),
        st('Ergebnis', '<b>' + sqrtHTML(rad) + ' + ' + fracHTML(num(aa) + V() + '²', sqrtHTML(rad)) + '</b>')
      ]
    };
  }

  if (kind === 'pl') {                      /* Produktregel mit ln-Kette */
    const n = ri(1, 3), aa = ri(1, 4), bb = ri(1, 6);
    const f = x => Math.pow(x, n) * Math.log(aa * x + bb);
    const df = x => n * Math.pow(x, n - 1) * Math.log(aa * x + bb) + aa * Math.pow(x, n) / (aa * x + bb);
    return {
      promptHTML: '<span class="big">f(' + V() + ') = ' + pw(V(), n) + ' · ln(' + polyHTML([aa, bb]) + ')</span>',
      subPrompt: 'Bestimme f′(x).',
      fields: [Fexpr('f′(<i>x</i>) =')], check: checkExpr(df, { lo: 0.4, hi: 3 }), _f: f,
      solHTML: 'f′(' + V() + ') = ' + coefLn(n, n - 1, polyHTML([aa, bb])) + ' + ' + fracHTML(coefHTML(aa, xpow(n), true), polyHTML([aa, bb])),
      steps: [
        st('Aufteilen', 'u = ' + pw(V(), n) + ', v = ln(' + polyHTML([aa, bb]) + ')'),
        st('u ableiten', 'u′ = ' + coefHTML(n, xpow(n - 1), true)),
        st('v ableiten (Kettenregel)', 'v′ = ' + fracHTML(num(aa), polyHTML([aa, bb]))),
        st('Produktregel', 'f′ = <b>' + coefLn(n, n - 1, polyHTML([aa, bb])) + ' + ' + fracHTML(coefHTML(aa, xpow(n), true), polyHTML([aa, bb])) + '</b>')
      ]
    };
  }

  if (kind === 'lk') {                      /* ln einer zusammengesetzten Funktion */
    const k = ri(1, 3);
    const f = x => Math.log(Math.sin(k * x) + 2);
    const df = x => k * Math.cos(k * x) / (Math.sin(k * x) + 2);
    const inner = 'sin(' + (k === 1 ? V() : k + V()) + ') + 2';
    return {
      promptHTML: '<span class="big">f(' + V() + ') = ln(' + inner + ')</span>',
      subPrompt: 'Bestimme f′(x).',
      fields: [Fexpr('f′(<i>x</i>) =')], check: checkExpr(df, { lo: -2.4, hi: 2.4 }), _f: f,
      solHTML: 'f′(' + V() + ') = ' + fracHTML((k === 1 ? '' : k + '·') + 'cos(' + (k === 1 ? V() : k + V()) + ')', inner),
      steps: [
        st('Äußere Ableitung', '(ln u)′ = ' + fracHTML('1', 'u') + ' mit u = ' + inner),
        st('Innere Ableitung', '(' + inner + ')′ = ' + (k === 1 ? '' : k + '·') + 'cos(' + (k === 1 ? V() : k + V()) + ')'),
        st('Kettenregel', 'f′(' + V() + ') = <b>' + fracHTML((k === 1 ? '' : k + '·') + 'cos(' + (k === 1 ? V() : k + V()) + ')', inner) + '</b>')
      ]
    };
  }

  if (kind === 'qk') {                      /* Quotientenregel mit Kettenregel */
    const aa = rnz(-3, 3), bb = rnz(-5, 5), cc = rnz(-3, 3), dd = rnz(-6, 6);
    if (cc === 0) return ablKombi(d);
    const pole = -dd / cc;
    const f = x => Math.sin(aa * x + bb) / (cc * x + dd);
    const df = x => (aa * Math.cos(aa * x + bb) * (cc * x + dd) - cc * Math.sin(aa * x + bb)) / Math.pow(cc * x + dd, 2);
    const den = polyHTML([cc, dd]);
    return {
      promptHTML: '<span class="big">f(' + V() + ') = ' + fracHTML('sin(' + polyHTML([aa, bb]) + ')', den) + '</span>',
      subPrompt: 'Bestimme f′(x).',
      fields: [Fexpr('f′(<i>x</i>) =')], check: checkExpr(df, { lo: pole + 0.6, hi: pole + 2.8 }), _f: f,
      solHTML: 'f′(' + V() + ') = ' + fracHTML(num(aa) + '·cos(' + polyHTML([aa, bb]) + ')·(' + den + ') − ' + paren(cc) + '·sin(' + polyHTML([aa, bb]) + ')', '(' + den + ')²'),
      steps: [
        st('Aufteilen', 'u = sin(' + polyHTML([aa, bb]) + '), v = ' + den),
        st('u ableiten (Kettenregel)', 'u′ = ' + num(aa) + '·cos(' + polyHTML([aa, bb]) + ')'),
        st('v ableiten', 'v′ = ' + num(cc)),
        st('Quotientenregel', 'f′ = <b>' + fracHTML(num(aa) + 'cos(' + polyHTML([aa, bb]) + ')(' + den + ') − ' + paren(cc) + 'sin(' + polyHTML([aa, bb]) + ')', '(' + den + ')²') + '</b>')
      ]
    };
  }

  /* qk2: Quotient mit Potenz-Kette im Zähler */
  const n = ri(2, 3), aa = rnz(-6, 6), bb = rnz(-5, 5);
  const f = x => Math.pow(x * x + aa, n) / (x + bb);
  const df = x => (2 * n * x * Math.pow(x * x + aa, n - 1) * (x + bb) - Math.pow(x * x + aa, n)) / Math.pow(x + bb, 2);
  const base = '(' + polyHTML([1, 0, aa]) + ')';
  return {
    promptHTML: '<span class="big">f(' + V() + ') = ' + fracHTML(base + '<sup>' + n + '</sup>', polyHTML([1, bb])) + '</span>',
    subPrompt: 'Bestimme f′(x).',
    fields: [Fexpr('f′(<i>x</i>) =')], check: checkExpr(df, { lo: -bb + 0.7, hi: -bb + 2.6 }), _f: f,
    solHTML: 'f′(' + V() + ') = ' + fracHTML((2 * n) + V() + pw(base, n - 1) + '(' + polyHTML([1, bb]) + ') − ' + pw(base, n), '(' + polyHTML([1, bb]) + ')²'),
    steps: [
      st('Aufteilen', 'u = ' + pw(base, n) + ', v = ' + polyHTML([1, bb])),
      st('u ableiten (Kettenregel)', 'u′ = ' + n + '·' + pw(base, n - 1) + '·2' + V() + ' = ' + (2 * n) + V() + '·' + pw(base, n - 1)),
      st('v ableiten', 'v′ = 1'),
      st('Quotientenregel', 'f′ = <b>' + fracHTML((2 * n) + V() + pw(base, n - 1) + '(' + polyHTML([1, bb]) + ') − ' + pw(base, n), '(' + polyHTML([1, bb]) + ')²') + '</b>')
    ]
  };
}

</script>
<script>
/* ============================================================
   TEIL 5 — TERME VEREINFACHEN
   ============================================================ */

function checkExprs(refs, opts) {
  return tag(function (vals) {
    for (let i = 0; i < refs.length; i++) {
      const g = parseFn(vals[i]);
      if (!g || !fnEqual(g, refs[i], opts)) return false;
    }
    return true;
  }, 'exprs', { __refs: refs, __opts: opts });
}
/* Faktorisieren: Reihenfolge der beiden Felder egal */
function checkFactor(a, b, opts) {
  const na = x => -a(x), nb = x => -b(x);
  return tag(function (vals) {
    const g1 = parseFn(vals[0]), g2 = parseFn(vals[1]);
    if (!g1 || !g2) return false;
    const ok = (p, q) => fnEqual(g1, p, opts) && fnEqual(g2, q, opts);
    /* Reihenfolge egal, Vorzeichen darf umgedreht sein: 14·(−4x−5) = −14·(4x+5) */
    return ok(a, b) || ok(b, a) || ok(na, nb) || ok(nb, na);
  }, 'exprs', { __refs: [a, b], __opts: opts });
}

const POLY_DOM = { lo: -2.7, hi: 2.9 };
function mono(c, e, first) { return coefHTML(c, xpow(e), first); }

topic({
  id: 'vereinfachen', group: 'Grundlagen', name: 'Terme vereinfachen', icon: '≡',
  sub: 'Zusammenfassen, ausmultiplizieren, kürzen.',
  variants: [
    { id: 'zusammen', name: 'Zusammenfassen', desc: 'Gleiche Potenzen addieren.' },
    { id: 'klammern', name: 'Ausmultiplizieren', desc: 'Klammern auflösen, dann sortieren.' },
    { id: 'binom', name: 'Binomische Formeln', desc: '(a±b)² und (a+b)(a−b).' },
    { id: 'faktor', name: 'Ausklammern', desc: 'Größten gemeinsamen Faktor herausziehen.' },
    { id: 'kuerzen', name: 'Bruchterme kürzen', desc: 'Faktorisieren, dann kürzen.' },
    { id: 'potenzen', name: 'Potenzterme', desc: 'Potenzgesetze anwenden.' },
    { id: 'expwurzel', name: 'e-Funktion, Wurzel & ln', desc: 'Potenzgesetze für e, Wurzeln und Logarithmen.' },
  ],
  formulas: [
    st('Zusammenfassen', 'Nur Terme mit <i>gleicher</i> Potenz dürfen addiert werden: 3x² + 5x² = 8x², aber 3x² + 5x bleibt stehen.'),
    st('Distributivgesetz', 'a·(b + c) = a·b + a·c &nbsp;·&nbsp; (a+b)(c+d) = ac + ad + bc + bd'),
    st('Binomische Formeln', '(a+b)² = a² + 2ab + b² &nbsp;·&nbsp; (a−b)² = a² − 2ab + b² &nbsp;·&nbsp; (a+b)(a−b) = a² − b²'),
    st('Ausklammern', 'Größter gemeinsamer Faktor aller Summanden — Zahl <i>und</i> kleinste x-Potenz.'),
    st('Kürzen', 'Nur <b>Faktoren</b> kürzen, niemals einzelne Summanden: ' + fracHTML('x(x+2)', 'x') + ' = x + 2'),
    st('e-Funktion & Wurzeln', 'e<sup>a</sup>·e<sup>b</sup> = e<sup>a+b</sup> &nbsp;·&nbsp; (e<sup>a</sup>)<sup>n</sup> = e<sup>a·n</sup> &nbsp;·&nbsp; '
      + sqrtHTML('a') + '·' + sqrtHTML('b') + ' = ' + sqrtHTML('a·b') + ' &nbsp;·&nbsp; ln(u) ± ln(v) = ln(u·v) bzw. ln(u/v)'),
    st('Potenzgesetze', 'x<sup>m</sup>·x<sup>n</sup> = x<sup>m+n</sup> &nbsp;·&nbsp; ' + fracHTML('x<sup>m</sup>', 'x<sup>n</sup>') + ' = x<sup>m−n</sup> &nbsp;·&nbsp; (x<sup>m</sup>)<sup>n</sup> = x<sup>m·n</sup>'),
  ],
  gen: function (d, v) { return genVer(d, v); },
  /* Je höher die Stufe, desto häufiger Wurzeln, ln und e-Funktionen. */
  pickVar: function (d, real) {
    const share = d <= 3 ? 0 : (d - 3) * 0.115;          /* Stufe 10 → ~80 % */
    if (Math.random() < share) return 'expwurzel';
    const rest = real.filter(x => x !== 'expwurzel');
    return pickByDifficulty(rest, d);
  }
});

function genVer(d, v) {
  if (v === 'klammern') return verKlammern(d);
  if (v === 'binom') return verBinom(d);
  if (v === 'faktor') return verFaktor(d);
  if (v === 'kuerzen') return verKuerzen(d);
  if (v === 'potenzen') return verPotenzen(d);
  if (v === 'expwurzel') return verExpWurzel(d);
  return verZusammen(d);
}

/* ---------- Zusammenfassen ---------- */
function verZusammen(d) {
  const maxDeg = d <= 2 ? 1 : 2;
  const nT = d <= 2 ? 3 : (d <= 5 ? 4 : (d <= 8 ? 5 : 6));
  const R = d <= 2 ? 5 : (d <= 4 ? 9 : (d <= 6 ? 13 : (d <= 8 ? 18 : 26)));
  const ts = [];
  for (let i = 0; i < nT; i++) ts.push({ c: rnz(-R, R), e: ri(0, maxDeg) });
  /* mindestens zwei gleiche Potenzen, sonst gibt es nichts zu tun */
  ts[1].e = ts[0].e;
  const mix = shuffle(ts);
  const sum = {};
  mix.forEach(t => { sum[t.e] = (sum[t.e] || 0) + t.c; });
  const res = Object.keys(sum).map(Number).sort((a, b) => b - a).map(e => ({ c: sum[e], e: e })).filter(t => t.c !== 0);
  if (!res.length) return verZusammen(d);
  const ref = powF(res);
  let disp = '', first = true;
  mix.forEach(t => { disp += mono(t.c, t.e, first); first = false; });
  const groups = Object.keys(sum).map(Number).sort((a, b) => b - a).map(e =>
    mix.filter(t => t.e === e).map(t => mono(t.c, t.e, true)).join(', ') + ' → ' + mono(sum[e], e, true));
  return {
    promptHTML: '<span class="big">' + disp + '</span>',
    subPrompt: 'Fasse so weit wie möglich zusammen.',
    fields: [Fexpr('=', 'z. B. 4x^2 - 3x + 5')], check: checkExpr(ref, POLY_DOM),
    solHTML: powTermsHTML(res),
    steps: [
      st('Gleiche Potenzen suchen', 'Nur Terme mit derselben x-Potenz lassen sich zusammenfassen.'),
      st('Sortieren', groups.join('<br>')),
      st('Ergebnis', '<b>' + powTermsHTML(res) + '</b>')
    ]
  };
}

/* ---------- Ausmultiplizieren ---------- */
function verKlammern(d) {
  const kind = d <= 4 ? 'einfach' : (d <= 6 ? pick(['einfach', 'zwei']) : (d <= 8 ? pick(['zwei', 'produkt']) : pick(['produkt', 'gross'])));
  if (kind === 'einfach') {
    const a = rnz(-6, 6), b = rnz(-6, 6), c = rnz(-9, 9), e = rnz(-9, 9);
    const res = [a * b, a * c + e];
    return {
      promptHTML: '<span class="big">' + num(a) + '·(' + polyHTML([b, c]) + ')' + coefHTML(e, '', false) + '</span>',
      subPrompt: 'Vereinfache so weit wie möglich.',
      fields: [Fexpr('=')], check: checkExpr(polyF(res), POLY_DOM), solHTML: polyHTML(res),
      steps: [
        st('Distributivgesetz', num(a) + '·' + paren(polyHTML([b, 0])) + addHTML(num(a) + '·' + paren(c)) + ' = ' + polyHTML([a * b, a * c])),
        st('Zusammenfassen', 'Konstanten addieren: ' + num(a * c) + coefHTML(e, '', false) + ' = ' + num(a * c + e)),
        st('Ergebnis', '<b>' + polyHTML(res) + '</b>')
      ]
    };
  }
  if (kind === 'zwei') {
    const a = rnz(-7, 7), b = rnz(-6, 6), c = rnz(-9, 9);
    const p = rnz(-7, 7), q = rnz(-6, 6), r = rnz(-9, 9);
    const res = [a * b + p * q, a * c + p * r];
    if (res[0] === 0 && res[1] === 0) return verKlammern(d);
    return {
      promptHTML: '<span class="big">' + num(a) + '·(' + polyHTML([b, c]) + ')' + (p < 0 ? ' <span class="op">−</span> ' + (-p) : ' <span class="op">+</span> ' + p) + '·(' + polyHTML([q, r]) + ')</span>',
      subPrompt: 'Vereinfache so weit wie möglich.',
      fields: [Fexpr('=')], check: checkExpr(polyF(res), POLY_DOM), solHTML: polyHTML(res),
      steps: [
        st('Erste Klammer', num(a) + '·(' + polyHTML([b, c]) + ') = ' + polyHTML([a * b, a * c])),
        st('Zweite Klammer', num(p) + '·(' + polyHTML([q, r]) + ') = ' + polyHTML([p * q, p * r]) + ' — auf das Vorzeichen achten!'),
        st('Zusammenfassen', polyHTML([a * b, a * c]) + coefHTML(p * q, V(), false) + coefHTML(p * r, '', false)),
        st('Ergebnis', '<b>' + polyHTML(res) + '</b>')
      ]
    };
  }
  if (kind === 'produkt') {
    const a = rnz(-6, 6), b = rnz(-9, 9), c = rnz(-6, 6), e = rnz(-9, 9);
    const res = [a * c, a * e + b * c, b * e];
    return {
      promptHTML: '<span class="big">(' + polyHTML([a, b]) + ')·(' + polyHTML([c, e]) + ')</span>',
      subPrompt: 'Vereinfache so weit wie möglich.',
      fields: [Fexpr('=')], check: checkExpr(polyF(res), POLY_DOM), solHTML: polyHTML(res),
      steps: [
        st('Jeder mit jedem', num(a) + V() + '·' + paren(num(c) + V()) + addHTML(num(a) + V() + '·' + paren(e)) + addHTML(paren(b) + '·' + paren(num(c) + V())) + addHTML(paren(b) + '·' + paren(e))),
        st('Einzeln ausrechnen', polyHTML([a * c, 0, 0]) + coefHTML(a * e, V(), false) + coefHTML(b * c, V(), false) + coefHTML(b * e, '', false)),
        st('Mittlere Terme addieren', num(a * e) + coefHTML(b * c, '', false) + ' = ' + num(a * e + b * c)),
        st('Ergebnis', '<b>' + polyHTML(res) + '</b>')
      ]
    };
  }
  const a = rnz(-4, 4), b = rnz(-7, 7), c = rnz(-4, 4), e = rnz(-7, 7), f = rnz(-9, 9);
  const res = [a * c, a * e + b * c, a * f + b * e, b * f];
  return {
    promptHTML: '<span class="big">(' + polyHTML([a, b]) + ')·(' + polyHTML([c, e, f]) + ')</span>',
    subPrompt: 'Vereinfache so weit wie möglich.',
    fields: [Fexpr('=')], check: checkExpr(polyF(res), POLY_DOM), solHTML: polyHTML(res),
    steps: [
      st('Erster Summand mal Klammer', num(a) + V() + '·(' + polyHTML([c, e, f]) + ') = ' + polyHTML([a * c, a * e, a * f, 0])),
      st('Zweiter Summand mal Klammer', num(b) + '·(' + polyHTML([c, e, f]) + ') = ' + polyHTML([b * c, b * e, b * f])),
      st('Addieren & ordnen', '<b>' + polyHTML(res) + '</b>')
    ]
  };
}

/* ---------- Binomische Formeln ---------- */
function verBinom(d) {
  const a = d <= 3 ? 1 : (d <= 5 ? ri(1, 3) : ri(2, d <= 7 ? 5 : 11));
  const b = ri(1, d <= 3 ? 6 : (d <= 5 ? 9 : (d <= 7 ? 14 : 24)));
  const kind = d >= 8 && coin(0.35) ? 'diff' : pick(['plus', 'minus', 'dritte']);
  if (kind === 'dritte') {
    const res = [a * a, 0, -b * b];
    return {
      promptHTML: '<span class="big">(' + polyHTML([a, b]) + ')·(' + polyHTML([a, -b]) + ')</span>',
      subPrompt: 'Vereinfache so weit wie möglich.',
      fields: [Fexpr('=')], check: checkExpr(polyF(res), POLY_DOM), solHTML: polyHTML(res),
      steps: [
        st('3. binomische Formel', '(a+b)(a−b) = a² − b²'),
        st('Zuordnen', 'a = ' + mono(a, 1, true) + ', b = ' + b),
        st('Einsetzen', '(' + mono(a, 1, true) + ')² − ' + b + '² = ' + polyHTML(res)),
        st('Ergebnis', '<b>' + polyHTML(res) + '</b>')
      ]
    };
  }
  if (kind === 'diff') {
    const res = [0, 4 * a * b, 0];
    return {
      promptHTML: '<span class="big">(' + polyHTML([a, b]) + ')<sup>2</sup> <span class="op">−</span> (' + polyHTML([a, -b]) + ')<sup>2</sup></span>',
      subPrompt: 'Vereinfache so weit wie möglich.',
      fields: [Fexpr('=')], check: checkExpr(polyF(res), POLY_DOM), solHTML: polyHTML([4 * a * b, 0]),
      steps: [
        st('Erstes Quadrat', polyHTML([a * a, 2 * a * b, b * b])),
        st('Zweites Quadrat', polyHTML([a * a, -2 * a * b, b * b])),
        st('Subtrahieren', 'x²- und Konstantterme heben sich auf, übrig bleibt 2·' + (2 * a * b) + '/2 ·x'),
        st('Ergebnis', '<b>' + polyHTML([4 * a * b, 0]) + '</b>')
      ]
    };
  }
  const s = kind === 'plus' ? 1 : -1;
  const res = [a * a, 2 * a * b * s, b * b];
  return {
    promptHTML: '<span class="big">(' + polyHTML([a, s * b]) + ')<sup>2</sup></span>',
    subPrompt: 'Vereinfache so weit wie möglich.',
    fields: [Fexpr('=')], check: checkExpr(polyF(res), POLY_DOM), solHTML: polyHTML(res),
    steps: [
      st('Formel', kind === 'plus' ? '(a+b)² = a² + 2ab + b²' : '(a−b)² = a² − 2ab + b²'),
      st('Zuordnen', 'a = ' + mono(a, 1, true) + ', b = ' + b),
      st('Einsetzen', 'a² = ' + mono(a * a, 2, true) + ', 2ab = ' + mono(2 * a * b, 1, true) + ', b² = ' + (b * b)),
      st('Ergebnis', '<b>' + polyHTML(res) + '</b>')
    ]
  };
}

/* ---------- Ausklammern ---------- */
function verFaktor(d) {
  const m = d <= 3 ? 0 : (d <= 6 ? ri(0, 1) : ri(0, 2));
  const c = d <= 3 ? ri(2, 6) : (d <= 6 ? ri(2, 9) : ri(2, 15));
  const deg = d <= 5 ? 1 : ri(1, 2);
  let co = [];
  for (let i = 0; i <= deg; i++) co.push(rnz(-9, 9));
  /* Klammer teilerfremd machen */
  let g = 0; co.forEach(x => g = gcd(g, x));
  co = co.map(x => x / g);
  if (co[co.length - 1] === 0) co[co.length - 1] = rnz(-9, 9) / 1;
  let g2 = 0; co.forEach(x => g2 = gcd(g2, x));
  if (g2 !== 1) return verFaktor(d);
  if (c === 1 && m === 0) return verFaktor(d);

  const prod = co.map((x, i) => ({ c: c * x, e: deg - i + m }));
  const facHTML = mono(c, m, true);
  const brHTML = polyHTML(co);
  const fFac = powF([{ c: c, e: m }]);
  const fBr = polyF(co);
  const dom = m > 0 ? { lo: 0.7, hi: 2.9 } : POLY_DOM;
  return {
    promptHTML: '<span class="big">' + powTermsHTML(prod) + '</span>',
    subPrompt: 'Klammere den größten gemeinsamen Faktor aus.',
    fields: [
      { type: 'expr', label: 'Faktor', ph: 'z. B. 3x' },
      { type: 'expr', label: '· ( … )', ph: 'z. B. 2x - 5' }
    ],
    check: checkFactor(fFac, fBr, dom),
    solHTML: facHTML + '·(' + brHTML + ')',
    steps: [
      st('Zahlen prüfen', 'Größter gemeinsamer Teiler der Koeffizienten: <b>' + c + '</b>'),
      st('x-Potenzen prüfen', m === 0 ? 'Nicht jeder Summand enthält x → keine x-Potenz ausklammerbar.' : 'Kleinste vorkommende Potenz: <b>' + xpow(m) + '</b>'),
      st('Herausziehen', powTermsHTML(prod) + ' = ' + facHTML + '·(' + brHTML + ')'),
      st('Probe', 'Wieder ausmultiplizieren muss den Ausgangsterm ergeben.')
    ]
  };
}

/* ---------- Bruchterme kürzen ---------- */
function verKuerzenExp(d) {
  /* (e^(2ax) + k·e^(ax)) / e^(ax) = e^(ax) + k */
  const a = rnz(-3, 3), k = rnz(-(d <= 8 ? 6 : 12), d <= 8 ? 6 : 12);
  const ex = t => 'e<sup>' + coefHTML(t, V(), true) + '</sup>';
  const ref = x => Math.exp(a * x) + k;
  return {
    promptHTML: '<span class="big">' + fracHTML(ex(2 * a) + (k < 0 ? ' <span class="op">−</span> ' : ' <span class="op">+</span> ') + num(Math.abs(k)) + '·' + ex(a), ex(a)) + '</span>',
    fields: [Fexpr('=', 'z. B. e^{2x}-3')], check: checkExpr(ref, { lo: -1.2, hi: 1.2 }),
    solHTML: ex(a) + (k < 0 ? ' − ' : ' + ') + num(Math.abs(k)),
    steps: [
      st('Zähler faktorisieren', ex(2 * a) + (k < 0 ? ' − ' : ' + ') + num(Math.abs(k)) + '·' + ex(a) + ' = ' + ex(a) + '·(' + ex(a) + (k < 0 ? ' − ' : ' + ') + num(Math.abs(k)) + ')'),
      st('Kürzen', 'Der Faktor ' + ex(a) + ' steht in Zähler und Nenner — und ist nie 0.'),
      st('Ergebnis', '<b>' + ex(a) + (k < 0 ? ' − ' : ' + ') + num(Math.abs(k)) + '</b>')
    ]
  };
}

function verKuerzen(d) {
  if (d >= 6 && Math.random() < (d - 5) * 0.14) return verKuerzenExp(d);
  const kind = d <= 3 ? 'mono' : (d <= 5 ? pick(['mono', 'binom']) : (d <= 8 ? pick(['mono', 'binom', 'quad']) : pick(['binom', 'quad', 'produkt'])));
  if (kind === 'mono') {
    const k = ri(2, d <= 5 ? 6 : 12), m = ri(1, 2);
    const deg = ri(1, 2);
    const co = []; for (let i = 0; i <= deg; i++) co.push(rnz(-8, 8));
    const prod = co.map((x, i) => ({ c: k * x, e: deg - i + m }));
    const ref = polyF(co);
    return {
      promptHTML: '<span class="big">' + fracHTML(powTermsHTML(prod), mono(k, m, true)) + '</span>',
      subPrompt: 'Kürze so weit wie möglich.',
      fields: [Fexpr('=')], check: checkExpr(ref, POLY_DOM), solHTML: polyHTML(co),
      steps: [
        st('Zähler faktorisieren', powTermsHTML(prod) + ' = ' + mono(k, m, true) + '·(' + polyHTML(co) + ')'),
        st('Kürzen', 'Der Faktor ' + mono(k, m, true) + ' steht in Zähler und Nenner.'),
        st('Ergebnis', '<b>' + polyHTML(co) + '</b> &nbsp;<span class="muted">(für x ≠ 0)</span>')
      ]
    };
  }
  if (kind === 'binom') {
    const a = rnz(-8, 8);
    const plus = coin();
    const ref = x => x + (plus ? a : -a);
    const den = plus ? [1, -a] : [1, a];
    const pole = plus ? a : -a;
    return {
      promptHTML: '<span class="big">' + fracHTML(polyHTML([1, 0, -a * a]), polyHTML(den)) + '</span>',
      subPrompt: 'Kürze so weit wie möglich.',
      fields: [Fexpr('=')], check: checkExpr(ref, { lo: pole + 0.8, hi: pole + 3.4 }),
      solHTML: polyHTML(plus ? [1, a] : [1, -a]),
      steps: [
        st('3. binomische Formel', polyHTML([1, 0, -a * a]) + ' = (' + V() + ' + ' + paren(a) + ')(' + V() + ' − ' + paren(a) + ')'),
        st('Kürzen', 'Der Faktor ' + polyHTML(den) + ' fällt weg.'),
        st('Ergebnis', '<b>' + polyHTML(plus ? [1, a] : [1, -a]) + '</b> &nbsp;<span class="muted">(für x ≠ ' + num(pole) + ')</span>')
      ]
    };
  }
  if (kind === 'quad') {
    const r = rnz(-7, 7); let s = rnz(-7, 7); while (s === r) s = rnz(-7, 7);
    const co = [1, -(r + s), r * s];
    const ref = x => x - s;
    return {
      promptHTML: '<span class="big">' + fracHTML(polyHTML(co), polyHTML([1, -r])) + '</span>',
      subPrompt: 'Kürze so weit wie möglich.',
      fields: [Fexpr('=')], check: checkExpr(ref, { lo: r + 0.8, hi: r + 3.4 }),
      solHTML: polyHTML([1, -s]),
      steps: [
        st('Nullstellen des Zählers', 'Satz von Vieta: Summe ' + num(r + s) + ', Produkt ' + num(r * s) + ' → ' + num(r) + ' und ' + num(s)),
        st('Faktorisieren', polyHTML(co) + ' = (' + polyHTML([1, -r]) + ')(' + polyHTML([1, -s]) + ')'),
        st('Kürzen', 'Der Faktor ' + polyHTML([1, -r]) + ' steht oben und unten.'),
        st('Ergebnis', '<b>' + polyHTML([1, -s]) + '</b> &nbsp;<span class="muted">(für x ≠ ' + num(r) + ')</span>')
      ]
    };
  }
  const a = rnz(-5, 5), b = rnz(-9, 9), c = rnz(-5, 5), e = rnz(-9, 9);
  if (a === 0 || c === 0) return verKuerzen(d);
  const pole = -e / c;
  const ref = x => a * x + b;
  return {
    promptHTML: '<span class="big">' + fracHTML('(' + polyHTML([a, b]) + ')(' + polyHTML([c, e]) + ')', polyHTML([c, e])) + '</span>',
    subPrompt: 'Kürze so weit wie möglich.',
    fields: [Fexpr('=')], check: checkExpr(ref, { lo: pole + 0.8, hi: pole + 3.4 }),
    solHTML: polyHTML([a, b]),
    steps: [
      st('Gemeinsamen Faktor sehen', '(' + polyHTML([c, e]) + ') steht in Zähler und Nenner.'),
      st('Kürzen', 'Faktoren dürfen gekürzt werden — Summanden nicht!'),
      st('Ergebnis', '<b>' + polyHTML([a, b]) + '</b> &nbsp;<span class="muted">(für x ≠ ' + valHTML(pole) + ')</span>')
    ]
  };
}

/* ---------- Potenzterme ---------- */
function verPotenzWurzel(d) {
  /* (a x^m)^p · sqrt(b^2 x^(2n)) / (c x^q) */
  const a = ri(2, 3), p = 2, m = ri(1, 2), b = ri(2, d <= 8 ? 5 : 9), n = ri(1, 2);
  const N = Math.pow(a, p) * b;
  const divs = []; for (let i = 1; i <= N; i++) if (N % i === 0) divs.push(i);
  const c = pick(divs), k = N / c;
  const q = ri(0, d <= 8 ? 2 : 4), E = m * p + n - q;
  if (E < -2 || E > 7 || (E === 0 && k === 1)) return verPotenzWurzel(d);
  const numHTML = '(' + mono(a, m, true) + ')<sup>' + p + '</sup> · ' + sqrtHTML(mono(b * b, 2 * n, true));
  const ref = x => k * Math.pow(x, E);
  return {
    promptHTML: '<span class="big">' + (c === 1 && q === 0 ? numHTML : fracHTML(numHTML, mono(c, q, true))) + '</span>',
    fields: [Fexpr('=', 'z. B. 4x^3')], check: checkExpr(ref, { lo: 0.6, hi: 2.6 }),
    solHTML: mono(k, E, true),
    steps: [
      st('Wurzel ziehen', sqrtHTML(mono(b * b, 2 * n, true)) + ' = ' + mono(b, n, true) + ' &nbsp;<span class="muted">(x &gt; 0)</span>'),
      st('Klammer potenzieren', '(' + mono(a, m, true) + ')<sup>' + p + '</sup> = ' + mono(Math.pow(a, p), m * p, true)),
      st('Zähler zusammenfassen', mono(N, m * p + n, true) + ' &nbsp;<span class="muted">Exponenten addieren</span>'),
      st('Durch den Nenner teilen', 'Zahlen: ' + N + ' : ' + c + ' = ' + k + ', Exponenten: ' + (m * p + n) + ' − ' + q + ' = ' + E),
      st('Ergebnis', '<b>' + mono(k, E, true) + '</b>')
    ]
  };
}

function verPotenzen(d) {
  if (d >= 6 && Math.random() < (d - 5) * 0.15) return verPotenzWurzel(d);
  for (let tries = 0; tries < 40; tries++) {
    const a = ri(2, d <= 5 ? 3 : 4), p = d <= 4 ? 2 : ri(2, 3);
    const m = ri(1, d <= 5 ? 2 : 3), n = ri(0, 3), q = ri(0, d <= 5 ? 2 : 4);
    const b = ri(1, 6);
    const N = Math.pow(a, p) * b;
    const divs = []; for (let i = 1; i <= N; i++) if (N % i === 0) divs.push(i);
    const c = pick(divs);
    const k = N / c, E = m * p + n - q;
    if (E < -2 || E > 7) continue;
    if (E === 0 && k === 1) continue;
    if (k > 400) continue;
    const numHTML = '(' + mono(a, m, true) + ')<sup>' + p + '</sup>' + (b === 1 && n === 0 ? '' : ' · ' + mono(b, n, true));
    const denHTML = mono(c, q, true);
    const ref = x => k * Math.pow(x, E);
    return {
      promptHTML: '<span class="big">' + (c === 1 && q === 0 ? numHTML : fracHTML(numHTML, denHTML)) + '</span>',
      subPrompt: 'Vereinfache so weit wie möglich (x &gt; 0).',
      fields: [Fexpr('=', 'z. B. 4x^3 oder 2/x^2')], check: checkExpr(ref, { lo: 0.6, hi: 2.6 }),
      solHTML: mono(k, E, true),
      steps: [
        st('Potenz der Klammer', '(' + mono(a, m, true) + ')<sup>' + p + '</sup> = ' + mono(Math.pow(a, p), m * p, true) + ' &nbsp;<span class="muted">(x<sup>m</sup>)<sup>n</sup> = x<sup>m·n</sup></span>'),
        st('Zähler zusammenfassen', mono(Math.pow(a, p) * b, m * p + n, true) + ' &nbsp;<span class="muted">Exponenten addieren</span>'),
        st('Durch den Nenner teilen', 'Zahlen: ' + N + ' : ' + c + ' = ' + k + ', Exponenten: ' + (m * p + n) + ' − ' + q + ' = ' + E),
        st('Ergebnis', '<b>' + mono(k, E, true) + '</b>')
      ]
    };
  }
  return verZusammen(d);
}


/* ---------- e-Funktion, Wurzeln & Logarithmen ---------- */
function verExpWurzel(d) {
  const pool = d <= 2 ? ['emul', 'wurzelpot']
    : d <= 4 ? ['emul', 'emul', 'ediv', 'wurzelpot', 'wurzelmul']
      : d <= 6 ? ['emul', 'ediv', 'ediv2', 'wurzelpot', 'wurzelmul', 'lnsumme', 'wurzele']
        : d <= 8 ? ['ediv', 'ediv2', 'wurzelmul', 'lnsumme', 'wurzele', 'lnexp', 'wurzelbruch', 'emixw']
          : ['ediv2', 'lnsumme', 'wurzele', 'lnexp', 'lnexp', 'wurzelbruch', 'emixw', 'emixw'];
  const kind = pick(pool);
  const EDOM = { lo: -1.2, hi: 1.2 }, XDOM = { lo: 0.4, hi: 3 };

  if (kind === 'emul') {
    const k = d <= 3 ? 1 : rnz(-6, 6);
    const a = rnz(-(d <= 5 ? 3 : 6), d <= 5 ? 3 : 6), b = rnz(-(d <= 5 ? 3 : 6), d <= 5 ? 3 : 6);
    const E = a + b;
    const ref = x => k * Math.exp(E * x);
    const ex = c => 'e<sup>' + coefHTML(c, V(), true) + '</sup>';
    return {
      promptHTML: '<span class="big">' + (k === 1 ? '' : (k === -1 ? MINUS : num(k) + '·')) + ex(a) + ' · ' + ex(b) + '</span>',
      subPrompt: 'Vereinfache so weit wie möglich.',
      fields: [Fexpr('=', 'z. B. 3e^{2x}')], check: checkExpr(ref, EDOM),
      solHTML: (k === 1 ? '' : (k === -1 ? MINUS : num(k) + '·')) + (E === 0 ? '1' : ex(E)) + (E === 0 && k !== 1 ? '' : ''),
      steps: [
        st('Potenzgesetz', 'e<sup>a</sup> · e<sup>b</sup> = e<sup>a+b</sup> — Exponenten addieren.'),
        st('Exponenten addieren', coefHTML(a, V(), true) + coefHTML(b, V(), false) + ' = ' + coefHTML(E, V(), true)),
        st('Ergebnis', '<b>' + (k === 1 ? '' : num(k) + '·') + (E === 0 ? '1' : ex(E)) + '</b>'
          + (E === 0 ? ' &nbsp;<span class="muted">e<sup>0</sup> = 1</span>' : ''))
      ]
    };
  }

  if (kind === 'ediv' || kind === 'ediv2') {
    const a = rnz(-4, 4), n = ri(2, d <= 6 ? 3 : 4), b = rnz(-5, 5);
    const E = a * n - b;
    const ref = x => Math.exp(E * x);
    const ex = c => 'e<sup>' + coefHTML(c, V(), true) + '</sup>';
    return {
      promptHTML: '<span class="big">' + fracHTML('(' + ex(a) + ')<sup>' + n + '</sup>', ex(b)) + '</span>',
      subPrompt: 'Vereinfache so weit wie möglich.',
      fields: [Fexpr('=', 'z. B. e^{3x}')], check: checkExpr(ref, EDOM),
      solHTML: E === 0 ? '1' : ex(E),
      steps: [
        st('Klammer potenzieren', '(e<sup>' + coefHTML(a, V(), true) + '</sup>)<sup>' + n + '</sup> = ' + ex(a * n) + ' — Exponenten multiplizieren.'),
        st('Dividieren', fracHTML(ex(a * n), ex(b)) + ' = ' + (E === 0 ? 'e<sup>0</sup>' : ex(E)) + ' — Exponenten subtrahieren.'),
        st('Ergebnis', '<b>' + (E === 0 ? '1' : ex(E)) + '</b>')
      ]
    };
  }

  if (kind === 'wurzelpot') {
    const a = ri(2, d <= 5 ? 6 : 12), m = ri(1, d <= 5 ? 2 : 3);
    const ref = x => a * Math.pow(x, m);
    return {
      promptHTML: '<span class="big">' + sqrtHTML(mono(a * a, 2 * m, true)) + '</span>',
      subPrompt: 'Vereinfache so weit wie möglich (x &gt; 0).',
      fields: [Fexpr('=', 'z. B. 3x^2')], check: checkExpr(ref, XDOM),
      solHTML: mono(a, m, true),
      steps: [
        st('Faktoren trennen', sqrtHTML(mono(a * a, 2 * m, true)) + ' = ' + sqrtHTML(a * a) + ' · ' + sqrtHTML(xpow(2 * m))),
        st('Wurzeln ziehen', sqrtHTML(a * a) + ' = ' + a + ' und ' + sqrtHTML(xpow(2 * m)) + ' = ' + xpow(m) + ' (für x &gt; 0)'),
        st('Ergebnis', '<b>' + mono(a, m, true) + '</b>')
      ]
    };
  }

  if (kind === 'wurzelmul') {
    const c = ri(2, d <= 6 ? 6 : 12), sq = c * c;
    const divs = []; for (let i = 2; i < sq; i++) if (sq % i === 0) divs.push(i);
    if (!divs.length) return verExpWurzel(Math.max(1, d - 1));
    const a = pick(divs), b = sq / a;
    const ref = x => c * x;
    return {
      promptHTML: '<span class="big">' + sqrtHTML(mono(a, 1, true)) + ' · ' + sqrtHTML(mono(b, 1, true)) + '</span>',
      subPrompt: 'Vereinfache so weit wie möglich (x &gt; 0).',
      fields: [Fexpr('=', 'z. B. 4x')], check: checkExpr(ref, XDOM),
      solHTML: mono(c, 1, true),
      steps: [
        st('Wurzeln zusammenfassen', sqrtHTML('u') + '·' + sqrtHTML('v') + ' = ' + sqrtHTML('u·v')),
        st('Radikanden multiplizieren', sqrtHTML(a + ' · ' + b + ' · ' + xpow(2)) + ' = ' + sqrtHTML(sq + xpow(2))),
        st('Wurzel ziehen', '<b>' + mono(c, 1, true) + '</b> &nbsp;<span class="muted">(x &gt; 0)</span>')
      ]
    };
  }

  if (kind === 'wurzele') {
    /* sqrt(a^2 * e^(2kx)) = a * e^(kx) */
    const a = ri(2, d <= 7 ? 5 : 9), k = rnz(-4, 4);
    const ex = c => 'e<sup>' + coefHTML(c, V(), true) + '</sup>';
    const ref = x => a * Math.exp(k * x);
    return {
      promptHTML: '<span class="big">' + sqrtHTML(num(a * a) + '·e<sup>' + coefHTML(2 * k, V(), true) + '</sup>') + '</span>',
      fields: [Fexpr('=', 'z. B. 3e^{2x}')], check: checkExpr(ref, EDOM),
      solHTML: num(a) + '·' + ex(k),
      steps: [
        st('Wurzel als Potenz', sqrtHTML('u') + ' = u<sup>1/2</sup> — der Exponent wird halbiert.'),
        st('Faktoren einzeln', sqrtHTML(a * a) + ' = ' + a + ' und ' + sqrtHTML('e<sup>' + coefHTML(2 * k, V(), true) + '</sup>') + ' = ' + ex(k)),
        st('Ergebnis', '<b>' + num(a) + '·' + ex(k) + '</b>')
      ]
    };
  }

  if (kind === 'lnexp') {
    /* ln(e^(ax)) + n*ln(x^m)  bzw.  e^(ln(x^n)) */
    if (coin()) {
      const a = rnz(-6, 6), n = ri(2, d <= 8 ? 3 : 5);
      const ref = x => a * x + n * Math.log(x);
      return {
        promptHTML: '<span class="big">ln(e<sup>' + coefHTML(a, V(), true) + '</sup>) <span class="op">+</span> ln(' + pw(V(), n) + ')</span>',
        fields: [Fexpr('=', 'z. B. 2x+3\\ln(x)')], check: checkExpr(ref, XDOM),
        solHTML: coefHTML(a, V(), true) + ' ' + coefHTML(n, 'ln(' + V() + ')', false),
        steps: [
          st('ln und e heben sich auf', 'ln(e<sup>u</sup>) = u → ln(e<sup>' + coefHTML(a, V(), true) + '</sup>) = ' + coefHTML(a, V(), true)),
          st('Exponent nach vorne', 'ln(' + pw(V(), n) + ') = ' + n + '·ln(' + V() + ')'),
          st('Ergebnis', '<b>' + coefHTML(a, V(), true) + ' ' + coefHTML(n, 'ln(' + V() + ')', false) + '</b>')
        ]
      };
    }
    const n = ri(2, d <= 8 ? 3 : 5), c = ri(2, 6);
    const ref = x => c * Math.pow(x, n);
    return {
      promptHTML: '<span class="big">' + num(c) + '·e<sup>ln(' + pw(V(), n) + ')</sup></span>',
      fields: [Fexpr('=', 'z. B. 4x^3')], check: checkExpr(ref, XDOM),
      solHTML: mono(c, n, true),
      steps: [
        st('Umkehrfunktionen', 'e<sup>ln(u)</sup> = u für u &gt; 0.'),
        st('Einsetzen', 'e<sup>ln(' + pw(V(), n) + ')</sup> = ' + pw(V(), n)),
        st('Ergebnis', '<b>' + mono(c, n, true) + '</b>')
      ]
    };
  }

  if (kind === 'wurzelbruch') {
    /* sqrt(a^2 x^(2m)) / sqrt(b^2 x^(2n)) = (a/b) x^(m-n), a durch b teilbar */
    const b = ri(2, 5), q = ri(2, d <= 8 ? 4 : 7), a = b * q;
    const n = ri(1, 2), m = n + ri(1, d <= 8 ? 2 : 3);
    const ref = x => q * Math.pow(x, m - n);
    return {
      promptHTML: '<span class="big">' + fracHTML(sqrtHTML(mono(a * a, 2 * m, true)), sqrtHTML(mono(b * b, 2 * n, true))) + '</span>',
      fields: [Fexpr('=', 'z. B. 3x^2')], check: checkExpr(ref, XDOM),
      solHTML: mono(q, m - n, true),
      steps: [
        st('Wurzeln einzeln ziehen', sqrtHTML(mono(a * a, 2 * m, true)) + ' = ' + mono(a, m, true) + ' und ' + sqrtHTML(mono(b * b, 2 * n, true)) + ' = ' + mono(b, n, true)),
        st('Bruch kürzen', fracHTML(mono(a, m, true), mono(b, n, true)) + ' — Zahlen teilen, Exponenten subtrahieren.'),
        st('Ergebnis', '<b>' + mono(q, m - n, true) + '</b> &nbsp;<span class="muted">(x &gt; 0)</span>')
      ]
    };
  }

  if (kind === 'emixw') {
    /* c * e^(ax) * sqrt(e^(2bx)) / e^(fx) */
    const a = rnz(-5, 5), b = rnz(-4, 4), f = rnz(-5, 5), c = ri(2, d <= 8 ? 4 : 8);
    const E = a + b - f;
    const ex = t => 'e<sup>' + coefHTML(t, V(), true) + '</sup>';
    const ref = x => c * Math.exp(E * x);
    return {
      promptHTML: '<span class="big">' + fracHTML(num(c) + '·' + ex(a) + '·' + sqrtHTML('e<sup>' + coefHTML(2 * b, V(), true) + '</sup>'), ex(f)) + '</span>',
      fields: [Fexpr('=', 'z. B. 3e^{2x}')], check: checkExpr(ref, EDOM),
      solHTML: E === 0 ? num(c) : num(c) + '·' + ex(E),
      steps: [
        st('Wurzel auflösen', sqrtHTML('e<sup>' + coefHTML(2 * b, V(), true) + '</sup>') + ' = ' + ex(b) + ' — Exponent halbieren.'),
        st('Zähler zusammenfassen', ex(a) + '·' + ex(b) + ' = ' + ex(a + b)),
        st('Durch den Nenner teilen', 'Exponenten subtrahieren: ' + num(a + b) + ' − ' + paren(f) + ' = ' + num(E)),
        st('Ergebnis', '<b>' + (E === 0 ? num(c) : num(c) + '·' + ex(E)) + '</b>')
      ]
    };
  }

  /* lnsumme */
  const n = ri(2, 5); let m = ri(1, 4); while (m === n) m = ri(1, 4);
  const plus = coin();
  const E = plus ? n + m : n - m;
  const ref = x => E * Math.log(x);
  return {
    promptHTML: '<span class="big">ln(' + pw(V(), n) + ')' + (plus ? ' <span class="op">+</span> ' : ' <span class="op">−</span> ') + 'ln(' + pw(V(), m) + ')</span>',
    subPrompt: 'Vereinfache so weit wie möglich (x &gt; 0).',
    fields: [Fexpr('=', 'z. B. 3ln(x)')], check: checkExpr(ref, XDOM),
    solHTML: coefHTML(E, 'ln(' + V() + ')', true),
    steps: [
      st('Logarithmusgesetz', 'ln(u<sup>n</sup>) = n·ln(u) — Exponenten nach vorne ziehen.'),
      st('Umschreiben', n + '·ln(' + V() + ')' + (plus ? ' + ' : ' − ') + m + '·ln(' + V() + ')'),
      st('Zusammenfassen', '(' + n + (plus ? ' + ' : ' − ') + m + ')·ln(' + V() + ') = <b>' + coefHTML(E, 'ln(' + V() + ')', true) + '</b>')
    ]
  };
}

<script>
/* ============================================================
   TEIL 6 — „Kombiniert": Aufgaben, die zwei Verfahren verbinden
   ============================================================ */

function addKombi(id, desc, fn) {
  const t = TOPICS.filter(x => x.id === id)[0];
  if (!t || t.variants.some(v => v.id === 'kombi')) return;
  const base = t.gen;
  t.gen = function (d, v) { return v === 'kombi' ? fn(d) : base.call(t, d, v); };
  t.variants.push({ id: 'kombi', name: 'Kombiniert', desc: desc });
}

/* ---------- Terme vereinfachen ---------- */
function verKombiGen(d) {
  const kind = pick(d <= 5 ? ['bin', 'zwei'] : (d <= 7 ? ['bin', 'zwei', 'quad', 'potenz', 'exp'] : ['zwei', 'quad', 'potenz', 'exp', 'exp', 'wurzel']));

  if (kind === 'exp') {
    /* c·(e^(ax))^n · e^(bx) + k·e^(Ex)  →  (c+k)·e^(Ex) */
    const a = rnz(-3, 3), n = ri(2, d <= 8 ? 3 : 4), b = rnz(-5, 5);
    const E = a * n + b;
    const c = ri(2, d <= 8 ? 5 : 9), k = rnz(-(d <= 8 ? 5 : 11), d <= 8 ? 5 : 11);
    if (c + k === 0) return verKombiGen(d);
    const ex = t => 'e<sup>' + coefHTML(t, V(), true) + '</sup>';
    const ref = x => (c + k) * Math.exp(E * x);
    return {
      promptHTML: '<span class="big">' + num(c) + '·(' + ex(a) + ')<sup>' + n + '</sup>·' + ex(b)
        + coefHTML(k, '·' + ex(E), false) + '</span>',
      fields: [Fexpr('=', 'z. B. 5e^{2x}')], check: checkExpr(ref, { lo: -1.2, hi: 1.2 }),
      solHTML: (E === 0 ? num(c + k) : num(c + k) + '·' + ex(E)),
      steps: [
        st('Klammer potenzieren', '(' + ex(a) + ')<sup>' + n + '</sup> = ' + ex(a * n) + ' — Exponenten multiplizieren.'),
        st('Faktoren zusammenfassen', ex(a * n) + '·' + ex(b) + ' = ' + ex(E) + ' — Exponenten addieren.'),
        st('Gleiche e-Terme addieren', num(c) + '·' + ex(E) + coefHTML(k, '·' + ex(E), false)
          + ' = <b>' + (E === 0 ? num(c + k) : num(c + k) + '·' + ex(E)) + '</b>')
      ]
    };
  }

  if (kind === 'wurzel') {
    /* sqrt(a^2 x^(2m)) · sqrt(b^2 x^(2n)) / (c x^q) + p x^E */
    const a = ri(2, 5), b = ri(2, 5), m = ri(1, 2), n = ri(1, 2);
    const N = a * b;
    const divs = []; for (let i = 1; i <= N; i++) if (N % i === 0) divs.push(i);
    const c = pick(divs), K1 = N / c;
    const q = ri(0, 2), E = m + n - q;
    if (E < 0 || E > 5) return verKombiGen(d);
    const p = rnz(-7, 7), K = K1 + p;
    if (K === 0) return verKombiGen(d);
    const numHTML = sqrtHTML(mono(a * a, 2 * m, true)) + ' · ' + sqrtHTML(mono(b * b, 2 * n, true));
    const ref = x => K * Math.pow(x, E);
    return {
      promptHTML: '<span class="big">' + (c === 1 && q === 0 ? numHTML : fracHTML(numHTML, mono(c, q, true)))
        + coefHTML(p, xpow(E), false) + '</span>',
      fields: [Fexpr('=', 'z. B. 4x^2')], check: checkExpr(ref, { lo: 0.6, hi: 2.6 }),
      solHTML: mono(K, E, true),
      steps: [
        st('Wurzeln ziehen', sqrtHTML(mono(a * a, 2 * m, true)) + ' = ' + mono(a, m, true) + ' und '
          + sqrtHTML(mono(b * b, 2 * n, true)) + ' = ' + mono(b, n, true) + ' &nbsp;<span class="muted">(x &gt; 0)</span>'),
        st('Zähler zusammenfassen', mono(N, m + n, true)),
        st('Durch den Nenner teilen', N + ' : ' + c + ' = ' + K1 + ', Exponent ' + (m + n) + ' − ' + q + ' = ' + E),
        st('Gleiche Potenzen addieren', mono(K1, E, true) + coefHTML(p, xpow(E), false) + ' = <b>' + mono(K, E, true) + '</b>')
      ]
    };
  }


  if (kind === 'bin') {
    const a = ri(1, d <= 6 ? 4 : 7), c = ri(1, d <= 6 ? 4 : 7);
    const b = rnz(-(d <= 6 ? 5 : 9), d <= 6 ? 5 : 9), e = ri(1, d <= 6 ? 6 : 11);
    const res = [a - c, 2 * a * b, a * b * b + c * e * e];
    return {
      promptHTML: '<span class="big">' + (a === 1 ? '' : a + '·') + '(' + polyHTML([1, b]) + ')<sup>2</sup>'
        + ' <span class="op">−</span> ' + (c === 1 ? '' : c + '·') + '(' + polyHTML([1, e]) + ')(' + polyHTML([1, -e]) + ')</span>',
      subPrompt: 'Vereinfache so weit wie möglich.',
      fields: [Fexpr('=')], check: checkExpr(polyF(res), POLY_DOM), solHTML: polyHTML(res),
      steps: [
        st('Erstes Quadrat', (a === 1 ? '' : a + '·') + '(' + polyHTML([1, b]) + ')² = ' + polyHTML([a, 2 * a * b, a * b * b])),
        st('Dritte binomische Formel', '(' + polyHTML([1, e]) + ')(' + polyHTML([1, -e]) + ') = ' + polyHTML([1, 0, -e * e])),
        st('Subtrahieren', polyHTML([a, 2 * a * b, a * b * b]) + ' − ' + (c === 1 ? '' : c + '·') + '(' + polyHTML([1, 0, -e * e]) + ')'),
        st('Zusammenfassen', '<b>' + polyHTML(res) + '</b>')
      ]
    };
  }

  if (kind === 'zwei') {
    const a = rnz(-4, 4), b = rnz(-7, 7), c = rnz(-4, 4), e = rnz(-7, 7);
    const f = ri(1, 5), g = rnz(-5, 5), h = rnz(-7, 7);
    const res = [a * c, a * e + b * c - f * g, b * e - f * h];
    return {
      promptHTML: '<span class="big">(' + polyHTML([a, b]) + ')(' + polyHTML([c, e]) + ')'
        + ' <span class="op">−</span> ' + (f === 1 ? '' : f + '·') + '(' + polyHTML([g, h]) + ')</span>',
      subPrompt: 'Vereinfache so weit wie möglich.',
      fields: [Fexpr('=')], check: checkExpr(polyF(res), POLY_DOM), solHTML: polyHTML(res),
      steps: [
        st('Produkt ausmultiplizieren', '(' + polyHTML([a, b]) + ')(' + polyHTML([c, e]) + ') = ' + polyHTML([a * c, a * e + b * c, b * e])),
        st('Zweite Klammer', (f === 1 ? '' : f + '·') + '(' + polyHTML([g, h]) + ') = ' + polyHTML([f * g, f * h]) + ' — wird abgezogen, also alle Vorzeichen drehen.'),
        st('Zusammenfassen', '<b>' + polyHTML(res) + '</b>')
      ]
    };
  }

  if (kind === 'quad') {
    const a = ri(1, 5), b = rnz(-7, 7), c = rnz(-6, 6), dd = rnz(-5, 5), e = rnz(-8, 8);
    const res = [a, 2 * a * b + c * dd, a * b * b + c * e];
    return {
      promptHTML: '<span class="big">' + (a === 1 ? '' : a + '·') + '(' + polyHTML([1, b]) + ')<sup>2</sup>'
        + coefHTML(c, '·(' + polyHTML([dd, e]) + ')', false) + '</span>',
      subPrompt: 'Vereinfache so weit wie möglich.',
      fields: [Fexpr('=')], check: checkExpr(polyF(res), POLY_DOM), solHTML: polyHTML(res),
      steps: [
        st('Binomische Formel', (a === 1 ? '' : a + '·') + '(' + polyHTML([1, b]) + ')² = ' + polyHTML([a, 2 * a * b, a * b * b])),
        st('Klammer ausmultiplizieren', num(c) + '·(' + polyHTML([dd, e]) + ') = ' + polyHTML([c * dd, c * e])),
        st('Addieren', '<b>' + polyHTML(res) + '</b>')
      ]
    };
  }

  /* potenz: Potenzgesetze + Zusammenfassen */
  for (let tries = 0; tries < 60; tries++) {
    const a = ri(2, 3), m = ri(1, 2), n = ri(0, 2), k = ri(0, 3), b = ri(1, 4);
    const N = a * a * b;
    const divs = []; for (let i = 1; i <= N; i++) if (N % i === 0) divs.push(i);
    const c = pick(divs);
    const K1 = N / c, E = 2 * m + n - k;
    if (E < 0 || E > 5) continue;
    const p = rnz(-6, 6);
    const K = K1 + p;
    if (K === 0 || Math.abs(K) > 200) continue;
    const numHTML = '(' + mono(a, m, true) + ')<sup>2</sup>' + (b === 1 && n === 0 ? '' : ' · ' + mono(b, n, true));
    const denHTML = mono(c, k, true);
    const ref = x => K * Math.pow(x, E);
    return {
      promptHTML: '<span class="big">' + (c === 1 && k === 0 ? numHTML : fracHTML(numHTML, denHTML))
        + coefHTML(p, xpow(E), false) + '</span>',
      subPrompt: 'Vereinfache so weit wie möglich (x &gt; 0).',
      fields: [Fexpr('=')], check: checkExpr(ref, { lo: 0.6, hi: 2.6 }), solHTML: mono(K, E, true),
      steps: [
        st('Klammer potenzieren', '(' + mono(a, m, true) + ')² = ' + mono(a * a, 2 * m, true)),
        st('Zähler zusammenfassen', mono(N, 2 * m + n, true)),
        st('Durch den Nenner teilen', N + ' : ' + c + ' = ' + K1 + ', Exponent ' + (2 * m + n) + ' − ' + k + ' = ' + E
          + ' → ' + mono(K1, E, true)),
        st('Gleiche Potenzen addieren', mono(K1, E, true) + coefHTML(p, xpow(E), false) + ' = <b>' + mono(K, E, true) + '</b>')
      ]
    };
  }
  return verKombiGen(Math.max(1, d - 3));
}
addKombi('vereinfachen', 'Binom, Potenzgesetze, Wurzeln und e-Funktionen in einer Aufgabe.', verKombiGen);

/* ---------- Lineare Gleichungen ---------- */
function linKombiGen(d) {
  for (let tries = 0; tries < 60; tries++) {
    const n = ri(2, d <= 5 ? 4 : 8);
    const a = rnz(-(d <= 5 ? 6 : 12), d <= 5 ? 6 : 12);
    const b = rnz(-9, 9), c = rnz(-9, 9), e = rnz(-9, 9);
    const dd = rnz(-(d <= 5 ? 4 : 8), d <= 5 ? 4 : 8);
    if (a - dd * n === 0) continue;
    const s = new F(dd * n * e - a * b - c * n, a - dd * n);
    if (Math.abs(s.v) > 60 || s.d > 24) continue;
    return {
      promptHTML: '<span class="big">' + fracHTML(num(a) + '·(' + polyHTML([1, b]) + ')', n)
        + coefHTML(c, '', false) + ' <span class="rel">=</span> '
        + (dd === 1 ? '' : (dd === -1 ? MINUS : num(dd) + '·')) + '(' + polyHTML([1, e]) + ')</span>',
      subPrompt: 'Löse nach x auf.',
      fields: [Fnum()], check: checkNum(s.v), solHTML: V() + ' = ' + s.html(),
      steps: [
        st('Mit ' + n + ' multiplizieren', num(a) + '·(' + polyHTML([1, b]) + ')' + coefHTML(c * n, '', false)
          + ' = ' + num(dd * n) + '·(' + polyHTML([1, e]) + ')'),
        st('Klammern auflösen', polyHTML([a, a * b + c * n]) + ' = ' + polyHTML([dd * n, dd * n * e])),
        st('Sortieren', polyHTML([a - dd * n, 0]) + ' = ' + num(dd * n * e - a * b - c * n)),
        st('Teilen', V() + ' = ' + fracHTML(num(dd * n * e - a * b - c * n), num(a - dd * n)) + ' = <b>' + s.html() + '</b>')
      ]
    };
  }
  return null;
}
addKombi('linear', 'Bruch und Klammern in einer Gleichung.', d => linKombiGen(d) || genLinear(d, 'klammer'));

/* ---------- Quadratische Gleichungen ---------- */
function quadKombiGen(d) {
  const R = d <= 5 ? 6 : (d <= 8 ? 9 : 13);
  const r1 = rnz(-R, R), r2 = rnz(-R, R);
  const p = rnz(-7, 7), q = rnz(-7, 7);
  const m = p + q + r1 + r2, c = p * q - r1 * r2;
  const co = [1, p + q - m, p * q - c];
  const sol = uniqSorted([r1, r2]);
  return {
    promptHTML: '<span class="big">(' + polyHTML([1, p]) + ')(' + polyHTML([1, q]) + ') <span class="rel">=</span> '
      + polyHTML([m, c]) + '</span>',
    subPrompt: 'Löse nach x auf.',
    fields: [Fset(2)], flags: FLAG_EMPTY, check: checkNums(sol), solHTML: setHTML(sol),
    plot: { fns: [{ f: polyF(co) }], hlines: [{ y: 0 }], points: sol.map(x => ({ x: x, y: 0 })) },
    steps: [
      st('Linke Seite ausmultiplizieren', polyHTML([1, p + q, p * q]) + ' = ' + polyHTML([m, c])),
      st('Alles auf eine Seite', polyHTML(co) + ' = 0'),
      st('pq-Formel', 'p = ' + num(co[1]) + ', q = ' + num(co[2]) + ' → ' + V() + '<sub>1,2</sub> = '
        + valHTML(-co[1] / 2) + ' ± ' + sqrtHTML(fmt(co[1] * co[1] / 4 - co[2]))),
      st('Ergebnis', setHTML(sol))
    ]
  };
}
addKombi('quadratisch', 'Erst umformen, dann mit der pq-Formel lösen.', quadKombiGen);

/* ---------- Bruchgleichungen ---------- */
function bruchKombiGen(d) {
  for (let tries = 0; tries < 60; tries++) {
    if (coin()) {
      const p = rnz(-8, 8); let q = rnz(-8, 8); while (q === p) q = rnz(-8, 8);
      const a = rnz(-9, 9), b = rnz(-9, 9);
      if (a + b === 0) continue;
      const s = new F(-(a * q + b * p), a + b);
      if (s.v === -p || s.v === -q || Math.abs(s.v) > 60) continue;
      return {
        /* Ein negativer Zaehler wird zum Minuszeichen davor: a/(x+p) − 9/(x+q). */
        promptHTML: '<span class="big">' + fracHTML(num(a), polyHTML([1, p]))
          + ' <span class="op">' + (b < 0 ? '−' : '+') + '</span> '
          + fracHTML(num(Math.abs(b)), polyHTML([1, q])) + ' <span class="rel">=</span> 0</span>',
        subPrompt: 'Definitionsmenge beachten.',
        fields: [Fnum()], check: checkNum(s.v), solHTML: V() + ' = ' + s.html(),
        steps: [
          st('Definitionsmenge', 'D = ℝ \\ { ' + num(-p) + '; ' + num(-q) + ' }'),
          st('Mit dem Hauptnenner multiplizieren', num(a) + '·(' + polyHTML([1, q]) + ')'
            + coefHTML(b, '·(' + polyHTML([1, p]) + ')', false) + ' = 0'),
          st('Ausmultiplizieren', polyHTML([a + b, a * q + b * p]) + ' = 0'),
          st('Auflösen', V() + ' = ' + fracHTML(num(-(a * q + b * p)), num(a + b)) + ' = <b>' + s.html() + '</b> — liegt in D ✓')
        ]
      };
    }
    const p = rnz(-8, 8), a = rnz(-9, 9), b = rnz(-6, 6);
    let c = rnz(-9, 9); while (c === a) c = rnz(-9, 9);
    const s = new F(c - a, b).sub(p);
    if (s.v === -p || Math.abs(s.v) > 60) continue;
    return {
      promptHTML: '<span class="big">' + fracHTML(num(a), polyHTML([1, p])) + coefHTML(b, '', false)
        + ' <span class="rel">=</span> ' + fracHTML(num(c), polyHTML([1, p])) + '</span>',
      subPrompt: 'Definitionsmenge beachten.',
      fields: [Fnum()], check: checkNum(s.v), solHTML: V() + ' = ' + s.html(),
      steps: [
        st('Definitionsmenge', V() + ' ≠ ' + num(-p) + ', also D = ℝ \\ { ' + num(-p) + ' }'),
        st('Mit (' + polyHTML([1, p]) + ') multiplizieren', num(a) + coefHTML(b, '·(' + polyHTML([1, p]) + ')', false) + ' = ' + num(c)),
        st('Ausmultiplizieren', polyHTML([b, a + b * p]) + ' = ' + num(c)),
        st('Auflösen', V() + ' = ' + fracHTML(num(c - a - b * p), num(b)) + ' = <b>' + s.html() + '</b>')
      ]
    };
  }
  return null;
}
addKombi('bruchgl', 'Zwei Brüche und eine Zahl in einer Gleichung.', d => bruchKombiGen(d) || genBruchGl(d, 'kreuz'));

/* ---------- Integrale ---------- */
function intKombiGen(d) {
  const a = rnz(-4, 4), b = rnz(-6, 6), n = ri(2, d <= 6 ? 3 : 4);
  if (coin() || d <= 5) {
    const c = rnz(-6, 6), m = ri(1, d <= 6 ? 2 : 3);
    const ref = x => Math.pow(a * x + b, n + 1) / (a * (n + 1)) + c / (m + 1) * Math.pow(x, m + 1);
    return {
      promptHTML: intPrompt('(' + polyHTML([a, b]) + ')<sup>' + n + '</sup>' + coefHTML(c, xpow(m), false)),
      subPrompt: 'Gib eine Stammfunktion an.',
      fields: [Fexpr('F(<i>x</i>) =')], check: checkAnti(ref, 0.2, 1.8),
      solHTML: 'F(' + V() + ') = ' + fracHTML('(' + polyHTML([a, b]) + ')<sup>' + (n + 1) + '</sup>', num(a * (n + 1)))
        + ' ' + coefHTML(new F(c, m + 1), xpow(m + 1), false) + ' + C',
      steps: [
        st('Erster Summand', '∫(' + polyHTML([a, b]) + ')<sup>' + n + '</sup> d' + V() + ' = '
          + fracHTML('(' + polyHTML([a, b]) + ')<sup>' + (n + 1) + '</sup>', num(a * (n + 1))) + ' — Korrekturfaktor ' + fracHTML('1', num(a))),
        st('Zweiter Summand', '∫' + coefHTML(c, xpow(m), true) + ' d' + V() + ' = ' + coefHTML(new F(c, m + 1), xpow(m + 1), true)),
        st('Ergebnis', 'F(' + V() + ') = <b>' + fracHTML('(' + polyHTML([a, b]) + ')<sup>' + (n + 1) + '</sup>', num(a * (n + 1)))
          + ' ' + coefHTML(new F(c, m + 1), xpow(m + 1), false) + '</b> + C')
      ]
    };
  }
  const c = rnz(-5, 5), k = rnz(-3, 3);
  const ref = x => Math.pow(a * x + b, n + 1) / (a * (n + 1)) + c / k * Math.exp(k * x);
  return {
    promptHTML: intPrompt('(' + polyHTML([a, b]) + ')<sup>' + n + '</sup>' + coefHTML(c, 'e<sup>' + num(k) + V() + '</sup>', false)),
    subPrompt: 'Gib eine Stammfunktion an.',
    fields: [Fexpr('F(<i>x</i>) =')], check: checkAnti(ref, -0.7, 1.1),
    solHTML: 'F(' + V() + ') = ' + fracHTML('(' + polyHTML([a, b]) + ')<sup>' + (n + 1) + '</sup>', num(a * (n + 1)))
      + addHTML(new F(c, k).abs().html()).replace(' + ', new F(c, k).v < 0 ? ' − ' : ' + ')
      + '·e<sup>' + num(k) + V() + '</sup> + C',
    steps: [
      st('Erster Summand', fracHTML('(' + polyHTML([a, b]) + ')<sup>' + (n + 1) + '</sup>', num(a * (n + 1)))),
      st('Zweiter Summand', '∫' + num(c) + 'e<sup>' + num(k) + V() + '</sup> d' + V() + ' = ' + new F(c, k).html() + '·e<sup>' + num(k) + V() + '</sup>'),
      st('Ergebnis', 'beide Stammfunktionen addieren, + C nicht vergessen.')
    ]
  };
}
addKombi('integral', 'Substitution und Grundintegrale in einer Aufgabe.', intKombiGen);

</script>
<script>
/* ============================================================
   TEIL 8 — Mehrdimensionale Analysis · Lineare Algebra ·
            Summen/Produkte · Ökonomische Funktionen
   ============================================================ */

const XY = { lo: 0.5, hi: 2.6 };
function Y() { return '<i>y</i>'; }
/* Monom a·x^m·y^n als HTML; Exponent 0/1 werden weggelassen */
function monoXY(a, m, n, first) {
  let body = '';
  if (m) body += 'x' === 'x' ? (m === 1 ? V() : V() + '<sup>' + m + '</sup>') : '';
  if (n) body += (n === 1 ? Y() : Y() + '<sup>' + n + '</sup>');
  return coefHTML(a, body, first);
}
function fxyHTML(terms) {
  let out = '', first = true;
  terms.forEach(t => {
    if (!t[0]) return;
    out += monoXY(t[0], t[1], t[2], first); first = false;
  });
  return out || '0';
}
function fxyF(terms) {
  return function (x, y) {
    let s = 0;
    terms.forEach(t => { s += t[0] * Math.pow(x, t[1]) * Math.pow(y, t[2]); });
    return s;
  };
}
function dXY(terms, wrt) {          /* wrt: 1 = nach x, 2 = nach y */
  const out = [];
  terms.forEach(t => {
    const e = wrt === 1 ? t[1] : t[2];
    if (!e) return;
    out.push(wrt === 1 ? [t[0] * e, t[1] - 1, t[2]] : [t[0] * e, t[1], t[2] - 1]);
  });
  return out.length ? out : [[0, 0, 0]];
}

/* ============================================================
   PARTIELLE ABLEITUNGEN
   ============================================================ */
topic({
  id: 'partiell', group: 'Mehrdim. Analysis', name: 'Partielle Ableitungen', icon: 'i-t-partiell',
  sub: 'Nach einer Variablen ableiten, die andere bleibt konstant.',
  variants: [
    { id: 'monom', name: 'Einzelnes Monom', desc: 'a·xᵐ·yⁿ nach x oder y ableiten.' },
    { id: 'summe', name: 'Summe von Termen', desc: 'Term für Term ableiten.' },
    { id: 'zweite', name: 'Zweite Ableitungen', desc: 'f_xx, f_yy und die gemischte f_xy.' },
    { id: 'expln', name: 'e-Funktion & ln', desc: 'Kettenregel in einer Variablen.' },
  ],
  formulas: [
    st('Grundidee', 'Beim Ableiten nach <i>x</i> ist <i>y</i> eine <b>Zahl</b> — und umgekehrt.'),
    st('Monom', '∂/∂x (a·x<sup>m</sup>y<sup>n</sup>) = a·m·x<sup>m−1</sup>y<sup>n</sup>'),
    st('Gemischte Ableitung', 'f<sub>xy</sub> = f<sub>yx</sub> (Satz von Schwarz) — die Reihenfolge ist egal.'),
    st('e-Funktion', '∂/∂y e<sup>k·y</sup> = k·e<sup>k·y</sup> &nbsp;·&nbsp; ∂/∂x ln(x) = ' + fracHTML(1, V())),
  ],
  gen: function (d, v) { return genPartiell(d, v); }
});

function genPartiell(d, v) {
  const R = d <= 3 ? 4 : (d <= 6 ? 7 : 10);
  if (v === 'expln') {
    const a = rnz(-R, R), k = rnz(-3, 3), m = ri(1, d <= 5 ? 2 : 3);
    if (coin()) {
      /* f = a·x^m·e^(k y), gesucht ∂f/∂y */
      const ref = (x, y) => a * k * Math.pow(x, m) * Math.exp(k * y);
      return {
        promptHTML: '<span class="big">f(' + V() + ', ' + Y() + ') = ' + coefHTML(a, xpow(m), true)
          + '·e<sup>' + coefHTML(k, Y(), true) + '</sup></span>',
        fields: [Fexpr('∂f/∂' + Y() + ' =', 'z. B. 6x^2*e^(2y)')], check: checkExpr2(ref, XY),
        solHTML: '∂f/∂' + Y() + ' = ' + coefHTML(a * k, xpow(m), true) + '·e<sup>' + coefHTML(k, Y(), true) + '</sup>',
        steps: [
          st('y ist die Variable', 'x<sup>' + m + '</sup> ist beim Ableiten nach y nur ein Vorfaktor.'),
          st('Kettenregel', '∂/∂y e<sup>' + coefHTML(k, Y(), true) + '</sup> = ' + num(k) + '·e<sup>' + coefHTML(k, Y(), true) + '</sup>'),
          st('Ergebnis', '<b>' + coefHTML(a * k, xpow(m), true) + '·e<sup>' + coefHTML(k, Y(), true) + '</sup></b>')
        ]
      };
    }
    /* f = a·ln(x)·y^n, gesucht ∂f/∂x */
    const n = ri(1, 3);
    const ref = (x, y) => a * Math.pow(y, n) / x;
    return {
      promptHTML: '<span class="big">f(' + V() + ', ' + Y() + ') = ' + coefLn(a, 0, V()) + '·' + pw(Y(), n) + '</span>',
      fields: [Fexpr('∂f/∂' + V() + ' =', 'z. B. 3y^2/x')], check: checkExpr2(ref, XY),
      solHTML: '∂f/∂' + V() + ' = ' + fracHTML(coefHTML(a, pw(Y(), n), true), V()),
      steps: [
        st('x ist die Variable', pw(Y(), n) + ' ist nur ein Vorfaktor.'),
        st('Ableitung von ln', '∂/∂x ln(x) = ' + fracHTML(1, V())),
        st('Ergebnis', '<b>' + fracHTML(coefHTML(a, pw(Y(), n), true), V()) + '</b>')
      ]
    };
  }

  if (v === 'zweite') {
    const terms = [[rnz(-R, R), ri(2, 3), ri(1, 2)], [rnz(-R, R), 1, ri(2, 3)], [rnz(-R, R), ri(1, 2), 0]];
    const kind = pick(['xx', 'yy', 'xy']);
    const lab = { xx: 'f<sub>xx</sub>', yy: 'f<sub>yy</sub>', xy: 'f<sub>xy</sub>' }[kind];
    const dd = kind === 'xx' ? dXY(dXY(terms, 1), 1)
      : (kind === 'yy' ? dXY(dXY(terms, 2), 2) : dXY(dXY(terms, 1), 2));
    const ref = fxyF(dd);
    const via = kind === 'yy' ? dXY(terms, 2) : dXY(terms, 1);
    return {
      promptHTML: '<span class="big">f(' + V() + ', ' + Y() + ') = ' + fxyHTML(terms) + '</span>',
      fields: [Fexpr(lab + ' =', 'z. B. 12xy^2')], check: checkExpr2(ref, XY),
      solHTML: lab + ' = ' + fxyHTML(dd),
      steps: [
        st('Erste Ableitung', (kind === 'yy' ? 'f<sub>y</sub>' : 'f<sub>x</sub>') + ' = ' + fxyHTML(via)),
        st('Noch einmal ableiten', 'jetzt nach ' + (kind === 'xx' ? 'x' : (kind === 'yy' ? 'y' : 'y')) + ': ' + fxyHTML(dd)),
        st('Ergebnis', '<b>' + lab + ' = ' + fxyHTML(dd) + '</b>')
      ]
    };
  }

  if (v === 'summe') {
    const terms = [[rnz(-R, R), ri(1, 3), ri(1, 2)], [rnz(-R, R), ri(1, 2), 0], [rnz(-R, R), 0, ri(1, 3)]];
    const wrt = coin() ? 1 : 2;
    const dd = dXY(terms, wrt);
    const ref = fxyF(dd);
    const lab = wrt === 1 ? '∂f/∂' + V() : '∂f/∂' + Y();
    return {
      plot: { kind: 'contour', f: fxyF(terms), grad: { x: 1.1, y: 1.3 }, iso: true, r: 2.6, highlight: false },
      promptHTML: '<span class="big">f(' + V() + ', ' + Y() + ') = ' + fxyHTML(terms) + '</span>',
      fields: [Fexpr(lab + ' =', 'z. B. 6xy + 4')], check: checkExpr2(ref, XY),
      solHTML: lab + ' = ' + fxyHTML(dd),
      steps: [
        st('Term für Term', 'Jeder Summand wird einzeln abgeleitet; ' + (wrt === 1 ? 'y' : 'x') + ' bleibt konstant.'),
        st('Konstante Summanden', 'Terme ohne ' + (wrt === 1 ? 'x' : 'y') + ' fallen weg.'),
        st('Ergebnis', '<b>' + lab + ' = ' + fxyHTML(dd) + '</b>')
      ]
    };
  }

  /* monom */
  const a = rnz(-R, R), m = ri(1, d <= 4 ? 3 : 4), n = ri(1, d <= 4 ? 3 : 4);
  const wrt = coin() ? 1 : 2;
  const dd = dXY([[a, m, n]], wrt);
  const ref = fxyF(dd);
  const lab = wrt === 1 ? '∂f/∂' + V() : '∂f/∂' + Y();
  return {
    plot: { kind: 'contour', f: fxyF([[a, m, n]]), grad: { x: 1.2, y: 1.1 }, iso: true, r: 2.4, highlight: false },
    promptHTML: '<span class="big">f(' + V() + ', ' + Y() + ') = ' + fxyHTML([[a, m, n]]) + '</span>',
    fields: [Fexpr(lab + ' =', 'z. B. 6x*y^3')], check: checkExpr2(ref, XY),
    solHTML: lab + ' = ' + fxyHTML(dd),
    steps: [
      st(wrt === 1 ? 'y festhalten' : 'x festhalten',
        (wrt === 1 ? pw(Y(), n) : xpow(m)) + ' ist beim Ableiten nur ein Vorfaktor.'),
      st('Potenzregel', 'Exponent nach vorne, dann um 1 verringern: ' + (wrt === 1 ? m : n) + '·'
        + paren(fxyHTML([[a, wrt === 1 ? m - 1 : m, wrt === 1 ? n : n - 1]]))),
      st('Ergebnis', '<b>' + lab + ' = ' + fxyHTML(dd) + '</b>')
    ]
  };
}

/* ============================================================
   GRADIENT & HESSE-MATRIX
   ============================================================ */
topic({
  id: 'gradient', group: 'Mehrdim. Analysis', name: 'Gradient & Hesse', icon: 'i-t-gradient',
  sub: 'Alle partiellen Ableitungen erster und zweiter Ordnung.',
  variants: [
    { id: 'grad', name: 'Gradient', desc: 'Beide partiellen Ableitungen angeben.' },

function genGradient(d, v) {
  const R = d <= 3 ? 4 : (d <= 6 ? 6 : 9);
  const terms = [[rnz(-R, R), ri(2, 3), 0], [rnz(-R, R), 1, 1], [rnz(-R, R), 0, ri(2, 3)], [rnz(-R, R), 1, 0]];
  const fx = dXY(terms, 1), fy = dXY(terms, 2);
  const head = '<span class="big">f(' + V() + ', ' + Y() + ') = ' + fxyHTML(terms) + '</span>';

  if (v === 'hesse') {
    const x0 = rnz(-3, 3), y0 = rnz(-3, 3);
    const fxx = dXY(fx, 1), fxy = dXY(fx, 2), fyy = dXY(fy, 2);
    const H = [[fxyF(fxx)(x0, y0), fxyF(fxy)(x0, y0)], [fxyF(fxy)(x0, y0), fxyF(fyy)(x0, y0)]];
    return {
      plot: { kind: 'contour', f: fxyF(terms), point: { x: x0, y: y0 }, iso: true, r: 3, pointLabel: 'Punkt P' },
      promptHTML: head + '<p class="qtext">Hesse-Matrix an der Stelle P(' + num(x0) + ' | ' + num(y0) + ')</p>',
      fields: [Fmat(2, 2, 'H(' + num(x0) + ' | ' + num(y0) + ')')], check: checkMat(H),
      solHTML: 'H = ' + matHTML([[num(H[0][0]), num(H[0][1])], [num(H[1][0]), num(H[1][1])]]),
      steps: [
        st('Erste Ableitungen', 'f<sub>x</sub> = ' + fxyHTML(fx) + ' &nbsp;·&nbsp; f<sub>y</sub> = ' + fxyHTML(fy)),
        st('Zweite Ableitungen', 'f<sub>xx</sub> = ' + fxyHTML(fxx) + ' &nbsp;·&nbsp; f<sub>xy</sub> = ' + fxyHTML(fxy)
          + ' &nbsp;·&nbsp; f<sub>yy</sub> = ' + fxyHTML(fyy)),
        st('Einsetzen', 'x = ' + num(x0) + ', y = ' + num(y0)),
        st('Ergebnis', '<b>H = ' + matHTML([[num(H[0][0]), num(H[0][1])], [num(H[1][0]), num(H[1][1])]]) + '</b>')
      ]
    };
  }

  if (v === 'punkt') {
    const x0 = rnz(-3, 3), y0 = rnz(-3, 3);
    const gx = fxyF(fx)(x0, y0), gy = fxyF(fy)(x0, y0);
    return {
      plot: { kind: 'contour', f: fxyF(terms), grad: { x: x0, y: y0 }, point: { x: x0, y: y0 },
        iso: true, r: 3, cxy: [x0, y0],
        pointLabel: 'Punkt P', levelLabel: 'Höhenlinie durch P' },
      promptHTML: head + '<p class="qtext">Gradient an der Stelle P(' + num(x0) + ' | ' + num(y0) + ')</p>',
      fields: [Fnum('f<sub>x</sub>(P) =', 'Zahl'), Fnum('f<sub>y</sub>(P) =', 'Zahl')],
      check: checkMulti([gx, gy]),
      solHTML: '∇f(P) = ' + vecHTML([num(gx), num(gy)]),
      steps: [
        st('Ableiten', 'f<sub>x</sub> = ' + fxyHTML(fx) + ' &nbsp;·&nbsp; f<sub>y</sub> = ' + fxyHTML(fy)),
        st('Einsetzen', 'x = ' + num(x0) + ', y = ' + num(y0)),
        st('Ergebnis', '<b>∇f(P) = ' + vecHTML([num(gx), num(gy)]) + '</b>')
      ]
    };
  }

  /* grad */
  return {

    promptHTML: head,

topic({

  variants: [

    { id: 'art', name: 'Art bestimmen', desc: 'Minimum, Maximum oder Sattelpunkt?' },
    { id: 'beides', name: 'Stelle & Art', desc: 'Erst die Stelle, dann die Einordnung.' },
  ],
  formulas: [
    st('Notwendig', 'f<sub>x</sub> = 0 <i>und</i> f<sub>y</sub> = 0 → kritische Stelle.'),
    st('Hinreichend', 'D = f<sub>xx</sub>·f<sub>yy</sub> − (f<sub>xy</sub>)²'),
    st('Einordnung', 'D &gt; 0 und f<sub>xx</sub> &gt; 0 → <b>Minimum</b><br>D &gt; 0 und f<sub>xx</sub> &lt; 0 → <b>Maximum</b><br>D &lt; 0 → <b>Sattelpunkt</b>'),
  ],
  gen: function (d, v) { return genExtrem2d(d, v); }
});

const ART = ['Minimum', 'Maximum', 'Sattelpunkt'];
function genExtrem2d(d, v) {
  /* f = a x² + b y² + c xy + d x + e y  mit ganzzahliger kritischer Stelle */
  const a = rnz(-3, 3), b = rnz(-3, 3);
  let c = d <= 4 ? 0 : rnz(-3, 3);
  const D = 4 * a * b - c * c;
  if (D === 0) return genExtrem2d(d, v);
  const x0 = rnz(-4, 4), y0 = rnz(-4, 4);
  /* f_x = 2a x + c y + p = 0 und f_y = 2b y + c x + q = 0 */
  const p = -(2 * a * x0 + c * y0), q = -(2 * b * y0 + c * x0);
  const terms = [[a, 2, 0], [b, 0, 2], [c, 1, 1], [p, 1, 0], [q, 0, 1]];
  const fx = dXY(terms, 1), fy = dXY(terms, 2);
  const art = D < 0 ? 2 : (a > 0 ? 0 : 1);
  const head = '<span class="big">f(' + V() + ', ' + Y() + ') = ' + fxyHTML(terms) + '</span>';
  const stepsBase = [
    st('Ableitungen null setzen', 'f<sub>x</sub> = ' + fxyHTML(fx) + ' = 0 &nbsp;·&nbsp; f<sub>y</sub> = ' + fxyHTML(fy) + ' = 0'),
    st('Lösen', 'x = ' + num(x0) + ', y = ' + num(y0)),
    st('Zweite Ableitungen', 'f<sub>xx</sub> = ' + num(2 * a) + ', f<sub>yy</sub> = ' + num(2 * b) + ', f<sub>xy</sub> = ' + num(c)),
    st('Kriterium', 'D = ' + num(2 * a) + '·' + paren(2 * b) + ' − (' + num(c) + ')² = <b>' + num(D) + '</b> → ' + ART[art])
  ];

  const plot2 = { kind: 'contour', f: fxyF(terms), point: { x: x0, y: y0 },
    iso: true, r: Math.max(2.6, Math.abs(y0) + 2.2),
    pointLabel: 'kritische Stelle', levelLabel: 'Höhenlinie durch die Stelle' };
  if (v === 'art') {
    return {
      plot: plot2,
      promptHTML: head + '<p class="qtext">Die kritische Stelle liegt bei P(' + num(x0) + ' | ' + num(y0) + '). Welche Art?</p>',
      fields: [Fmc(ART, 'Art der Stelle')], check: checkMC(art),
      solHTML: ART[art] + ' (D = ' + num(D) + ')', steps: stepsBase
    };
  }
  if (v === 'beides') {
    return {
      plot: plot2,
      promptHTML: head,
      fields: [Fnum('<i>x</i><sub>0</sub> =', 'Zahl'), Fnum('<i>y</i><sub>0</sub> =', 'Zahl'), Fmc(ART, 'Art der Stelle')],
      check: checkParts([{ k: 'num', v: x0 }, { k: 'num', v: y0 }, { k: 'mc', v: art }]),
      solHTML: 'P(' + num(x0) + ' | ' + num(y0) + ') — ' + ART[art], steps: stepsBase
    };
  }
  return {
    plot: plot2,
    promptHTML: head,
    fields: [Fnum('<i>x</i><sub>0</sub> =', 'Zahl'), Fnum('<i>y</i><sub>0</sub> =', 'Zahl')],
    check: checkMulti([x0, y0]),
    solHTML: 'P(' + num(x0) + ' | ' + num(y0) + ')', steps: stepsBase
  };
}
