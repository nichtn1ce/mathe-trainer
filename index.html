<script>
/* ============================================================
   GENERATOREN — Teil 2
   Betrag · Potenz · Wurzel · Exponential · Logarithmus · Ungleichungen
   ============================================================ */

/* ============================================================
   7 · BETRAGSGLEICHUNGEN
   ============================================================ */
topic({
  id: 'betrag', group: 'Gleichungen', name: 'Betragsgleichungen', icon: '|x|',
  sub: 'Der Betrag macht aus einer Gleichung zwei Fälle — positiv und negativ.',
  variants: [
    { id: 'grund', name: 'Grundform', desc: '|T(x)| = c — zwei Fälle: T(x) = c und T(x) = −c. Für c < 0 gibt es keine Lösung.' },
    { id: 'verschoben', name: 'Mit Summand', desc: 'Erst den Betrag isolieren, dann die Fallunterscheidung machen.' },
    { id: 'zwei', name: 'Betrag = Betrag', desc: '|A| = |B| ⟺ A = B oder A = −B.' },
    { id: 'mitx', name: 'Betrag = Term mit x', desc: 'Beide Fälle lösen — und unbedingt die Probe machen, es gibt Scheinlösungen.' },
  ],
  formulas: [
    st('Definition', '|a| = a für a ≥ 0 &nbsp;·&nbsp; |a| = −a für a &lt; 0'),
    st('Grundregel', '|T| = c (c ≥ 0) ⟺ T = c oder T = −c'),
    st('Kein Ergebnis', '|T| = c mit c &lt; 0 → 𝕃 = { }, denn ein Betrag ist nie negativ.'),
    st('Zwei Beträge', '|A| = |B| ⟺ A = B oder A = −B'),
    st('Probe', 'Bei |T(x)| = Term mit x immer einsetzen und prüfen!'),
  ],
  gen: function (d, v) { return genBetrag(d, v); }
});

function genBetrag(d, v) {
  const a = rnz(-(d <= 3 ? 3 : (d <= 6 ? 6 : 12)), d <= 3 ? 3 : (d <= 6 ? 6 : 12));
  const b = rnz(-(d <= 3 ? 6 : (d <= 6 ? 12 : 30)), d <= 3 ? 6 : (d <= 6 ? 12 : 30));
  const absT = polyHTML([a, b]);
  const absF = x => Math.abs(a * x + b);

  if (v === 'zwei') {
    let c = rnz(-9, 9); while (Math.abs(c) === Math.abs(a)) c = rnz(-9, 9);
    const e = rnz(-15, 15);
    const s1 = new F(e - b, a - c);          /* ax+b = cx+e  */
    const s2 = new F(-(e + b), a + c);       /* ax+b = -(cx+e) */
    const sol = uniqSorted([s1.v, s2.v]);
    return {
      promptHTML: '<span class="big">|' + absT + '| <span class="rel">=</span> |' + polyHTML([c, e]) + '|</span>',
      fields: [Fset(2)], flags: FLAG_EMPTY, check: checkNums(sol), solHTML: setHTML(sol),
      plot: { fns: [{ f: absF, label: '|links|' }, { f: x => Math.abs(c * x + e), label: '|rechts|', color: 2 }], points: sol.map(x => ({ x: x, y: absF(x) })) },
      steps: [
        st('Zwei Fälle', '|A| = |B| bedeutet A = B <b>oder</b> A = −B.'),
        st('Fall 1', polyHTML([a, b]) + ' = ' + polyHTML([c, e]) + ' → ' + polyHTML([a - c, 0]) + ' = ' + num(e - b) + ' → ' + V() + ' = ' + s1.html()),
        st('Fall 2', polyHTML([a, b]) + ' = −(' + polyHTML([c, e]) + ') → ' + polyHTML([a + c, 0]) + ' = ' + num(-(e + b)) + ' → ' + V() + ' = ' + s2.html()),
        st('Ergebnis', setHTML(sol))
      ]
    };
  }

  if (v === 'mitx') {
    const c = rnz(-9, 9);
    /* |ax+b| = x + c  */
    if (a === 1 || a === -1) return genBetrag(d, 'grund');
    const s1 = new F(c - b, a - 1);   /* ax+b = x+c */
    const s2 = new F(-(c + b), a + 1);/* -(ax+b) = x+c */
    const sol = uniqSorted([s1.v, s2.v].filter(x => close(Math.abs(a * x + b), x + c)));
    return {
      promptHTML: '<span class="big">|' + absT + '| <span class="rel">=</span> ' + polyHTML([1, c]) + '</span>',
      subPrompt: 'Probe nicht vergessen.',
      fields: [Fset(2)], flags: FLAG_EMPTY, check: checkNums(sol), solHTML: setHTML(sol),
      plot: { fns: [{ f: absF }, { f: x => x + c, color: 2 }], points: sol.map(x => ({ x: x, y: x + c })) },
      steps: [
        st('Fall 1 (Term ≥ 0)', polyHTML([a, b]) + ' = ' + polyHTML([1, c]) + ' → ' + V() + ' = ' + (a !== 1 ? s1.html() : 'keine eindeutige Lösung')),
        st('Fall 2 (Term &lt; 0)', '−(' + polyHTML([a, b]) + ') = ' + polyHTML([1, c]) + ' → ' + V() + ' = ' + (a !== -1 ? s2.html() : 'keine eindeutige Lösung')),
        st('Probe', 'Die rechte Seite ' + polyHTML([1, c]) + ' muss ≥ 0 sein — sonst ist der Kandidat eine Scheinlösung.'),
        st('Ergebnis', setHTML(sol))
      ]
    };
  }

  if (v === 'verschoben') {
    const e = rnz(-12, 12);
    const noSol = d >= 6 && coin(0.22);
    const cRaw = noSol ? ri(-9, -1) : ri(0, d <= 5 ? 12 : 40);
    const c = cRaw + e;            /* |ax+b| + e = c  → |ax+b| = c − e = cRaw */
    let sol = [];
    if (cRaw > 0) sol = uniqSorted([new F(cRaw - b, a).v, new F(-cRaw - b, a).v]);
    else if (cRaw === 0) sol = [new F(-b, a).v];
    return {
      promptHTML: '<span class="big">|' + absT + '|' + coefHTML(e, '', false) + ' <span class="rel">=</span> ' + num(c) + '</span>',
      fields: [Fset(2)], flags: FLAG_EMPTY, check: checkNums(sol), solHTML: setHTML(sol),
      plot: { fns: [{ f: x => absF(x) + e }], hlines: [{ y: c }], points: sol.map(x => ({ x: x, y: c })) },
      steps: [
        st('Betrag isolieren', '|' + absT + '| = ' + num(c) + ' ' + (e >= 0 ? '− ' + e : '+ ' + (-e)) + ' = ' + num(cRaw)),
        cRaw < 0 ? st('Widerspruch', 'Ein Betrag ist niemals negativ → 𝕃 = { }')
          : st('Fallunterscheidung', polyHTML([a, b]) + ' = ' + num(cRaw) + ' &nbsp;oder&nbsp; ' + polyHTML([a, b]) + ' = ' + num(-cRaw)),
        st('Ergebnis', setHTML(sol))
      ]
    };
  }

  /* grund */
  const noSol = d >= 5 && coin(0.2);
  const c = noSol ? ri(-12, -1) : (d >= 4 && coin(0.1) ? 0 : ri(1, d <= 4 ? 12 : 40));
  let sol = [];
  if (c > 0) sol = uniqSorted([new F(c - b, a).v, new F(-c - b, a).v]);
  else if (c === 0) sol = [new F(-b, a).v];
  return {
    promptHTML: '<span class="big">|' + absT + '| <span class="rel">=</span> ' + num(c) + '</span>',
    fields: [Fset(2)], flags: FLAG_EMPTY, check: checkNums(sol), solHTML: setHTML(sol),
    plot: { fns: [{ f: absF }], hlines: [{ y: c }], points: sol.map(x => ({ x: x, y: c })) },
    steps: c < 0 ? [
      st('Beobachtung', 'Links steht ein Betrag — der ist immer ≥ 0.'),
      st('Rechts', num(c) + ' &lt; 0 → das kann nie passen.'),
      st('Ergebnis', '𝕃 = { }')
    ] : (c === 0 ? [
      st('Sonderfall', '|T| = 0 ⟺ T = 0 — nur ein Fall.'),
      st('Lösen', polyHTML([a, b]) + ' = 0 → ' + V() + ' = ' + valHTML(-b / a)),
      st('Ergebnis', setHTML(sol))
    ] : [
      st('Fall 1', polyHTML([a, b]) + ' = ' + c + ' → ' + polyHTML([a, 0]) + ' = ' + num(c - b) + ' → ' + V() + ' = ' + new F(c - b, a).html()),
      st('Fall 2', polyHTML([a, b]) + ' = ' + num(-c) + ' → ' + polyHTML([a, 0]) + ' = ' + num(-c - b) + ' → ' + V() + ' = ' + new F(-c - b, a).html()),
      st('Ergebnis', setHTML(sol))
    ])
  };
}

/* ============================================================
   8 · POTENZGLEICHUNGEN
   ============================================================ */
topic({
  id: 'potenz', group: 'Gleichungen', name: 'Potenzgleichungen', icon: 'xⁿ',
  sub: 'x hoch n: Bei geradem n gibt es ±, bei ungeradem n genau eine reelle Lösung.',
  variants: [
    { id: 'rein', name: 'xⁿ = a', desc: 'n-te Wurzel ziehen. Gerades n → zwei Lösungen ±, ungerades n → eine.' },
    { id: 'klammer', name: '(ax+b)ⁿ = c', desc: 'Erst die n-te Wurzel ziehen, dann die lineare Gleichung lösen.' },
    { id: 'negativ', name: 'Negative Exponenten', desc: 'x⁻ⁿ = 1/xⁿ — Kehrwert bilden und dann Wurzel ziehen.' },
    { id: 'rational', name: 'Gebrochene Exponenten', desc: 'x^(m/n) = a — beide Seiten hoch n/m nehmen (x > 0).' },
  ],
  formulas: [
    st('Gerader Exponent', 'x<sup>2k</sup> = a (a &gt; 0) → x = ± ' + sqrtHTML('a', '2k') + ' · für a &lt; 0 keine reelle Lösung'),
    st('Ungerader Exponent', 'x<sup>2k+1</sup> = a → genau eine reelle Lösung, Vorzeichen bleibt erhalten'),
    st('Negativer Exponent', 'x<sup>−n</sup> = a ⟺ x<sup>n</sup> = ' + fracHTML('1', 'a') + ' (a ≠ 0)'),
    st('Gebrochener Exponent', 'x<sup>m/n</sup> = a ⟺ x = a<sup>n/m</sup> (für x &gt; 0)'),
  ],
  gen: function (d, v) { return genPotenz(d, v); }
});

function genPotenz(d, v) {
  const n = d <= 3 ? pick([2, 3]) : (d <= 6 ? ri(2, 4) : ri(2, 6));
  if (v === 'klammer') {
    const a = rnz(-(d <= 5 ? 3 : 6), d <= 5 ? 3 : 6), b = rnz(-9, 9);
    const w = ri(1, d <= 5 ? 4 : 7);
    const c = Math.pow(w, n);
    let sol;
    if (n % 2 === 0) sol = uniqSorted([new F(w - b, a).v, new F(-w - b, a).v]);
    else sol = [new F(w - b, a).v];
    return {
      promptHTML: '<span class="big">(' + polyHTML([a, b]) + ')<sup>' + n + '</sup> <span class="rel">=</span> ' + c + '</span>',
      fields: [Fset(2)], flags: FLAG_EMPTY, check: checkNums(sol), solHTML: setHTML(sol),
      plot: {
        fns: [{ f: x => Math.pow(a * x + b, n), label: 'linke Seite' }, { f: x => c, label: 'rechte Seite', color: 2 }],
        points: sol.map(x => ({ x: x, y: c }))
      },
      steps: [
        st(n + '-te Wurzel ziehen', polyHTML([a, b]) + ' = ' + (n % 2 === 0 ? '± ' : '') + sqrtHTML(c, n) + ' = ' + (n % 2 === 0 ? '± ' : '') + w),
        st(n % 2 === 0 ? 'Zwei lineare Gleichungen' : 'Lineare Gleichung', n % 2 === 0
          ? (polyHTML([a, b]) + ' = ' + w + ' &nbsp;oder&nbsp; ' + polyHTML([a, b]) + ' = ' + num(-w))
          : (polyHTML([a, b]) + ' = ' + w)),
        st('Ergebnis', setHTML(sol))
      ]
    };
  }
  if (v === 'negativ') {
    const m = d <= 5 ? pick([1, 2, 3]) : ri(1, 4);
    const w = ri(2, d <= 5 ? 4 : 6);
    const a = new F(1, Math.pow(w, m));
    let sol = m % 2 === 0 ? uniqSorted([-w, w]) : [w];
    return {
      promptHTML: '<span class="big">' + V() + '<sup>−' + m + '</sup> <span class="rel">=</span> ' + a.html() + '</span>',
      fields: [Fset(2)], flags: FLAG_EMPTY, check: checkNums(sol), solHTML: setHTML(sol),
      plot: {
        fns: [{ f: x => Math.pow(x, -m), label: 'linke Seite' }, { f: x => a.v, label: 'rechte Seite', color: 2 }],
        points: sol.map(x => ({ x: x, y: a.v }))
      },
      steps: [
        st('Umschreiben', fracHTML('1', V() + '<sup>' + m + '</sup>') + ' = ' + a.html()),
        st('Kehrwert', V() + '<sup>' + m + '</sup> = ' + Math.pow(w, m)),
        st(m === 1 ? 'Auflösen' : 'Wurzel ziehen', V() + ' = ' + (m % 2 === 0 ? '± ' : '') + (m === 1 ? '' + Math.pow(w, m) : sqrtHTML(Math.pow(w, m), m) + ' = ' + (m % 2 === 0 ? '± ' : '') + w)),
        st('Ergebnis', setHTML(sol))
      ]
    };
  }
  if (v === 'rational') {
    const base = pick([2, 3, 4, 5]);
    const nn = pick([2, 3]), mm = pick([2, 3, 4]);
    const x0 = Math.pow(base, nn);
    const a = Math.pow(x0, mm / nn);
    return {
      promptHTML: '<span class="big">' + V() + '<sup>' + mm + '/' + nn + '</sup> <span class="rel">=</span> ' + fmt(a) + '</span>',
      subPrompt: 'Es gilt x &gt; 0.',
      fields: [Fnum()], check: checkNum(x0), solHTML: V() + ' = ' + fmt(x0),
      plot: {
        fns: [{ f: x => (x > 0 ? Math.pow(x, mm / nn) : NaN), label: 'linke Seite' }, { f: x => a, label: 'rechte Seite', color: 2 }],
        points: [{ x: x0, y: a }]
      },
      steps: [
        st('Beide Seiten hoch ' + nn + '/' + mm, '(' + V() + '<sup>' + mm + '/' + nn + '</sup>)<sup>' + nn + '/' + mm + '</sup> = ' + fmt(a) + '<sup>' + nn + '/' + mm + '</sup>'),
        st('Exponenten multiplizieren', V() + '<sup>1</sup> = ' + fmt(a) + '<sup>' + nn + '/' + mm + '</sup>'),
        st('Ergebnis', V() + ' = <b>' + fmt(x0) + '</b>')
      ]
    };
  }
  /* rein */
  const noSol = n % 2 === 0 && d >= 5 && coin(0.2);
  const w = ri(1, d <= 4 ? 5 : (d <= 7 ? 9 : 13));
  const a = noSol ? -Math.pow(w, n) : Math.pow(w, n) * (n % 2 === 1 && coin() ? -1 : 1);
  let sol;
  if (noSol) sol = [];
  else if (n % 2 === 0) sol = uniqSorted([-w, w]);
  else sol = [a < 0 ? -w : w];
  return {
    promptHTML: '<span class="big">' + V() + '<sup>' + n + '</sup> <span class="rel">=</span> ' + num(a) + '</span>',
    fields: [Fset(2)], flags: FLAG_EMPTY, check: checkNums(sol), solHTML: setHTML(sol),
    plot: {
      fns: [{ f: x => Math.pow(x, n), label: 'linke Seite' }, { f: x => a, label: 'rechte Seite', color: 2 }],
      points: sol.map(x => ({ x: x, y: a }))
    },
    steps: noSol ? [
      st('Beobachtung', 'n = ' + n + ' ist gerade → ' + V() + '<sup>' + n + '</sup> ≥ 0 für alle reellen x.'),
      st('Widerspruch', 'Rechts steht ' + num(a) + ' &lt; 0.'),
      st('Ergebnis', '𝕃 = { }')
    ] : [
      st(n + '-te Wurzel', V() + ' = ' + (n % 2 === 0 ? '± ' : '') + sqrtHTML(num(a), n)),
      st('Ausrechnen', (n % 2 === 0 ? '± ' : '') + sqrtHTML(Math.abs(a), n) + ' = ' + (n % 2 === 0 ? '± ' : '') + w + (n % 2 === 1 && a < 0 ? ', Vorzeichen bleibt negativ' : '')),
      st('Ergebnis', setHTML(sol))
    ]
  };
}

/* ============================================================
   9 · WURZELGLEICHUNGEN
   ============================================================ */
topic({
  id: 'wurzelgl', group: 'Gleichungen', name: 'Wurzelgleichungen', icon: '√',
  sub: 'Wurzel isolieren, quadrieren — und immer die Probe machen.',
  variants: [
    { id: 'grund', name: 'Grundform', desc: '√(ax+b) = c — quadrieren und lineare Gleichung lösen.' },
    { id: 'linear', name: 'Wurzel = Term mit x', desc: 'Quadrieren führt auf eine quadratische Gleichung — Scheinlösungen möglich!' },
    { id: 'zwei', name: 'Zwei Wurzeln', desc: '√A = √B ⟺ A = B (mit Definitionsbedingungen).' },
    { id: 'nte', name: 'Höhere Wurzeln', desc: 'Bei der dritten Wurzel wird beide Seiten hoch 3 genommen.' },
  ],
  formulas: [
    st('Quadrieren', sqrtHTML('T') + ' = c ⟹ T = c² — Achtung: keine Äquivalenzumformung!'),
    st('Bedingungen', 'Radikand ≥ 0 <b>und</b> rechte Seite ≥ 0.'),
    st('Probe', 'Jede Lösung in die <i>Ausgangsgleichung</i> einsetzen.'),
    st('Dritte Wurzel', sqrtHTML('T', 3) + ' = c ⟺ T = c³, hier gibt es keine Vorzeichenbedingung.'),
  ],
  gen: function (d, v) { return genWurzel(d, v); }
});

function genWurzel(d, v) {
  if (v === 'nte') {
    const a = rnz(-(d <= 5 ? 3 : 6), d <= 5 ? 3 : 6), c = rnz(-(d <= 5 ? 4 : 6), d <= 5 ? 4 : 6);
    const b = rnz(-9, 9);
    const s = new F(c * c * c - b, a);
    return {
      promptHTML: '<span class="big">' + sqrtHTML(polyHTML([a, b]), 3) + ' <span class="rel">=</span> ' + num(c) + '</span>',
      fields: [Fnum()], check: checkNum(s.v), solHTML: V() + ' = ' + s.html(),
      steps: [
        st('Hoch 3 nehmen', polyHTML([a, b]) + ' = (' + num(c) + ')³ = ' + num(c * c * c)),
        st('Auflösen', polyHTML([a, 0]) + ' = ' + num(c * c * c - b) + ' → ' + V() + ' = <b>' + s.html() + '</b>'),
        st('Hinweis', 'Bei ungeraden Wurzeln entstehen keine Scheinlösungen.')
      ]
    };
  }
  if (v === 'zwei') {
    const a = ri(1, 4), b = rnz(-9, 9), c = a + ri(1, 3), e = rnz(-9, 9);
    if (a === c) return genWurzel(d, 'grund');
    const X = new F(e - b, a - c);
    const ok = (a * X.v + b) >= -1e-9 && (c * X.v + e) >= -1e-9;
    const solF = ok ? [X.v] : [];
    return {
      promptHTML: '<span class="big">' + sqrtHTML(polyHTML([a, b])) + ' <span class="rel">=</span> ' + sqrtHTML(polyHTML([c, e])) + '</span>',
      fields: [Fset(1)], flags: FLAG_EMPTY, check: checkNums(solF), solHTML: setHTML(solF),
      steps: [
        st('Quadrieren', polyHTML([a, b]) + ' = ' + polyHTML([c, e])),
        st('Sortieren', polyHTML([a - c, 0]) + ' = ' + num(e - b) + ' → ' + V() + ' = ' + X.html()),
        st('Probe', ok ? 'Beide Radikanden sind ≥ 0 ✓' : 'Ein Radikand wird negativ → Scheinlösung, 𝕃 = { }'),
        st('Ergebnis', setHTML(solF))
      ]
    };
  }
  if (v === 'linear') {
    const c = rnz(-(d <= 5 ? 4 : 8), d <= 5 ? 4 : 8);
    const a = rnz(-(d <= 5 ? 3 : 6), d <= 5 ? 3 : 6);
    const s0 = ri(Math.max(-6, -c), d <= 5 ? 6 : 9);
    const b = (s0 + c) * (s0 + c) - a * s0;
    if (Math.abs(b) > 90) return genWurzel(d, 'grund');
    const p = 2 * c - a, q = c * c - b;
    const cand = uniqSorted(solveQuad(1, p, q));
    const sol = uniqSorted(cand.filter(x => (a * x + b) >= -1e-9 && (x + c) >= -1e-9
      && close(Math.sqrt(Math.max(a * x + b, 0)), x + c, 1e-6)));
    return {
      promptHTML: '<span class="big">' + sqrtHTML(polyHTML([a, b])) + ' <span class="rel">=</span> ' + polyHTML([1, c]) + '</span>',
      subPrompt: 'Probe nicht vergessen.',
      fields: [Fset(2)], flags: FLAG_EMPTY, check: checkNums(sol), solHTML: setHTML(sol),
      plot: { fns: [{ f: x => Math.sqrt(a * x + b) }, { f: x => x + c, color: 2 }], points: sol.map(x => ({ x: x, y: x + c })) },
      steps: [
        st('Bedingungen', 'Radikand ' + polyHTML([a, b]) + ' ≥ 0 und rechte Seite ' + polyHTML([1, c]) + ' ≥ 0.'),
        st('Quadrieren', polyHTML([a, b]) + ' = (' + polyHTML([1, c]) + ')² = ' + polyHTML([1, 2 * c, c * c])),
        st('Umstellen', polyHTML([1, p, q]) + ' = 0'),
        st('pq-Formel', cand.length ? 'Kandidaten: ' + cand.map(x => num(x)).join(' und ') : 'keine reellen Kandidaten'),
        st('Probe', cand.length === sol.length && sol.length ? 'Beide Kandidaten bestehen die Probe ✓'
          : 'Nach der Probe bleibt: ' + setHTML(sol)),
        st('Ergebnis', setHTML(sol))
      ]
    };
  }

  /* grund */
  const a = rnz(-(d <= 4 ? 3 : 9), d <= 4 ? 3 : 9), b = rnz(-12, 12);
  const noSol = d >= 5 && coin(0.18);
  const c = noSol ? ri(-9, -1) : ri(0, d <= 4 ? 6 : 12);
  const s = new F(c * c - b, a);
  const sol = noSol ? [] : [s.v];
  return {
    promptHTML: '<span class="big">' + sqrtHTML(polyHTML([a, b])) + ' <span class="rel">=</span> ' + num(c) + '</span>',
    fields: [Fset(1)], flags: FLAG_EMPTY, check: checkNums(sol), solHTML: setHTML(sol),
    plot: { fns: [{ f: x => Math.sqrt(a * x + b) }], hlines: [{ y: c }], points: sol.map(x => ({ x: x, y: c })) },
    steps: noSol ? [
      st('Beobachtung', 'Eine Quadratwurzel ist immer ≥ 0.'),
      st('Widerspruch', 'Rechts steht ' + num(c) + ' &lt; 0 → unmöglich.'),
      st('Ergebnis', '𝕃 = { }')
    ] : [
      st('Quadrieren', polyHTML([a, b]) + ' = ' + c + '² = ' + num(c * c)),
      st('Auflösen', polyHTML([a, 0]) + ' = ' + num(c * c - b) + ' → ' + V() + ' = ' + s.html()),
      st('Probe', sqrtHTML(fmt(a * s.v + b)) + ' = ' + c + ' ✓'),
      st('Ergebnis', setHTML(sol))
    ]
  };
}

/* ============================================================
   10 · EXPONENTIALGLEICHUNGEN
   ============================================================ */
topic({
  id: 'expo', group: 'Gleichungen', name: 'Exponentialgleichungen', icon: 'aˣ',
  sub: 'x steht im Exponenten — logarithmieren ist der Schlüssel.',
  variants: [
    { id: 'basis', name: 'Gleiche Basis', desc: 'a^(f(x)) = a^(g(x)) ⟺ f(x) = g(x) — Exponentenvergleich.' },
    { id: 'log', name: 'Logarithmieren', desc: 'a^x = b → x = log_a(b) = ln(b)/ln(a).' },
    { id: 'efkt', name: 'e-Funktion', desc: 'c·e^(kx) = b → erst isolieren, dann ln anwenden.' },
    { id: 'subst', name: 'Substitution', desc: 'e^(2x) + p·e^x + q = 0 → u = e^x setzen, quadratisch lösen, zurück.' },
  ],
  formulas: [
    st('Logarithmus als Umkehrung', 'a<sup>x</sup> = b ⟺ x = log<sub>a</sub>(b) = ' + fracHTML('ln b', 'ln a')),
    st('e-Funktion', 'e<sup>x</sup> = b ⟺ x = ln(b) &nbsp;(b &gt; 0)'),
    st('Exponentenvergleich', 'a<sup>u</sup> = a<sup>v</sup> ⟺ u = v (a &gt; 0, a ≠ 1)'),
    st('Substitution', 'e<sup>2x</sup> = (e<sup>x</sup>)². Mit u = e<sup>x</sup> &gt; 0: nur positive u zurücksubstituieren.'),
  ],
  gen: function (d, v) { return genExpo(d, v); }
});

function genExpo(d, v) {
  if (v === 'basis') {
    const a = pick([2, 3, 5, 10]);
    const m = rnz(-6, 6), k = ri(2, 4), n = rnz(-9, 9);
    /* a^(x+m) = a^(kx+n) → x + m = kx + n → x = (m−n)/(k−1) */
    const s = new F(m - n, k - 1);
    return {
      promptHTML: '<span class="big">' + a + '<sup>' + polyHTML([1, m]) + '</sup> <span class="rel">=</span> ' + a + '<sup>' + polyHTML([k, n]) + '</sup></span>',
      fields: [Fnum()], check: checkNum(s.v), solHTML: V() + ' = ' + s.html(),
      steps: [
        st('Gleiche Basis', 'Beide Seiten haben die Basis ' + a + ' → die Exponenten müssen gleich sein.'),
        st('Exponentenvergleich', polyHTML([1, m]) + ' = ' + polyHTML([k, n])),
        st('Auflösen', polyHTML([1 - k, 0]) + ' = ' + num(n - m) + ' → ' + V() + ' = <b>' + s.html() + '</b>')
      ]
    };
  }
  if (v === 'efkt') {
    const a = pick([2, 3, 5, 10]);
    const k = pick(d <= 4 ? [1] : (d <= 7 ? [1, 2] : [1, 2, 4]));
    const c = rnz(-(d <= 5 ? 4 : 9), d <= 5 ? 4 : 9);
    const m = ri(1, a === 10 ? 3 : (d <= 5 ? 4 : 6));
    const pot = Math.pow(a, m);
    const rhs = c * pot;
    const sv = m / k;
    const kx = (k === 1 ? V() : k + V());
    return {
      promptHTML: '<span class="big">' + num(c) + '·' + a + '<sup>' + kx + '</sup> <span class="rel">=</span> ' + num(rhs) + '</span>',
      fields: [Fnum()], check: checkNum(sv), solHTML: V() + ' = ' + valHTML(sv),
      plot: { fns: [{ f: x => c * Math.pow(a, k * x) }], hlines: [{ y: rhs }], points: [{ x: sv, y: rhs }] },
      steps: [
        st('Potenz isolieren', a + '<sup>' + kx + '</sup> = ' + fracHTML(num(rhs), num(c)) + ' = ' + pot),
        st('Als Potenz schreiben', pot + ' = ' + a + '<sup>' + m + '</sup>'),
        st('Exponenten vergleichen', kx + ' = ' + m),
        st('Auflösen', V() + ' = ' + (k === 1 ? '' : fracHTML(m, k) + ' = ') + '<b>' + valHTML(sv) + '</b>')
      ]
    };
  }

  if (v === 'subst') {
    const a = pick([2, 3, 5]);
    const cap = a === 2 ? 4 : (a === 3 ? 3 : 2);
    const m1 = ri(0, Math.min(cap, d <= 6 ? 2 : 3)), m2 = ri(0, Math.min(cap, d <= 6 ? 3 : 4));
    const u1 = Math.pow(a, m1), u2 = Math.pow(a, m2);
    const p = -(u1 + u2), q = u1 * u2;
    const sol = uniqSorted([m1, m2]);
    return {
      promptHTML: '<span class="big">' + a + '<sup>2' + V() + '</sup>'
        + coefHTML(p, a + '<sup>' + V() + '</sup>', false) + coefHTML(q, '', false) + ' <span class="rel">=</span> 0</span>',
      fields: [Fset(2)], flags: FLAG_EMPTY, check: checkNums(sol), solHTML: setHTML(sol),
      steps: [
        st('Substitution', 'u = ' + a + '<sup>' + V() + '</sup>, dann ist ' + a + '<sup>2' + V() + '</sup> = u²'),
        st('Quadratische Gleichung', 'u²' + coefHTML(p, 'u', false) + coefHTML(q, '', false) + ' = 0 → u<sub>1</sub> = ' + u1 + ', u<sub>2</sub> = ' + u2),
        st('Rücksubstitution', a + '<sup>' + V() + '</sup> = ' + u1 + ' = ' + a + '<sup>' + m1 + '</sup> → ' + V() + ' = ' + m1
          + '<br>' + a + '<sup>' + V() + '</sup> = ' + u2 + ' = ' + a + '<sup>' + m2 + '</sup> → ' + V() + ' = ' + m2),
        st('Ergebnis', setHTML(sol))
      ]
    };
  }

  /* log */
  const a = pick(d <= 4 ? [2, 3, 5, 10] : [2, 3, 4, 5, 6, 7, 10]);
  const exact = d <= 4 || coin(0.4);
  const k = ri(1, d <= 6 ? 5 : 8);
  const b = exact ? Math.pow(a, k) : ri(2, 500);
  const s = Math.log(b) / Math.log(a);
  return {
    promptHTML: '<span class="big">' + a + '<sup>' + V() + '</sup> <span class="rel">=</span> ' + b + '</span>',
    fields: [Fnum('<i>x</i> =', exact ? 'ganze Zahl' : 'Zahl oder log-Term')], check: checkNum(s, 1e-4),
    solHTML: V() + ' = log<sub>' + a + '</sub>(' + b + ')' + (exact ? ' = ' + s : ' ≈ ' + fmt(s, 4)),
    plot: { fns: [{ f: x => Math.pow(a, x) }], hlines: [{ y: b }], points: [{ x: s, y: b }] },
    steps: exact ? [
      st('Potenz erkennen', b + ' = ' + a + '<sup>' + k + '</sup>'),
      st('Exponentenvergleich', a + '<sup>' + V() + '</sup> = ' + a + '<sup>' + k + '</sup> → ' + V() + ' = <b>' + k + '</b>')
    ] : [
      st('Logarithmieren', 'ln auf beiden Seiten: ' + V() + '·ln(' + a + ') = ln(' + b + ')'),
      st('Auflösen', V() + ' = ' + fracHTML('ln(' + b + ')', 'ln(' + a + ')') + ' = ' + fracHTML(fmt(Math.log(b)), fmt(Math.log(a)))),
      st('Ergebnis', V() + ' ≈ <b>' + fmt(s, 4) + '</b>')
    ]
  };
}

/* ============================================================
   11 · LOGARITHMUSGLEICHUNGEN
   ============================================================ */
topic({
  id: 'logar', group: 'Gleichungen', name: 'Logarithmusgleichungen', icon: 'ln',
  sub: 'Logarithmus auflösen heißt: beide Seiten in den Exponenten schreiben.',
  variants: [
    { id: 'grund', name: 'Grundform', desc: 'log_a(x) = b ⟺ x = a^b.' },
    { id: 'ln', name: 'ln mit linearem Term', desc: 'ln(ax+b) = c → ax + b = e^c.' },
    { id: 'regeln', name: 'Logarithmusgesetze', desc: 'Erst zusammenfassen (Summe → Produkt), dann auflösen — Definitionsmenge beachten!' },
    { id: 'differenz', name: 'Differenz von Logarithmen', desc: 'ln A − ln B = ln(A/B) — danach entlogarithmieren.' },
  ],
  formulas: [
    st('Definition', 'log<sub>a</sub>(x) = b ⟺ a<sup>b</sup> = x &nbsp;(a &gt; 0, a ≠ 1, x &gt; 0)'),
    st('Rechengesetze', 'log(u·v) = log u + log v &nbsp;·&nbsp; log(' + fracHTML('u', 'v') + ') = log u − log v &nbsp;·&nbsp; log(u<sup>n</sup>) = n·log u'),
    st('Basiswechsel', 'log<sub>a</sub>(x) = ' + fracHTML('ln x', 'ln a')),
    st('Definitionsmenge', 'Alle Argumente müssen &gt; 0 sein — Kandidaten am Ende prüfen!'),
  ],
  gen: function (d, v) { return genLog(d, v); }
});

function genLog(d, v) {
  if (v === 'ln') {
    const a = rnz(-(d <= 5 ? 4 : 9), d <= 5 ? 4 : 9), b = rnz(-9, 9);
    if (coin()) {
      const c = ri(1, d <= 5 ? 12 : 40);
      const sv = new F(c - b, a);
      return {
        promptHTML: '<span class="big">ln(' + polyHTML([a, b]) + ') <span class="rel">=</span> ln(' + c + ')</span>',
        fields: [Fnum()], check: checkNum(sv.v), solHTML: V() + ' = ' + sv.html(),
        plot: {
          fns: [{ f: x => Math.log(a * x + b), label: 'linke Seite' }, { f: x => Math.log(c), label: 'rechte Seite', color: 2 }],
          points: [{ x: sv.v, y: Math.log(c) }]
        },
        steps: [
          st('Beide Seiten sind Logarithmen', 'ln ist streng monoton — gleiche Werte bedeuten gleiche Argumente.'),
          st('Argumente gleichsetzen', polyHTML([a, b]) + ' = ' + c),
          st('Auflösen', polyHTML([a, 0]) + ' = ' + num(c - b) + ' → ' + V() + ' = <b>' + sv.html() + '</b>'),
          st('Definitionsmenge', 'Das Argument ist ' + c + ' &gt; 0 ✓')
        ]
      };
    }
    const bas = pick([2, 3, 5, 10]);
    const k = ri(1, d <= 5 ? 3 : 4);
    const rhs = Math.pow(bas, k);
    const sv = new F(rhs - b, a);
    return {
      promptHTML: '<span class="big">log<sub>' + bas + '</sub>(' + polyHTML([a, b]) + ') <span class="rel">=</span> ' + k + '</span>',
      fields: [Fnum()], check: checkNum(sv.v), solHTML: V() + ' = ' + sv.html(),
      plot: {
        fns: [{ f: x => Math.log(a * x + b) / Math.log(bas), label: 'linke Seite' }, { f: x => k, label: 'rechte Seite', color: 2 }],
        points: [{ x: sv.v, y: k }]
      },
      steps: [
        st('Definition anwenden', polyHTML([a, b]) + ' = ' + bas + '<sup>' + k + '</sup> = ' + rhs),
        st('Auflösen', polyHTML([a, 0]) + ' = ' + num(rhs - b) + ' → ' + V() + ' = <b>' + sv.html() + '</b>'),
        st('Probe', 'Argument = ' + rhs + ' &gt; 0 ✓')
      ]
    };
  }

  if (v === 'regeln') {
    /* log(x) + log(x+a) = log(b) → x(x+a) = b */
    const r = ri(1, d <= 6 ? 6 : 12);
    const a = ri(1, d <= 6 ? 6 : 12);
    const b = r * (r + a);
    const sol = [r];
    return {
      promptHTML: '<span class="big">lg(' + V() + ') + lg(' + polyHTML([1, a]) + ') <span class="rel">=</span> lg(' + b + ')</span>',
      fields: [Fset(2)], flags: FLAG_EMPTY, check: checkNums(sol), solHTML: setHTML(sol),
      plot: {
        fns: [{ f: x => (x > 0 ? Math.log10(x) + Math.log10(x + a) : NaN), label: 'linke Seite' },
        { f: x => Math.log10(b), label: 'rechte Seite', color: 2 }],
        points: [{ x: r, y: Math.log10(b) }]
      },
      steps: [
        st('Definitionsmenge', V() + ' &gt; 0 und ' + polyHTML([1, a]) + ' &gt; 0 → ' + V() + ' &gt; 0'),
        st('Logarithmusgesetz', 'lg(' + V() + ' · (' + polyHTML([1, a]) + ')) = lg(' + b + ')'),
        st('Argumente vergleichen', polyHTML([1, a, 0]) + ' = ' + b + ' → ' + polyHTML([1, a, -b]) + ' = 0'),
        st('pq-Formel', V() + '<sub>1</sub> = ' + r + ', ' + V() + '<sub>2</sub> = ' + num(-(a + r)) + ' → negativer Wert fällt wegen D weg'),
        st('Ergebnis', setHTML(sol))
      ]
    };
  }
  if (v === 'differenz') {
    /* ln(x+a) − ln(x+b) = c  →  (x+a)/(x+b) = e^c */
    const a = ri(1, 9), b = ri(1, 9);
    const kk = pick([2, 3, 4, 5]);
    const c = Math.log(kk);
    const K = Math.exp(c);
    let s = (K * b - a) / (1 - K);
    if (Math.abs(s) < 1e-9) s = 0;
    if (!isFinite(s) || s + a <= 0 || s + b <= 0 || !isNice(s)) return genLog(d, 'differenz');
    const cTxt = 'ln(' + kk + ')';
    return {
      promptHTML: '<span class="big">ln(' + polyHTML([1, a]) + ') − ln(' + polyHTML([1, b]) + ') <span class="rel">=</span> ' + cTxt + '</span>',
      fields: [Fnum('<i>x</i> ≈')], check: checkNum(s, 1e-4), solHTML: V() + ' ≈ ' + fmt(s, 4),
      plot: {
        fns: [{ f: x => Math.log(x + a) - Math.log(x + b), label: 'linke Seite' }, { f: x => c, label: 'rechte Seite', color: 2 }],
        points: [{ x: s, y: c }]
      },
      steps: [
        st('Zusammenfassen', 'ln(' + fracHTML(polyHTML([1, a]), polyHTML([1, b])) + ') = ' + cTxt),
        st('Entlogarithmieren', fracHTML(polyHTML([1, a]), polyHTML([1, b])) + ' = e<sup>' + cTxt + '</sup> = ' + fmt(K, 4)),
        st('Auflösen', polyHTML([1, a]) + ' = ' + fmt(K, 4) + '·(' + polyHTML([1, b]) + ') → ' + V() + ' ≈ <b>' + fmt(s, 4) + '</b>'),
        st('Definitionsmenge prüfen', 'Beide Argumente sind positiv ✓')
      ]
    };
  }
  /* grund */
  const a = pick(d <= 4 ? [2, 3, 10] : [2, 3, 4, 5, 10]);
  const b = ri(-2, d <= 5 ? 4 : 6);
  const s = Math.pow(a, b);
  return {
    promptHTML: '<span class="big">log<sub>' + a + '</sub>(' + V() + ') <span class="rel">=</span> ' + num(b) + '</span>',
    fields: [Fnum('<i>x</i> =', 'Zahl oder Bruch')], check: checkNum(s, 1e-6), solHTML: V() + ' = ' + valHTML(s),
    plot: {
      fns: [{ f: x => (x > 0 ? Math.log(x) / Math.log(a) : NaN), label: 'linke Seite' }, { f: x => b, label: 'rechte Seite', color: 2 }],
      points: [{ x: s, y: b }]
    },
    steps: [
      st('Definition anwenden', V() + ' = ' + a + '<sup>' + num(b) + '</sup>'),
      st('Ausrechnen', V() + ' = ' + (b < 0 ? fracHTML(1, Math.pow(a, -b)) : '' + s)),
      st('Probe', 'log<sub>' + a + '</sub>(' + valHTML(s) + ') = ' + num(b) + ' ✓')
    ]
  };
}

/* ============================================================
   12 · UNGLEICHUNGEN
   ============================================================ */
topic({
  id: 'ungleichung', group: 'Gleichungen', name: 'Ungleichungen', icon: '≤',
  sub: 'Wie Gleichungen — aber beim Multiplizieren/Teilen mit negativen Zahlen dreht sich das Zeichen um.',
  variants: [
    { id: 'linear', name: 'Linear', desc: 'a·x + b < c — normal umformen, bei Division durch negative Zahlen Zeichen drehen.' },
    { id: 'betrag', name: 'Beträge', desc: 'Betragsungleichungen zerfallen in zwei Fälle — je nach Vergleichszeichen ergibt sich entweder ein zusammenhängendes Intervall oder zwei getrennte Bereiche.' },
    { id: 'quadratisch', name: 'Quadratisch', desc: 'Nullstellen bestimmen, dann am Parabelverlauf ablesen, wo die Ungleichung gilt.' },
  ],
  formulas: [
    st('Vorzeichenregel', 'Multiplizieren oder Dividieren mit einer negativen Zahl dreht &lt; zu &gt; (und ≤ zu ≥).'),
    st('|T| < c', '⟺ −c &lt; T &lt; c → ein zusammenhängendes Intervall (c &gt; 0)'),
    st('|T| > c', '⟺ T &lt; −c oder T &gt; c → zwei getrennte Bereiche'),
    st('Quadratisch', 'Nach oben geöffnete Parabel: f(x) &lt; 0 <i>zwischen</i> den Nullstellen, f(x) &gt; 0 <i>außerhalb</i>.'),
  ],
  gen: function (d, v) { return genUngl(d, v); }
});

function genUngl(d, v) {
  const strict = coin();
  if (v === 'betrag') {
    const a = rnz(-(d <= 3 ? 3 : (d <= 6 ? 6 : 12)), d <= 3 ? 3 : (d <= 6 ? 6 : 12));
    const b = rnz(-(d <= 3 ? 6 : (d <= 6 ? 12 : 30)), d <= 3 ? 6 : (d <= 6 ? 12 : 30));
    const less = coin();
    const c = ri(1, d <= 4 ? 8 : 30);
    const op = less ? (strict ? '<' : '<=') : (strict ? '>' : '>=');
    /* |ax+b| OP c */
    const r1 = new F(-c - b, a).v, r2 = new F(c - b, a).v;
    const lo = Math.min(r1, r2), hi = Math.max(r1, r2);
    const inner = strict ? ['>', '<'] : ['>=', '<='];
    const outer = strict ? ['<', '>'] : ['<=', '>='];
    const sol = less ? [{ op: inner[0], b: lo }, { op: inner[1], b: hi }]
      : [{ op: outer[0], b: lo }, { op: outer[1], b: hi }];
    return {
      promptHTML: '<span class="big">|' + polyHTML([a, b]) + '| <span class="rel">' + OPHTML[op] + '</span> ' + c + '</span>',
      fields: [Fcond(2, less ? 'UND' : 'ODER')], check: checkCond(sol),
      solHTML: condText(sol, less ? 'und' : 'oder'),
      plot: {
        fns: [{ f: x => Math.abs(a * x + b), label: '|Ausdruck|' }], hlines: [{ y: c, label: 'Schwelle c' }],
        regions: less ? [{ from: lo, to: hi }] : [{ from: -1e6, to: lo }, { from: hi, to: 1e6 }]
      },
      steps: [
        st('Fallunterscheidung', less
          ? ('|T| ' + OPHTML[op] + ' ' + c + ' bedeutet ' + MINUS + c + ' ' + OPHTML[op] + ' T ' + OPHTML[op] + ' ' + c)
          : ('|T| ' + OPHTML[op] + ' ' + c + ' bedeutet T ' + OPHTML[op === '>' ? '<' : '<='] + ' ' + MINUS + c + ' oder T ' + OPHTML[op] + ' ' + c)),
        st('Einsetzen', MINUS + c + ' ' + (less ? OPHTML[op] : '…') + ' ' + polyHTML([a, b]) + ' ' + (less ? OPHTML[op] + ' ' + c : '') + (less ? '' : ' bzw. ' + polyHTML([a, b]) + ' ' + OPHTML[op] + ' ' + c)),
        st('Nach x auflösen', 'Division durch ' + num(a) + (a < 0 ? ' → Vergleichszeichen drehen sich um!' : '')),
        st('Ergebnis', condText(sol, less ? 'und' : 'oder'))
      ]
    };
  }
  if (v === 'quadratisch') {
    const r1o = rnz(-(d <= 5 ? 6 : 12), d <= 5 ? 6 : 12), r2o = rnz(-(d <= 5 ? 6 : 12), d <= 5 ? 6 : 12);
    if (r1o === r2o) return genUngl(d, 'linear');
    const lo = Math.min(r1o, r2o), hi = Math.max(r1o, r2o);
    const a = d <= 5 ? 1 : (coin(0.3) ? -1 : 1);
    const p = -(lo + hi), q = lo * hi;
    const co = [a, a * p, a * q];
    const less = coin();
    const op = less ? (strict ? '<' : '<=') : (strict ? '>' : '>=');
    /* a>0: f<0 zwischen; a<0: f<0 außerhalb */
    const between = (a > 0) === less;
    const inner = strict ? ['>', '<'] : ['>=', '<='];
    const outer = strict ? ['<', '>'] : ['<=', '>='];
    const sol = between ? [{ op: inner[0], b: lo }, { op: inner[1], b: hi }]
      : [{ op: outer[0], b: lo }, { op: outer[1], b: hi }];
    return {
      promptHTML: '<span class="big">' + polyHTML(co) + ' <span class="rel">' + OPHTML[op] + '</span> 0</span>',
      fields: [Fcond(2, between ? 'UND' : 'ODER')], check: checkCond(sol),
      solHTML: condText(sol, between ? 'und' : 'oder'),
      plot: {
        fns: [{ f: x => co[0] * x * x + co[1] * x + co[2] }], hlines: [{ y: 0 }],
        regions: between ? [{ from: lo, to: hi }] : [{ from: -1e6, to: lo }, { from: hi, to: 1e6 }],
        points: [{ x: lo, y: 0 }, { x: hi, y: 0 }]
      },
      steps: [
        st('Nullstellen', polyHTML(co) + ' = 0 → ' + V() + '<sub>1</sub> = ' + num(lo) + ', ' + V() + '<sub>2</sub> = ' + num(hi)),
        st('Öffnung', a > 0 ? 'a &gt; 0 → Parabel nach oben geöffnet.' : 'a &lt; 0 → Parabel nach unten geöffnet.'),
        st('Ablesen', between ? 'Die Ungleichung gilt <b>zwischen</b> den Nullstellen.' : 'Die Ungleichung gilt <b>außerhalb</b> der Nullstellen.'),
        st('Ergebnis', condText(sol, between ? 'und' : 'oder'))
      ]
    };
  }
  /* linear */
  const a = rnz(-(d <= 3 ? 5 : (d <= 6 ? 9 : 24)), d <= 3 ? 5 : (d <= 6 ? 9 : 24));
  const b = rnz(-(d <= 3 ? 9 : 40), d <= 3 ? 9 : 40);
  const c = rnz(-(d <= 3 ? 9 : 40), d <= 3 ? 9 : 40);
  const op0 = pick(['<', '<=', '>', '>=']);
  const bound = new F(c - b, a);
  const flip = a < 0;
  const FL = { '<': '>', '>': '<', '<=': '>=', '>=': '<=' };
  const opRes = flip ? FL[op0] : op0;
  const sol = [{ op: opRes, b: bound.v }];
  return {
    promptHTML: '<span class="big">' + polyHTML([a, b]) + ' <span class="rel">' + OPHTML[op0] + '</span> ' + num(c) + '</span>',
    fields: [Fcond(1, 'UND')], check: checkCond(sol), solHTML: condText(sol),
    plot: {
      fns: [{ f: x => a * x + b }], hlines: [{ y: c }],
      regions: [opRes[0] === '<' ? { from: -1e6, to: bound.v } : { from: bound.v, to: 1e6 }]
    },
    steps: [
      st('Zahl wegschaffen', polyHTML([a, 0]) + ' ' + OPHTML[op0] + ' ' + num(c - b)),
      st('Durch ' + num(a) + ' teilen', flip ? 'Achtung: ' + num(a) + ' &lt; 0 → das Vergleichszeichen dreht sich um!' : 'Der Koeffizient ist positiv, das Zeichen bleibt.'),
      st('Ergebnis', condText(sol))
    ]
  };
}

<script>
/* ============================================================

/* Koeffizient · ln(...) — ohne führenden Malpunkt, wenn der Koeffizient 1 ist */
function coefLn(k, e, arg) {
  const head = coefHTML(k, xpow(e), true);
  return (head === '1' ? '' : head + '·') + 'ln(' + arg + ')';
}

function xpow(e) {
  if (e === 0) return '';
  if (e === 1) return V();
  if (e === 0.5) return sqrtHTML(V());
  if (e === -0.5) return fracHTML('1', sqrtHTML(V()));
  if (e < 0) return fracHTML('1', pw(V(), -e));
  return V() + '<sup>' + e + '</sup>';
}
function powTermsHTML(ts) {
  return termsHTML(ts.map(t => ({ c: t.c, b: xpow(t.e) })));
}
function powF(ts) { return x => ts.reduce((s, t) => s + F.of(t.c).v * Math.pow(x, t.e), 0); }

function limPrompt(inner, to) {
  return '<span class="big"><span class="lim">lim<sub>' + V() + ' → ' + to + '</sub></span> ' + inner + '</span>';
}

function genLim(d, v) {
  if (v === 'null') {

    if (d <= 4 || coin(0.4)) {

      fields: [Fnum('Grenzwert =')], check: checkNum(res), solHTML: num(res),

      steps: [
        st('Einseitiger Grenzwert', side ? 'x nähert sich ' + num(a) + ' von rechts → x − ' + paren(a) + ' ist klein und <b>positiv</b>.'

        st('Grenzwert', '<b>' + (res > 0 ? '+∞' : MINUS + '∞') + '</b>')

      return {

        fields: [Fnum('Grenzwert =')], check: checkNum(kf), solHTML: '' + kf,

        steps: [
          st('Standardgrenzwert', 'lim<sub>x→0</sub> ' + fracHTML('sin(x)', 'x') + ' = 1'),
          st('Umformen', fracHTML('sin(' + KX + ')', V()) + ' = ' + kf + ' · ' + fracHTML('sin(' + KX + ')', KX)),
          st('Grenzwert', '= ' + kf + ' · 1 = <b>' + kf + '</b>')
        ]
      };
    }
    if (k === 'exp') {
      const a = ri(1, 4);
      return {
        promptHTML: limPrompt(num(a) + '·e<sup>−' + V() + '</sup>', '∞'),
        fields: [Fnum('Grenzwert =')], check: checkNum(0), solHTML: '0',
        plot: { fns: [{ f: x => (x > 0 ? a * Math.exp(-x) : NaN), label: 'f' }], hlines: [{ y: 0 }] },
        steps: [st('Umschreiben', num(a) + '·e<sup>−x</sup> = ' + fracHTML(num(a), 'e<sup>' + V() + '</sup>')),

      steps: [st('Wachstumsvergleich', 'x wächst deutlich schneller als ln(x).'),
      st('Folge', 'Der Nenner dominiert → der Bruch geht gegen <b>0</b>.')]

    if (k === 'euler') {
      const a = ri(1, 4);
      const res = Math.exp(a);
      return {
        promptHTML: limPrompt('(1 + ' + fracHTML(num(a), V()) + ')<sup>' + V() + '</sup>', '∞'),
        fields: [Fnum('Grenzwert ≈', 'z. B. e^2')], check: checkNum(res, 1e-4), solHTML: 'e<sup>' + a + '</sup> ≈ ' + fmt(res, 4),
        plot: { fns: [{ f: x => (x > 0 ? Math.pow(1 + a / x, x) : NaN), label: 'f' }], hlines: [{ y: res }] },
        steps: [st('Standardgrenzwert', 'lim<sub>x→∞</sub> (1 + ' + fracHTML('a', 'x') + ')<sup>x</sup> = e<sup>a</sup>'),
        st('Einsetzen', 'a = ' + a + ' → <b>e<sup>' + a + '</sup> ≈ ' + fmt(res, 4) + '</b>')]
      };
    }
    const n = ri(2, 5);
    return {
      promptHTML: limPrompt(fracHTML(V() + '<sup>' + n + '</sup>', 'e<sup>' + V() + '</sup>'), '∞'),
      fields: [Fnum('Grenzwert =')], check: checkNum(0), solHTML: '0',
      plot: { fns: [{ f: x => (x > 0 ? Math.pow(x, n) / Math.exp(x) : NaN), label: 'f' }], hlines: [{ y: 0 }] },
      steps: [st('Wachstumsvergleich', 'e<sup>x</sup> wächst schneller als jede Potenz x<sup>n</sup>.'),
      st('Grenzwert', '<b>0</b>')]

  else if (nz === nn) { res = az / an; why = 'Gleicher Grad → Quotient der Leitkoeffizienten ' + fracHTML(num(az), num(an)) + '.'; }

function genAbl(d, v) {
  if (v === 'kombi') return ablKombi(d);
  if (v === 'potenz' || v === 'zweite' || v === 'stelle') {
    const n = d <= 3 ? 2 : (d <= 6 ? 3 : 4);
    let ts = [];
    const exps = shuffle([n, n - 1, n - 2, 1, 0]).slice(0, Math.min(4, 2 + Math.floor(d / 3)));
    if (exps.indexOf(n) < 0) exps.push(n);
    uniqSorted(exps).reverse().forEach(e => { if (e >= 0) ts.push({ c: rnz(-(d <= 4 ? 5 : 12), d <= 4 ? 5 : 12), e: e }); });
    if (d >= 7 && v === 'potenz') { if (coin()) ts.push({ c: rnz(-6, 6), e: -1 }); else ts.push({ c: rnz(-6, 6), e: 0.5 }); }
    const d1 = dTerms(ts), d2 = dTerms(d1);
    const hasSpecial = ts.some(t => t.e < 0 || t.e === 0.5);
    const dom = hasSpecial ? { lo: 0.6, hi: 3.1 } : { lo: -2.7, hi: 2.9 };
    if (v === 'stelle') {
      const x0 = rnz(-4, 4);
      const val = powF(d1)(x0);
      return {
        promptHTML: '<span class="big">f(' + V() + ') = ' + powTermsHTML(ts) + '</span>',

        steps: [
          st('Ableiten', 'f′(' + V() + ') = ' + powTermsHTML(d1)),
          st('Einsetzen', 'f′(' + num(x0) + ') = ' + powTermsHTML(d1).replace(/<i>x<\/i>/g, '(' + num(x0) + ')')),
          st('Ergebnis', '<b>' + fmt(val) + '</b> — das ist die Steigung der Tangente an dieser Stelle.')
        ]
      };
    }
    if (v === 'zweite') {
      return {
        promptHTML: '<span class="big">f(' + V() + ') = ' + powTermsHTML(ts) + '</span>',
        subPrompt: 'Bestimme f″(x).',
        fields: [Fexpr('f″(<i>x</i>) =', 'z. B. 6x - 4')], check: checkExpr(powF(d2), dom),
        solHTML: 'f″(' + V() + ') = ' + powTermsHTML(d2),
        steps: [
          st('Erste Ableitung', 'f′(' + V() + ') = ' + powTermsHTML(d1)),
          st('Nochmal ableiten', 'f″(' + V() + ') = ' + powTermsHTML(d2)),
          st('Bedeutung', 'f″ beschreibt die Krümmung: f″ &gt; 0 → Linkskurve, f″ &lt; 0 → Rechtskurve.')
        ]
      };
    }
    return {
      promptHTML: '<span class="big">f(' + V() + ') = ' + powTermsHTML(ts) + '</span>',
      subPrompt: 'Bestimme f′(x).',
      fields: [Fexpr('f′(<i>x</i>) =')], check: checkExpr(powF(d1), dom),
      solHTML: 'f′(' + V() + ') = ' + powTermsHTML(d1),
      plot: { fns: [{ f: powF(ts), label: 'f' }, { f: powF(d1), label: 'f′', color: 2 }] },
      steps: [
        st('Regel', 'Jeder Summand einzeln: (c·x<sup>n</sup>)′ = c·n·x<sup>n−1</sup>'),
        st('Term für Term', ts.map(t => '(' + coefHTML(t.c, xpow(t.e), true) + ')′ = ' + (t.e === 0 ? '0' : coefHTML(F.of(t.c).mul(t.e), xpow(t.e - 1), true))).join('<br>')),
        st('Ergebnis', 'f′(' + V() + ') = <b>' + powTermsHTML(d1) + '</b>')
      ]
    };
  }

  if (v === 'produkt') {
    const kind = pick(d <= 4 ? ['poly'] : (d <= 7 ? ['poly', 'exp', 'sin'] : ['poly', 'exp', 'sin', 'ln']));
    const a = rnz(-5, 5), b = rnz(-9, 9), c = rnz(-5, 5), e = rnz(-9, 9);
    if (kind === 'poly') {

          st('Produktregel', 'f′ = u′v + uv′ = ' + num(a) + '·(' + polyHTML([c, 0, e]) + ') + (' + polyHTML([a, b]) + ')·(' + polyHTML([2 * c, 0]) + ')'),
          st('Zusammenfassen', 'f′(' + V() + ') = <b>' + polyHTML([3 * a * c, 2 * b * c, a * e]) + '</b>')

    if (kind === 'exp') {

        subPrompt: 'Bestimme f′(x).',
        fields: [Fexpr('f′(<i>x</i>) =', 'z. B. (2x+x^2)e^x')], check: checkExpr(df, { lo: -1.8, hi: 1.9 }), _f: x => Math.pow(x, n) * Math.exp(k * x),
        solHTML: 'f′(' + V() + ') = ' + coefHTML(n, xpow(n - 1), true) + '·e<sup>' + kx + '</sup>' + addHTML(kx + '<sup>' + n + '</sup>·e<sup>' + kx + '</sup>'),
        steps: [
          st('u und v', 'u = ' + pw(V(), n) + ' → u′ = ' + coefHTML(n, xpow(n - 1), true) + '<br>v = e<sup>' + kx + '</sup> → v′ = ' + num(k) + '·e<sup>' + kx + '</sup> (Kettenregel)'),
          st('Produktregel', 'f′ = u′v + uv′'),
          st('Ausklammern', 'f′(' + V() + ') = ' + pw(V(), n - 1) + '·e<sup>' + kx + '</sup>·(' + n + addHTML(kx) + ')')
        ]
      };
    }
    if (kind === 'sin') {

function genExtrem(d, v) {
  if (v === 'wendestelle') {
    const a = d <= 5 ? 1 : rnz(-3, 3);
    const w = rnz(-6, 6);
    const b = -3 * a * w;
    const c = rnz(-9, 9), e = rnz(-9, 9);
    const co = [a, b, c, e];
    return {
      promptHTML: '<span class="big">f(' + V() + ') = ' + polyHTML(co) + '</span>',
      subPrompt: 'Bestimme die Wendestelle.',
      fields: [Fnum('<i>x</i><sub>W</sub> =')], check: checkNum(w), solHTML: V() + '<sub>W</sub> = ' + num(w),
      plot: { fns: [{ f: polyF(co), label: 'f' }], points: [{ x: w, y: polyF(co)(w) }] },
      steps: [
        st('Zweite Ableitung', 'f′(x) = ' + polyHTML([3 * a, 2 * b, c]) + ' → f″(x) = ' + polyHTML([6 * a, 2 * b])),
        st('f″ = 0 setzen', polyHTML([6 * a, 2 * b]) + ' = 0 → ' + V() + ' = ' + fracHTML(num(-2 * b), num(6 * a)) + ' = ' + num(w)),
        st('Bestätigen', 'f‴(x) = ' + num(6 * a) + ' ≠ 0 → es ist wirklich eine Wendestelle.'),
        st('Ergebnis', V() + '<sub>W</sub> = <b>' + num(w) + '</b>')
      ]
    };
  }
  if (v === 'optimierung') {
    return genOpt(d);
  }
  /* extremstellen */
  let r1 = rnz(-6, 6), r2 = rnz(-6, 6);
  while (r2 === r1 || (r1 + r2) % 2 !== 0) { r1 = rnz(-6, 6); r2 = rnz(-6, 6); }
  const lo = Math.min(r1, r2), hi = Math.max(r1, r2);
  const a = 1, b = -3 * (r1 + r2) / 2, c = 3 * r1 * r2, e = rnz(-9, 9);
  const co = [a, b, c, e];
  const sol = uniqSorted([r1, r2]);
  const fpp = x => 6 * a * x + 2 * b;
  return {
    promptHTML: '<span class="big">f(' + V() + ') = ' + polyHTML(co) + '</span>',
    subPrompt: 'Bestimme die Extremstellen (x-Werte).',
    fields: [Fset(2, 'Extremstellen')], flags: FLAG_EMPTY, check: checkNums(sol), solHTML: setHTML(sol),
    plot: { fns: [{ f: polyF(co), label: 'f' }, { f: polyF([3 * a, 2 * b, c]), label: 'f′', color: 2 }], points: sol.map(x => ({ x: x, y: polyF(co)(x) })) },
    steps: [
      st('Ableiten', 'f′(x) = ' + polyHTML([3 * a, 2 * b, c])),
      st('f′ = 0 setzen', polyHTML([3 * a, 2 * b, c]) + ' = 0 &nbsp;|&nbsp; : 3 → ' + polyHTML([1, 2 * b / 3, c / 3]) + ' = 0'),
      st('pq-Formel', V() + '<sub>1</sub> = ' + num(lo) + ', ' + V() + '<sub>2</sub> = ' + num(hi)),
      st('Art bestimmen', 'f″(x) = ' + polyHTML([6 * a, 2 * b]) + '<br>f″(' + num(lo) + ') = ' + fmt(fpp(lo)) + ' → ' + (fpp(lo) < 0 ? 'Hochpunkt' : 'Tiefpunkt') +
        '<br>f″(' + num(hi) + ') = ' + fmt(fpp(hi)) + ' → ' + (fpp(hi) < 0 ? 'Hochpunkt' : 'Tiefpunkt')),
      st('Ergebnis', setHTML(sol))
    ]
  };
}

      check: checkMulti([x, A], 1e-3), solHTML: V() + ' = ' + sqrtHTML(fracHTML(c, 3)) + ' ≈ ' + fmt(x, 4) + ', A ≈ ' + fmt(A, 4),
      steps: [
        st('Zielfunktion', 'A(x) = 2x · (' + c + ' − x²) = ' + (2 * c) + 'x − 2x³'),
        st('Ableiten', 'A′(x) = ' + (2 * c) + ' − 6x² = 0 → x² = ' + fmt(c / 3)),
        st('Lösen', 'x = ' + sqrtHTML(fmt(c / 3)) + ' ≈ ' + fmt(x, 4) + ' (nur positiver Wert sinnvoll)'),
        st('Ergebnis', 'A<sub>max</sub> ≈ <b>' + fmt(A, 4) + '</b>, A″ = −12x &lt; 0 ✓')
      ]
    };
  }
  const Vol = ri(1, 20) * 100;
  const r = Math.cbrt(Vol / (2 * Math.PI));
  const h = Vol / (Math.PI * r * r);
  return {
    promptHTML: '<span class="big">Dose mit ' + Vol + ' cm³ Volumen, O = 2πr² + 2πrh.<br>Minimale Oberfläche — gesucht sind r und h?</span>', wordy: true,
    subPrompt: 'O = 2πr² + 2πrh — gesucht sind r und h.',
    fields: [{ type: 'num', label: '<i>r</i> ≈ (in cm)' }, { type: 'num', label: '<i>h</i> ≈ (in cm)' }],
    check: checkMulti([r, h], 1e-3), solHTML: 'r ≈ ' + fmt(r, 4) + ' cm, h ≈ ' + fmt(h, 4) + ' cm',
    steps: [
      st('Nebenbedingung', 'V = πr²h = ' + Vol + ' → h = ' + fracHTML(Vol, 'πr²')),
      st('Zielfunktion', 'O(r) = 2πr² + 2πr·' + fracHTML(Vol, 'πr²') + ' = 2πr² + ' + fracHTML(2 * Vol, 'r')),
      st('Ableiten', 'O′(r) = 4πr − ' + fracHTML(2 * Vol, 'r²') + ' = 0 → r³ = ' + fracHTML(Vol, '2π')),
      st('Ergebnis', 'r = ' + sqrtHTML(fracHTML(Vol, '2π'), 3) + ' ≈ <b>' + fmt(r, 4) + ' cm</b>, h ≈ <b>' + fmt(h, 4) + ' cm</b> — es gilt h = 2r.')
    ]
  };
}

  ],

  ],
